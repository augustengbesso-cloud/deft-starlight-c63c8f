<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2NA-MAINT-PROD — Maintenance & Carburant</title>
<meta name="theme-color" content="#2E6DA6" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#EAF4FC; --panel:#FFFFFF; --panelR:#E3F0FB; --border:#C9DEEF; --borderL:#A9C7E0;
  --text:#16324F; --muted:#5B7A93; --accent:#F2A63C; --steel:#3B82C4; --success:#2E9E5B; --danger:#D9483A;
  --sidebar-bg:#2E6DA6; --sidebar-bg2:#1E5488; --sidebar-text:#FFFFFF; --sidebar-muted:#CBE1F4;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
.mono{font-family:'IBM Plex Mono',monospace;}
.oswald{font-family:'Oswald',sans-serif;}
#app{display:flex;height:100vh;height:100dvh;}
/* Sidebar */
#sidebar{width:220px;flex-shrink:0;height:100%;overflow-y:auto;background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg2) 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.brand{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg) 100%);z-index:2;}
.brand-row{display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.brand-logo{width:28px;height:28px;border-radius:8px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.brand-title{font-family:'Oswald',sans-serif;letter-spacing:.05em;font-weight:600;font-size:14px;text-transform:uppercase;color:var(--text);}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;}
#sidebar .brand-title{color:var(--sidebar-text);}
#sidebar .brand-sub{color:var(--sidebar-muted);}
nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:none;background:transparent;color:var(--sidebar-muted);font-size:14px;text-align:left;cursor:pointer;border-left:2px solid transparent;font-family:'Inter',sans-serif;}
.navbtn:hover{color:var(--sidebar-text);background:rgba(255,255,255,.06);}
.navbtn.active{background:rgba(255,255,255,.1);color:var(--accent);border-left:2px solid var(--accent);}
.navbtn svg{flex-shrink:0;}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sidebar-muted);padding:14px 12px 4px;font-family:'Oswald',sans-serif;opacity:.7;}
.nav-section:first-child{padding-top:4px;}
.sidebar-foot{padding:12px 16px;font-size:10px;color:var(--sidebar-muted);border-top:1px solid rgba(255,255,255,.1);}
/* Main */
#main{flex:1;min-width:0;overflow-y:auto;height:100%;}
.wrap{max-width:1500px;margin:0;padding:24px 32px;}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0 0 2px;}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 20px;}
.headrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
/* Plate */
.plate{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 1px 3px rgba(0,0,0,.25);transition:border-color .15s ease;}
.plate:hover{border-color:var(--borderL);}
.kpi-clickable{cursor:pointer;transition:transform .12s ease, border-color .15s ease;}
.kpi-clickable:hover{border-color:var(--accent);transform:translateY(-2px);}
.kpi-clickable:active{transform:translateY(0);}
.legend-clickable{cursor:pointer;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background .12s ease;}
.legend-clickable:hover{background:var(--panelR);}
.p16{padding:16px;} .p14{padding:14px;}
/* Grid */
.grid{display:grid;gap:12px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-fleet{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.grid-status{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
.grid-settings{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}
/* KPI card */
.kpi-label{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:var(--muted);letter-spacing:.03em;}
.kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.kpi-value{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:-.02em;}
.kpi-unit{font-size:12px;color:var(--muted);margin-left:4px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
/* Buttons */
button{font-family:'Inter',sans-serif;}
.btn{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--borderL);background:var(--panelR);color:var(--text);transition:transform .08s ease, box-shadow .08s ease;}
.btn:hover{box-shadow:0 1px 4px rgba(0,0,0,.12);}
.btn:active{transform:scale(.97);}
.btn:hover{opacity:.85;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1A1508;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;}
#mobile-menu-btn{display:none;color:var(--sidebar-text);flex-shrink:0;}
#sidebar-close-btn{display:none;flex-shrink:0;}
#mobile-backdrop{display:none;}
#bottom-nav{display:none;}
.icon-btn:hover{color:var(--text);}
/* Inputs */
input,select,textarea{background:var(--bg);border:1px solid var(--borderL);color:var(--text);border-radius:5px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;}
label.field span{color:var(--muted);}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.formgrid .span2{grid-column:1/-1;}
/* Led */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);}
.right{text-align:right;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{background:var(--panel);border:1px solid var(--borderL);border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;margin:0;}
.modal-body{padding:20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.wo-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panelR);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;}
.wo-headband{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
.wo-headband-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:'Oswald',sans-serif;}
/* misc */
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.wrapwrap{flex-wrap:wrap;}
.card-item{background:var(--panelR);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 0;color:var(--muted);gap:8px;font-size:14px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panelR);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;text-transform:uppercase;background:var(--panelR);color:var(--muted);border:1px solid transparent;}
.badge-danger{background:var(--danger);color:#fff;}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--sidebar-bg);}
#sticky-header{position:sticky;top:0;z-index:10;}
#page-title-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:16px 32px 14px;box-shadow:0 2px 6px rgba(0,0,0,.05);}
#page-title-bar h1{margin:0 0 2px;}
#page-title-bar .subtitle{margin:0;}
#page-title-bar .headrow{margin-bottom:0;}
#offline-banner{position:relative;z-index:11;padding:7px 16px;font-size:12.5px;font-weight:500;text-align:center;color:#fff;}
#sync-text{display:none;}
#refresh-btn{padding:5px 10px;font-size:12px;flex-shrink:0;color:var(--sidebar-text);border-color:rgba(255,255,255,.3);}
#refresh-btn:hover{background:rgba(255,255,255,.12);}
#logout-btn-top{padding:5px 10px;font-size:12px;flex-shrink:0;color:var(--sidebar-text);border-color:rgba(255,255,255,.3);}
#logout-btn-top:hover{background:rgba(255,255,255,.12);}
#user-info-top{font-size:12px;color:var(--sidebar-muted);}
#user-info-top b{color:var(--sidebar-text);font-weight:500;}
#topbar-actions{margin-left:auto;display:flex;gap:6px;align-items:center;}
@media(max-width:700px){
  #sidebar{width:64px;}
  .brand-sub, .navbtn span.label, .sidebar-foot, .nav-section{display:none;}
  .brand-title{display:none;}
  .navbtn{justify-content:center;}
  .formgrid{grid-template-columns:1fr;}
  #mobile-menu-btn{display:inline-flex;}
  #sidebar-close-btn{display:none;}
  #sidebar{
    position:fixed; top:0; left:0; bottom:0; width:80vw; max-width:300px;
    transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1); z-index:60;
    box-shadow:8px 0 32px rgba(0,0,0,.4);
  }
  #sidebar.mobile-open{transform:translateX(0);}
  #sidebar.mobile-open .brand-sub,
  #sidebar.mobile-open .navbtn span.label,
  #sidebar.mobile-open .sidebar-foot,
  #sidebar.mobile-open .nav-section,
  #sidebar.mobile-open .brand-title{display:block;}
  #sidebar.mobile-open .navbtn{justify-content:flex-start;}
  #sidebar.mobile-open{width:80vw;}
  #sidebar.mobile-open #sidebar-close-btn{display:inline-flex;color:var(--sidebar-text);}
  #sidebar.mobile-open .brand-row{justify-content:space-between;}
  #mobile-backdrop{display:none;position:fixed;inset:0;background:rgba(10,16,24,.55);backdrop-filter:blur(1px);z-index:55;}
  #mobile-backdrop.show{display:block;}
  body{padding-bottom:66px;}
  #bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; height:64px;
    background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg2) 100%);
    border-top:1px solid rgba(255,255,255,.12); z-index:40; padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 16px rgba(0,0,0,.2);
  }
  .bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--sidebar-muted);font-size:10px;font-family:'Inter',sans-serif;padding:6px 2px;position:relative;}
  .bn-btn svg{width:20px;height:20px;}
  .bn-btn.active{color:var(--accent);}
  .bn-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);}
  .bn-btn-more{color:var(--sidebar-muted);}
  .btn{min-height:38px;}
  #topbar .btn{font-size:11.5px;padding:7px 10px;}
  #topbar-actions{gap:4px;}
  #user-info-top{display:none;}
  #page-title-bar{padding:14px 16px 12px;}
  #page-title-bar h1{font-size:20px;}
  .wrap{padding:16px !important;}
  .grid-kpi{grid-template-columns:repeat(2,1fr);}
  .modal{max-width:94vw !important;max-height:88vh;}
  .modal-body{max-height:70vh;overflow-y:auto;}
  /* Tableaux : défilement horizontal au lieu d'être coupés */
  .plate > table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{font-size:12.5px;}
  th,td{white-space:nowrap;}
  /* Barre d'outils OT et rangées de boutons : défilement horizontal façon "chips" */
  .wo-toolbar{flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:10px;}
  .wo-toolbar::-webkit-scrollbar{display:none;}
  .wo-toolbar .btn{flex-shrink:0;}
  .headrow{flex-direction:column;align-items:stretch !important;gap:10px;}
  .headrow .row{flex-wrap:wrap;}
  /* Cibles tactiles confortables + pas de zoom auto iOS sur les champs */
  .btn{min-height:42px;}
  input,select,textarea{font-size:16px !important;min-height:42px;}
  textarea{min-height:80px;}
  .icon-btn{min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;}
}
@media(max-width:420px){
  .grid-kpi{grid-template-columns:1fr 1fr;}
  .bn-btn{font-size:9px;}
}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);border-radius:6px;padding:3px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:5px;font-size:13px;cursor:pointer;color:var(--muted);}
.auth-tab.active{background:var(--panelR);color:var(--text);}
.auth-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;}
.auth-field span{color:var(--muted);}
.auth-error{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:16px;}
</style>
</head>
<body>
<div id="auth-screen" style="display:none;"></div>
<div id="mobile-backdrop"></div>
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row"><img src="icon.svg" alt="Logo" class="brand-logo"/><span class="brand-title">2NA-MAINT-PROD</span><button class="icon-btn" id="sidebar-close-btn" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="brand-sub">Maintenance & Carburant</div>
      <div id="env-badge" style="margin-top:8px;"></div>
    </div>

      <div id="fleet-count"></div>
    </div>
  </aside>
  <main id="main">
    <div id="sticky-header">
      <div id="offline-banner" style="display:none;"></div>
      <div id="topbar">
        <button class="icon-btn" id="mobile-menu-btn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <span id="user-info-top"></span>
        <span class="led" id="sync-dot" style="background:var(--muted)"></span>
        <span id="sync-text">Connexion…</span>
        <div id="topbar-actions">
          <button class="btn btn-ghost" id="refresh-btn">Actualiser</button>
          <button class="btn btn-ghost" id="logout-btn-top">Déconnexion</button>
        </div>
      </div>
      <div id="page-title-bar" style="display:none;"></div>
    </div>
    <div class="wrap" id="content"></div>
  </main>
</div>
<nav id="bottom-nav"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ============ SUPABASE (multi-device sync) ============ */
const SUPABASE_URL = "https://evfqdybotjkjnnwtzrgq.supabase.co";
const SUPABASE_KEY = "sb_publishable_c_x0uRWIxCEbTcAeijFypA_FAOo2kFn";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: {
    fetch: (url, options={}) => fetch(url, { ...options, cache: 'no-store' })
  }
});

/* ============ AUTHENTIFICATION & RÔLES ============ */
const ROLE_LABELS = {
  admin: 'Administrateur', planificateur: 'Planificateur maintenance',
  technicien: 'Technicien terrain', rh: 'Responsable RH'
};
const FONCTIONS = ["Technicien","Planificateur","Superviseur","Responsable","Administrateur"];
const NIVEAUX_HIER = [1,2,3,4,5];
const STATUTS_COMPTE = ["Actif","Inactif"];
const NIVEAUX_APPROBATION = ["Technique","Financière","Stratégique"];
const MODULES_ACCES = [
  {id:'maintenance', label:'Maintenance (OT, Préventif, Demandes d\'intervention)'},
  {id:'stock', label:'Stock / Pièces de rechange'},
  {id:'achats', label:'Achats (DA / BC)'},
  {id:'rh', label:'RH'},
  {id:'reporting', label:'Reporting / KPI'},
];
const NIVEAUX_ACCES = ["Aucun","Lecture seule","Écriture","Validation","Administration complète"];
const EMAIL_DOMAIN = '2na-erp.internal';
function identifiantToEmail(id){ return String(id||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'')+'@'+EMAIL_DOMAIN; }
let currentUser = null; // { id, email, role, nomComplet, identifiant, fonction, niveauHierarchique, statutCompte, superieurId, niveauApprobation, modules }
let authTab = 'login';
let authError = '';

function envBadgeHtml(){
  const host = window.location.hostname;
  let label, full, color, bg;
  if(host === '2na-entreprise.github.io'){ label = 'PUBLIQUE'; full = 'Version publique — 2NA-MAINT-PROD'; color = '#4CAF6D'; bg = 'rgba(76,175,109,.12)'; }
  else if(host === 'localhost' || host === '127.0.0.1'){ label = 'LOCAL'; full = 'Local — sur cet ordinateur'; color = '#8B939A'; bg = 'rgba(139,147,154,.12)'; }
  else { label = 'TEST'; full = 'Version test — '+host; color = '#F2A63C'; bg = 'rgba(242,166,60,.12)'; }
  return `<span title="${full}" style="display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:${color};background:${bg};border:1px solid ${color};border-radius:20px;padding:3px 10px;white-space:nowrap;">● ${label}</span>`;
}
function renderEnvBadges(){
  const b1 = document.getElementById('env-badge'); if(b1) b1.innerHTML = envBadgeHtml();
  const b2 = document.getElementById('env-badge-auth'); if(b2) b2.innerHTML = envBadgeHtml();
}
function renderAuthScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('auth-screen');
  el.style.display = 'flex';
  el.innerHTML = `
  <div class="auth-card">
    <div class="brand-row" style="justify-content:center;margin-bottom:8px;">
      <img src="icon.svg" alt="Logo" class="brand-logo" style="width:36px;height:36px;"/><span class="brand-title" style="font-size:16px;">2NA-MAINT-PROD</span>
    </div>
    <div id="env-badge-auth" style="display:flex;justify-content:center;margin-bottom:16px;"></div>
    <h3 class="oswald" style="text-align:center;text-transform:uppercase;font-size:14px;color:var(--muted);margin:0 0 20px;">Connexion</h3>
    <div class="auth-error">${esc(authError)}</div>
    <label class="auth-field"><span>Identifiant</span><input id="auth-id" placeholder="Ex: USR001" style="text-transform:uppercase;"/></label>
    <label class="auth-field"><span>Mot de passe</span><input id="auth-pass" type="password" placeholder="••••••••"/></label>
    <button class="btn btn-accent" id="auth-submit" style="width:100%;justify-content:center;margin-top:6px;">Se connecter</button>
    <p style="font-size:11px;color:var(--muted);margin-top:12px;">Pas encore de compte ? Un administrateur doit t'en créer un dans le module "Utilisateurs".</p>
  </div>`;
  authTab = 'login';
  document.getElementById('auth-submit').addEventListener('click', handleAuthSubmit);
  [document.getElementById('auth-id'), document.getElementById('auth-pass')].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
  });
  renderEnvBadges();
}

let pendingNomComplet = '';
async function handleAuthSubmit(){
  const identifiant = document.getElementById('auth-id').value.trim().toUpperCase();
  const pass = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-submit');
  authError = '';
  if(!identifiant || !pass){ authError = 'Identifiant et mot de passe requis'; renderAuthScreen(); return; }
  const email = identifiantToEmail(identifiant);
  btn.disabled = true; btn.textContent = '...';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterAuthSuccess();
  }catch(e){
    authError = (e && e.message) ? traduireErreurAuth(e.message) : String(e);
    renderAuthScreen();
  }
  btn.disabled = false; btn.textContent = 'Se connecter';
}
function traduireErreurAuth(msg){
  if(/Invalid login credentials/i.test(msg)) return 'Identifiant ou mot de passe incorrect';
  if(/already registered/i.test(msg)) return 'Cet identifiant est déjà utilisé';
  if(/Password should be/i.test(msg)) return 'Mot de passe trop court (6 caractères minimum)';
  if(/Compte désactivé/i.test(msg)) return msg;
  return msg;
}
async function fetchUserRole(userId, email, nomComplet){
  try{
    const { data } = await sb.from('user_roles').select('*').eq('user_id', userId).maybeSingle();
    if(data) return data;
  }catch(e){}
  const fresh = { user_id:userId, email, nom_complet: nomComplet||email, role:'technicien',
    identifiant:'', fonction:'Technicien', niveau_hierarchique:1, statut_compte:'Actif', affectation:'Les deux', niveau_approbation:'Technique', modules:{} };
  try{ await sb.from('user_roles').insert(fresh); }catch(e){}
  return fresh;
}
async function afterAuthSuccess(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderAuthScreen(); return; }
  const roleRow = await fetchUserRole(session.user.id, session.user.email, pendingNomComplet);
  pendingNomComplet = '';
  if(roleRow.statut_compte==='Inactif'){
    await sb.auth.signOut();
    currentUser = null;
    authError = 'Compte désactivé — contacte un administrateur.';
    renderAuthScreen();
    return;
  }
  currentUser = { id: session.user.id, email: session.user.email, role: roleRow.role, nomComplet: roleRow.nom_complet || session.user.email,
    identifiant: roleRow.identifiant||'', fonction: roleRow.fonction||'Technicien', niveauHierarchique: roleRow.niveau_hierarchique||1,
    statutCompte: roleRow.statut_compte||'Actif', affectation: roleRow.affectation||'Les deux', superieurId: roleRow.superieur_id||null, niveauApprobation: roleRow.niveau_approbation||'Technique',
    modules: roleRow.modules||{} };
  try{ await sb.rpc('update_last_login'); }catch(e){}
  allUsers = [];
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await init();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  authTab = 'login'; authError = '';
  renderAuthScreen();
}

async function loadRemote(){
  try{
    const { data, error } = await sb.from('erp_data').select('data, updated_at').eq('id','main').maybeSingle();
    if(error) return { ok:false, error: error.message || JSON.stringify(error) };
    if(!data) return { ok:false, error: "Aucune ligne trouvée (id='main') dans la table erp_data" };
    return { ok:true, payload: data.data, updatedAt: data.updated_at };
  }catch(e){
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}
let isSaving = false;
let pendingSync = false;
let retryTimer = null;
async function saveRemote(){
  isSaving = true;
  try{
    const { error } = await sb.from('erp_data').upsert({ id:'main', data: state, updated_at: new Date().toISOString() });
    if(error){ pendingSync = true; setSyncStatus('pending', 'écriture en attente (réseau) : '+error.message); scheduleRetry(); return; }
    pendingSync = false;
    setSyncStatus(true, 'enregistré');
  }catch(e){
    pendingSync = true;
    setSyncStatus('pending', 'écriture en attente (réseau) : '+((e&&e.message)||String(e)));
    scheduleRetry();
  }
  finally{ isSaving = false; }
}
function scheduleRetry(){
  if(retryTimer) return;
  retryTimer = setTimeout(()=>{ retryTimer = null; if(pendingSync && navigator.onLine) saveRemote(); else if(pendingSync) scheduleRetry(); }, 8000);
}
window.addEventListener('online', ()=>{ pollFailCount = 0; if(pendingSync) saveRemote(); updateOfflineBanner(); });
window.addEventListener('offline', ()=>{ setSyncStatus(false, 'Connexion perdue — modifications conservées en local, envoi automatique au retour du réseau'); updateOfflineBanner(); });
function updateOfflineBanner(){
  const b = document.getElementById('offline-banner');
  if(!b) return;
  if(!navigator.onLine){
    b.style.display = 'block';
    b.style.background = 'var(--danger)';
    b.textContent = "Vous êtes hors ligne — vos modifications sont conservées et seront envoyées automatiquement dès que la connexion revient.";
  } else if(pendingSync){
    b.style.display = 'block';
    b.style.background = 'var(--accent)';
    b.style.color = '#1A1508';
    b.textContent = "Connexion faible — envoi en attente, nouvelle tentative automatique en cours...";
  } else {
    b.style.display = 'none';
  }
}
setInterval(updateOfflineBanner, 3000);
function persist(){
  saveLocalCache();
  saveRemote();
}
function setSyncStatus(status, detail){
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  const now = new Date().toLocaleTimeString('fr-FR');
  let color, label;
  if(status===true){ color = 'var(--success)'; label = 'OK'; }
  else if(status==='pending'){ color = 'var(--accent)'; label = 'EN ATTENTE'; }
  else { color = 'var(--danger)'; label = 'ERREUR'; }
  const full = `${label} ${now}${detail ? ' · '+detail : ''}`;
  if(dot){ dot.style.background = color; dot.title = full; }
  if(txt){ txt.textContent = full; txt.title = full; }
}
let pollTimer = null;
let pollFailCount = 0;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(!navigator.onLine){ setSyncStatus(false, 'Hors ligne — travail en local'); return; }
    const modalOpen = document.getElementById('modal-root').innerHTML.trim() !== '';
    if(modalOpen || isSaving || pendingSync) return; // ne jamais écraser des changements locaux pas encore envoyés
    const res = await loadRemote();
    if(isSaving || pendingSync) return;
    if(res.ok){
      pollFailCount = 0;
      const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
      setSyncStatus(true, 'donnée du serveur: '+stamp);
      const changed = JSON.stringify(res.payload) !== JSON.stringify(state);
      if(changed){
        state = res.payload; normalizeState();
        applyTheme(state.theme);
        saveLocalCache();
        render();
      }
    } else {
      pollFailCount++;
      // on tolère 1 échec isolé (réseau faible) sans afficher d'erreur — seulement si ça persiste
      if(pollFailCount>=2) setSyncStatus(false, res.error);
    }
  }, 8000);
}

function applyTheme(theme){
  const t = { ...DEFAULT_THEME, ...(theme||{}) };
  const root = document.documentElement.style;
  Object.keys(DEFAULT_THEME).forEach(k=> root.setProperty('--'+(k==='sidebarBg'?'sidebar-bg':k==='sidebarBg2'?'sidebar-bg2':k), t[k]));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.sidebarBg);
}

/* ============ MINI GRAPHIQUES (canvas, sans librairie) ============ */
function drawBarChart(canvas, labels, values, color){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const max = Math.max(1, ...values);
  const padL=8, padB=22, padT=10, padR=8;
  const chartW = W-padL-padR, chartH = H-padB-padT;
  const bw = chartW/values.length*0.6;
  const gap = chartW/values.length;
  ctx.font = '10px Inter, sans-serif';
  values.forEach((v,i)=>{
    const h = (v/max)*chartH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-h);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(x, y, bw, h);
    ctx.globalAlpha = 1;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x+bw/2, H-6);
  });
}
function drawDonut(canvas, segments){
  // segments: [{label, value, color}]
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=W/2, cy=H/2, rOuter=Math.min(W,H)/2-4, rInner=rOuter*0.6;
  let start = -Math.PI/2;
  segments.forEach(s=>{
    const angle = (s.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.arc(cx,cy,rInner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    start += angle;
  });
}

/* ============ KPIs ============ */
function computeKpis(){
  const total = state.fleet.length || 1;
  const dispo = state.fleet.filter(e=>e.statut==="Opérationnel").length;
  const pannes = state.fleet.filter(e=>e.statut==="En panne").length;
  const disponibilite = Math.round((dispo/total)*1000)/10;
  const closed = state.workOrders.filter(w=>w.type==="Correctif" && w.statut==="Terminé" && w.dateCreation && w.dateFin);
  const mttrH = closed.length ? closed.reduce((a,w)=>a+Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5),0)/closed.length : 0;
  const coutMaintenance = state.workOrders.reduce((a,w)=>a+Number(w.cout||0),0);
  const coutCarburant = state.fuelLogs.reduce((a,f)=>a+Number(f.cout||0),0);
  const litresTotal = state.fuelLogs.reduce((a,f)=>a+Number(f.quantite||0),0);
  const ouverts = state.workOrders.filter(w=>WO_STATUTS_ACTIFS.includes(w.statut)).length;
  const partsBas = state.parts.filter(p=>Number(p.quantite)<=Number(p.seuil)).length;

  const totalPlant = state.plantEquipment.length || 1;
  const dispoPlant = state.plantEquipment.filter(e=>e.statut==="Opérationnel").length;
  const disponibilitePlant = Math.round((dispoPlant/totalPlant)*1000)/10;
  const notifOuvertes = state.notifications.filter(n=>n.statut!=="Clôturée" && n.statut!=="Convertie en OT").length;
  const oeeList = state.productionLogs.map(oeeOf).filter(v=>v!==null);
  const oeeMoyen = oeeList.length ? Math.round(oeeList.reduce((a,b)=>a+b,0)/oeeList.length*10)/10 : null;
  const daOuvertes = state.purchaseRequests.filter(d=>d.statut==="Ouverte").length;
  const bcEnAttente = state.purchaseOrders.filter(b=>b.statut!=="Réceptionné").length;

  return {disponibilite, pannes, mttrH, coutMaintenance, coutCarburant, litresTotal, ouverts, partsBas, total,
    disponibilitePlant, notifOuvertes, oeeMoyen, totalPlant: state.plantEquipment.length, daOuvertes, bcEnAttente};
}
function oeeOf(p){
  const fonct = Number(p.tempsFonctionnementMin||0), arret = Number(p.tempsArretMin||0);
  const dispo = (fonct+arret)>0 ? fonct/(fonct+arret) : null;
  const perf = p.quantitePrevue>0 ? Math.min(1, Number(p.quantiteProduite||0)/Number(p.quantitePrevue)) : null;
  const qual = p.quantiteProduite>0 ? Math.max(0,(Number(p.quantiteProduite)-Number(p.piecesRebut||0))/Number(p.quantiteProduite)) : null;
  if(dispo===null||perf===null||qual===null) return null;
  return dispo*perf*qual*100;
}

  else if(currentView==='bc-receive') c.innerHTML = viewBcReceive();
  promoteTitle();
  attachHandlers();
  if(currentView==='dashboard') drawDashboardCharts();
  if(currentView==='reports'){ const rd = computeReportData(); const top = rd.paretoEquip.slice(0,8); drawParetoChart(document.getElementById('chart-pareto'), top.map(x=>x.label), top.map(x=>x.cout)); }
  if(currentView==='users' && allUsers.length===0){ loadAllUsers().then(()=>{ if(currentView==='users') render(); }); }
}
function drawDashboardCharts(){
  const em = equipMap();
  const matchesFilter = (equipementId)=>{
    if(dashFilterEquip!=='Tous') return equipementId===dashFilterEquip;
    if(dashFilterFamille!=='Tous') return em[equipementId] && em[equipementId].type===dashFilterFamille;
    return true;
  };
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const monthLabel = d => d.toLocaleDateString('fr-FR',{month:'short'});
  const maintByMonth = months.map(d=>{
    const key = monthKey(d);
    return state.workOrders.filter(w=>(w.dateCreation||'').slice(0,7)===key && matchesFilter(w.equipementId)).reduce((a,w)=>a+Number(w.cout||0),0);
  });
  const fuelByMonth = months.map(d=>{
    const key = monthKey(d);
    return state.fuelLogs.filter(f=>(f.date||'').slice(0,7)===key && matchesFilter(f.equipementId)).reduce((a,f)=>a+Number(f.quantite||0),0);
  });
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F2A63C';
  const steel = getComputedStyle(document.documentElement).getPropertyValue('--steel').trim() || '#5B8CB3';
  const success = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#4CAF6D';
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
  const danger = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#E5533C';
  drawBarChart(document.getElementById('chart-maint-cost'), months.map(monthLabel), maintByMonth, accent);
  drawBarChart(document.getElementById('chart-fuel-cost'), months.map(monthLabel), fuelByMonth, steel);
  const woColors = { 'Créé':muted, 'Confirmé partiel':accent, 'Confirmé':steel, 'En cours':accent, 'Suspendu':accent, 'Terminé':steel, 'Clôturé':success, 'Annulé':danger };
  const woFiltered = state.workOrders.filter(w=>matchesFilter(w.equipementId));
  drawDonut(document.getElementById('chart-wo-status'), WO_STATUTS.map(s=>({label:s, value: woFiltered.filter(w=>w.statut===s).length || 0.0001, color: woColors[s]})));
  const persColors = [accent, steel, success];
  drawDonut(document.getElementById('chart-personnel'), state.affectations.map((a,i)=>({label:a, value: state.personnel.filter(p=>p.statut==='Actif'&&p.affectation===a).length || 0.0001, color: persColors[i%3]})));
}

function readExcelFile(file, onRows){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      onRows(rows);
    }catch(err){ alert("Erreur de lecture du fichier : "+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function findCol(row, names){
  const keys = Object.keys(row);
  for(const n of names){
    const k = keys.find(k=>k.trim().toLowerCase()===n.toLowerCase());
    if(k!==undefined && row[k]!=='') return row[k];
  }
  // repli : correspondance partielle (ex: "Nom ou désignation" contient "nom")
  for(const n of names){

function matchUnite(raw){
  if(!raw) return 'Pièce (PCE)';
  const r = String(raw).trim().toLowerCase();
  for(const u of state.unitesArticle){
    const abbrevMatch = u.match(/\(([^)]+)\)/);
    const abbrev = abbrevMatch ? abbrevMatch[1].toLowerCase() : '';
    const label = u.split(' (')[0].toLowerCase();
    if(r===abbrev || r===label || u.toLowerCase()===r) return u;
  }
  const aliases = {
    'kg':'Kilogramme (KG)','kgs':'Kilogramme (KG)','g':'Gramme (G)','l':'Litre (L)','litre':'Litre (L)','litres':'Litre (L)',
    'm':'Mètre (M)','metre':'Mètre (M)','mètre':'Mètre (M)','m2':'Mètre carré (M2)','m3':'Mètre cube (M3)',
    'pce':'Pièce (PCE)','piece':'Pièce (PCE)','pièce':'Pièce (PCE)','pieces':'Pièce (PCE)','pièces':'Pièce (PCE)',
    'un':'Unité (UN)','unite':'Unité (UN)','unité':'Unité (UN)','t':'Tonne (T)','tonne':'Tonne (T)',
    'bt':'Boîte (BT)','boite':'Boîte (BT)','boîte':'Boîte (BT)','car':'Carton (CAR)','carton':'Carton (CAR)',
    'lot':'Lot (LOT)','jeu':'Jeu / Kit (JEU)','kit':'Jeu / Kit (JEU)','pr':'Paire (PR)','paire':'Paire (PR)',
    'sac':'Sac (SC)','sachet':'Sachet (SAC)','bidon':'Bidon (BID)','rouleau':'Rouleau (RLO)','rlo':'Rouleau (RLO)','bouteille':'Bouteille (BOU)'
  };
  return aliases[r] || 'Pièce (PCE)';
}

let woDraft = null;
let woEditTab = 'general';
let woIsNew = false;
let woOpFormOpen = {};
let woPartEditIndex = null;
function dureeAffectation(af){
  if(!af || !af.heureDebut || !af.heureFin) return null;
  const [h1,m1] = af.heureDebut.split(':').map(Number);
  const [h2,m2] = af.heureFin.split(':').map(Number);
  if([h1,m1,h2,m2].some(n=>isNaN(n))) return null;
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins < 0) mins += 24*60;
  return mins;
}
function fmtDuree(mins){
  if(mins==null) return '—';
  const h = Math.floor(mins/60), m = mins%60;
  return (h>0 ? h+'h' : '') + String(m).padStart(2,'0');
}
function blankWO(){
  return { id:null, numero:null, categorieEquipement:'', equipementId:'', type:'Panne / Correctif',
    typeTravail: state.typesTravail[0], poste: state.postes[0], titre:'', description:'', priorite:'Normale', statut:'Créé',

}

}

        return `<div class="card-item" style="padding:6px 10px;">

          <span style="font-size:13px;">${pt?esc(pt.nom):'Pièce supprimée'} <span class="mono" style="color:var(--muted);font-size:11px;">${pt&&pt.ref?'('+esc(pt.ref)+')':''}</span> ${editing?'':`× ${pu.quantite}${pt?' '+uniteAbrev(pt):''}`} <span style="color:${statusColor};font-size:11px;margin-left:6px;">● ${statusTxt}</span></span>
          <div class="row" style="gap:2px;">

            <input id="wo-part-edit-qty" type="number" min="1" value="${pu.quantite}" style="width:80px;"/>
            <button class="btn btn-accent" data-wo-part-edit-confirm="${i}" type="button" style="font-size:11px;">${ICONS.check} Valider</button>
            <button class="btn btn-ghost" data-wo-part-edit-cancel="1" type="button" style="font-size:11px;">${ICONS.close} Annuler</button>
          </div>`:''}
        </div>`;}).join('')}
    </div>
    ${state.parts.length===0?`<span style="font-size:12px;color:var(--muted);">Aucune pièce en stock — ajoute-en dans "Pièces / Stock".</span>`:
    `<div class="row wrapwrap" style="gap:6px;align-items:center;">
      <input id="wo-part-code" list="wo-parts-list" placeholder="Code article" style="width:130px;"/>
      <datalist id="wo-parts-list">${state.parts.map(p=>`<option value="${esc(p.ref||p.id)}">${esc(p.nom)}</option>`).join('')}</datalist>
      <input id="wo-part-desig" placeholder="Désignation" readonly style="flex:1;min-width:140px;background:var(--panel);color:var(--muted);"/>
      <input id="wo-part-unite" placeholder="Unité" readonly style="width:64px;background:var(--panel);color:var(--muted);text-align:center;"/>
      <span id="wo-part-stock" style="font-size:11px;color:var(--muted);white-space:nowrap;min-width:90px;">Stock : —</span>
      <input id="wo-part-qty" type="number" value="1" min="1" style="width:70px;"/>
      <button class="btn btn-ghost" id="wo-part-add" type="button">${ICONS.plus} Réserver</button>
    </div>`}
  </div>` : ''}

  <div class="row" style="justify-content:flex-end;margin-bottom:24px;">
    <button class="btn btn-ghost" id="wo-back-2">${ICONS.close} Retour à la liste</button>
  </div>`;
}
function wireWOEditor(){

  document.querySelectorAll('[data-wo-tab]').forEach(b=>b.addEventListener('click',()=>{ syncGeneralFieldsFromDOM(); woEditTab=b.dataset.woTab; render(); }));

    w.dateFin = val('wo-f-fin', w.dateFin);
    w.technicien = val('wo-f-tech', w.technicien);
    w.cout = val('wo-f-cout', w.cout);

  const catSel = document.getElementById('wo-f-categorie');

    if(extra) Object.assign(w, extra);
    const idx = state.workOrders.findIndex(x=>x.id===w.id);
    if(idx>-1) state.workOrders[idx] = {...w};
    const eq = equipMap()[w.equipementId];
    if(eq){
      if(newStatut==='Terminé' || newStatut==='Clôturé' || newStatut==='Annulé') eq.statut='Opérationnel';
      else if(newStatut==='En cours' || newStatut==='Confirmé partiel') eq.statut='En maintenance';

  const deconfirmBtn = document.getElementById('wo-deconfirm');

/* ============ PREVENTIVE ============ */
function pmStatus(p, em){
  const now = new Date();
  if(p.type==='Heures' || p.type==='Kilométrage'){
    const eq = em[p.equipementId];
    const unite = p.type==='Heures' ? 'h' : 'km';
    const valeurActuelle = eq ? Number(p.type==='Heures' ? eq.heures : eq.km) || 0 : 0;
    const prochaineValeur = Number(p.derniereValeur||0) + Number(p.intervalle||0);
    const restant = prochaineValeur - valeurActuelle;
    const seuilUrgent = p.type==='Heures' ? 20 : 200;
    const urgent = restant <= seuilUrgent;
    const label = restant<=0 ? `Dépassé de ${Math.abs(Math.round(restant))} ${unite}` : `Reste ${Math.round(restant)} ${unite} (échéance à ${prochaineValeur} ${unite})`;
    return { urgent, label };
  }
  const daysLeft = p.prochaine? Math.round((new Date(p.prochaine)-now)/864e5): null;
  const urgent = daysLeft!==null && daysLeft<=7;
  const label = p.prochaine ? `Échéance : ${p.prochaine}${daysLeft!==null?` (${daysLeft}j)`:''}` : 'Non planifié';
  return { urgent, label };
}

function wirePMEdit(){
  const p = pmDraft;
  document.getElementById('pm-f-type').addEventListener('change', (e)=>{ p.type = e.target.value; render(); });
  const gammeSel = document.getElementById('pm-f-gamme');
  if(gammeSel) gammeSel.addEventListener('change', (e)=>{
    const g = state.gammesOperatoires.find(x=>x.id===e.target.value);
    if(g){ document.getElementById('pm-f-tache').value = g.nom; p.gammeId = g.id; }
    else { p.gammeId = ''; }
  });
  const ffpBack = document.getElementById('ffp-back');
  if(ffpBack) ffpBack.addEventListener('click', ()=>{ currentView='pm'; pmDraft=null; render(); });
  const ffpSubmit = document.getElementById('ffp-submit');
  if(ffpSubmit) ffpSubmit.addEventListener('click', ()=>{
    p.equipementId = document.getElementById('pm-f-equip').value;
    p.gammeId = document.getElementById('pm-f-gamme').value||'';
    p.tache = document.getElementById('pm-f-tache').value;
    p.typeStrategie = document.getElementById('pm-f-strategie').value;
    p.objectif = document.getElementById('pm-f-objectif').value;
    p.type = document.getElementById('pm-f-type').value;
    if(p.type==='Heures' || p.type==='Kilométrage'){
      p.intervalle = Number(document.getElementById('pm-f-intervalle').value)||0;
      p.derniereValeur = Number(document.getElementById('pm-f-derniereValeur').value)||0;
    } else {
      p.frequenceJours = Number(document.getElementById('pm-f-freq').value)||0;
      p.derniere = document.getElementById('pm-f-derniere').value;
      if(p.derniere && p.frequenceJours){ const d=new Date(p.derniere); d.setDate(d.getDate()+Number(p.frequenceJours)); p.prochaine=d.toISOString().slice(0,10); }
    }
    if(!p.tache || !p.equipementId){ alert('Tâche et équipement requis'); return; }
    if(pmIsNew){ p.id = uid(); state.pmPlans.push(p); persist(); toast('Plan préventif ajouté'); }
    else { const idx = state.pmPlans.findIndex(x=>x.id===p.id); if(idx>-1) state.pmPlans[idx]=p; persist(); toast('Plan préventif mis à jour'); }
    currentView='pm'; pmDraft=null; render();
  });
}

/* ============ EMPLACEMENTS FONCTIONNELS ============ */
function buildLocTree(){
  const byParent = {};
  state.locations.forEach((l,idx)=>{
    if(l.ordre===undefined || l.ordre===null) l.ordre = idx;
    const key = l.parentId||'root';
    (byParent[key] = byParent[key]||[]).push(l);
  });
  Object.values(byParent).forEach(arr=>arr.sort((a,b)=>(a.ordre-b.ordre)));
  const result = [];
  function walk(parentKey, depth){
    (byParent[parentKey]||[]).forEach(l=>{
      const siblings = byParent[parentKey];
      const idx = siblings.indexOf(l);
      result.push({loc:l, depth, isFirst: idx===0, isLast: idx===siblings.length-1});
      walk(l.id, depth+1);
    });
  }
  walk('root', 0);
  return result;
}
function viewFLoc(){
  const tree = buildLocTree();
  return `
  <div class="headrow">
    <div><h1>Emplacements fonctionnels</h1><p class="subtitle" style="margin:0;">Hiérarchie Site › Atelier › Ligne › Machine — utilise ▲▼ pour réordonner manuellement</p></div>

  </div>

  `<div style="display:flex;flex-direction:column;gap:6px;">
  ${tree.map(({loc:l,depth,isFirst,isLast})=>`<div class="plate p14 between wrapwrap legend-clickable" data-edit-floc-row="${l.id}" style="gap:12px;padding-left:${14+depth*20}px;">
    <div class="row"><span class="badge">${l.type}</span><span style="font-size:13px;">${esc(l.nom)}</span></div>

      <button class="icon-btn" data-floc-down="${l.id}" ${isLast?'disabled style="opacity:.3;"':''} title="Descendre">${ICONS.arrowDown||'▼'}</button>

}

/* ============ EFFECTIFS ============ */
let effectifsMonth = new Date().toISOString().slice(0,7);
function viewEffectifs(){
  const byPoste = {};
  state.personnel.filter(p=>p.statut==='Actif').forEach(p=>{ byPoste[p.poste]=(byPoste[p.poste]||0)+1; });
  const [y,m] = effectifsMonth.split('-').map(Number);
  const monthStart = effectifsMonth+'-01';
  const monthEnd = new Date(y, m, 0).toISOString().slice(0,10);
  const joursMois = new Date(y, m, 0).getDate();
  const active = state.personnel.filter(p=>p.statut!=='Inactif');
  const rows = active.map(p=>{
    const conges = state.leaveRequests.filter(c=>c.personnelId===p.id && c.statut==='Validé' && c.dateDebut<=monthEnd && c.dateFin>=monthStart);
    const joursAbs = conges.reduce((a,c)=>{
      const debut = c.dateDebut<monthStart?monthStart:c.dateDebut;
      const fin = c.dateFin>monthEnd?monthEnd:c.dateFin;
      return a + Math.max(0, leaveDays(debut,fin));
    },0);
    return { p, joursAbs, dispo: joursMois-joursAbs };
  });
  const totalCapacite = active.length*joursMois;
  const totalAbs = rows.reduce((a,r)=>a+r.joursAbs,0);
  return `
  <div class="headrow">
    <div><h1>Planification des effectifs</h1><p class="subtitle" style="margin:0;">Capacité de travail par poste et disponibilité mensuelle</p></div>
    <input type="month" id="effectifs-month" value="${effectifsMonth}"/>
  </div>
  <div class="grid grid-kpi" style="margin-bottom:16px;">
    ${kpiCard('Effectif actif', active.filter(p=>p.statut==='Actif').length,'personnes','users','var(--text)','')}
    ${kpiCard('Capacité du mois', fmt(totalCapacite),'j.-homme','calendar','var(--steel)','')}
    ${kpiCard('Jours d\'absence (congés)', fmt(totalAbs),'j.','calendar', totalAbs>0?'var(--accent)':'var(--success)','')}
    ${kpiCard('Taux de disponibilité', totalCapacite?Math.round((1-totalAbs/totalCapacite)*100):100,'%','activity','var(--success)','')}
  </div>
  <div class="plate p16" style="margin-bottom:16px;">
    <h3 class="oswald" style="text-transform:uppercase;font-size:14px;margin:0 0 10px;">Effectif actif par poste</h3>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${Object.entries(byPoste).sort((a,b)=>b[1]-a[1]).map(([poste,n])=>`<div class="between" style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);"><span>${esc(poste)}</span><span class="mono">${n}</span></div>`).join('')||`<span style="font-size:12px;color:var(--muted);">Aucun personnel actif.</span>`}
    </div>
  </div>
  <div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Personnel</th><th>Poste</th><th>Affectation</th><th class="right">Jours d'absence (mois)</th><th class="right">Jours disponibles</th></tr></thead>
  <tbody>
  ${rows.sort((a,b)=>b.joursAbs-a.joursAbs).map(({p,joursAbs,dispo})=>`<tr>
    <td>${esc(p.nom)}</td><td style="color:var(--muted)">${esc(p.poste)}</td><td style="color:var(--muted)">${esc(p.affectation)}</td>
    <td class="right mono" style="color:${joursAbs>0?'var(--accent)':'var(--muted)'}">${joursAbs}</td>
    <td class="right mono">${dispo}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

const EDITABLE_LIST_KEYS = { 'wo-typetravail':'typesTravail', 'wo-type':'woTypes', 'wo-priorite':'woPriorites',
  'cat-article':'categoriesArticle', 'unite-article':'unitesArticle', 'niveau-critic':'niveauxCriticite',
  'type-mvt':'typesMouvement', 'loc-type':'locationTypes', 'affectation':'affectations', 'fonction':'fonctions', 'niveau-appro':'niveauxApprobation',
  'type-conge':'typesConge', 'type-formation':'typesFormation', 'statut-recrut':'statutsRecrutement',
  'norme-hse':'normesHSE', 'strategie-maint':'typesStrategieMaintenance', 'objectif-maint':'objectifsMaintenance' };
function wireEditableLists(){
  document.querySelectorAll('[data-elist-add]').forEach(b=>b.addEventListener('click',()=>{
    const prefix = b.dataset.elistAdd; const key = EDITABLE_LIST_KEYS[prefix];
    const input = document.getElementById('elist-input-'+prefix);
    const val = input.value.trim();
    if(val && !state[key].includes(val)){ state[key].push(val); persist(); render(); }
  }));
  document.querySelectorAll('[data-elist-del]').forEach(b=>b.addEventListener('click',()=>{
    const [prefix, iStr] = b.dataset.elistDel.split(':'); const key = EDITABLE_LIST_KEYS[prefix]; const i = Number(iStr);
    if(state[key].length<=1){ alert('Il doit rester au moins une valeur dans la liste.'); return; }
    const val = state[key][i];
    const usageCheckers = {
      'wo-typetravail': ()=>state.workOrders.some(w=>w.typeTravail===val),
      'wo-type': ()=>state.workOrders.some(w=>w.type===val),
      'wo-priorite': ()=>state.workOrders.some(w=>w.priorite===val),
      'cat-article': ()=>state.parts.some(p=>p.categorie===val),
      'unite-article': ()=>state.parts.some(p=>p.unite===val),
      'niveau-critic': ()=>state.parts.some(p=>p.niveauCriticite===val),
      'type-mvt': ()=>(state.stockMovements||[]).some(m=>m.type===val),
      'loc-type': ()=>state.locations.some(l=>l.type===val),
      'affectation': ()=>state.personnel.some(p=>p.affectation===val),
      'fonction': ()=>state.personnel.some(p=>p.fonction===val),
      'niveau-appro': ()=>false,
      'type-conge': ()=>state.leaveRequests.some(c=>c.type===val),
      'type-formation': ()=>state.trainings.some(f=>f.type===val),
      'statut-recrut': ()=>state.candidatures.some(c=>c.statut===val),
      'norme-hse': ()=>state.workOrders.some(w=>w.normeHSE===val) || state.gammesOperatoires.some(g=>g.normeHSE===val),
      'strategie-maint': ()=>state.pmPlans.some(p=>p.typeStrategie===val),
      'objectif-maint': ()=>state.pmPlans.some(p=>p.objectif===val),
    };
    const used = usageCheckers[prefix] ? usageCheckers[prefix]() : false;
    const doDelete = ()=>{ state[key].splice(i,1); persist(); render(); };
    if(used) confirmModal('Cette valeur est utilisée par au moins un élément existant. La supprimer quand même ?', doDelete, {danger:true, okLabel:'Supprimer quand même'});
    else doDelete();
  }));
  document.querySelectorAll('[data-elist-up]').forEach(b=>b.addEventListener('click',()=>{
    const [prefix, iStr] = b.dataset.elistUp.split(':'); const key = EDITABLE_LIST_KEYS[prefix]; const i = Number(iStr);
    if(i>0){ const arr=state[key]; [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; persist(); render(); }
  }));
  document.querySelectorAll('[data-elist-down]').forEach(b=>b.addEventListener('click',()=>{
    const [prefix, iStr] = b.dataset.elistDown.split(':'); const key = EDITABLE_LIST_KEYS[prefix]; const i = Number(iStr);
    const arr=state[key]; if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; persist(); render(); }
  }));
}

let reportFrom = '';
let reportTo = '';
function drawParetoChart(canvas, labels, values){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  if(!values.length) return;
  const total = values.reduce((a,b)=>a+b,0) || 1;
  let cum = 0; const cumPct = values.map(v=>{ cum+=v; return cum/total*100; });
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F2A63C';
  const steel = getComputedStyle(document.documentElement).getPropertyValue('--steel').trim() || '#5B8CB3';
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
  const max = Math.max(1, ...values);
  const padL=8, padR=8, padT=14, padB=30;
  const chartW = W-padL-padR, chartH = H-padT-padB;
  const n = values.length;
  const gap = chartW/n, bw = gap*0.55;
  ctx.font = '9px Inter, sans-serif';
  values.forEach((v,i)=>{
    const h = (v/max)*chartH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-h);
    ctx.fillStyle = accent; ctx.globalAlpha = .85; ctx.fillRect(x,y,bw,h); ctx.globalAlpha = 1;
    ctx.fillStyle = muted; ctx.textAlign = 'center';
    ctx.fillText((labels[i]||'').toString().slice(0,9), x+bw/2, H-10);
  });
  ctx.beginPath();
  cumPct.forEach((p,i)=>{
    const x = padL + i*gap + gap/2;
    const y = padT + chartH - (p/100*chartH);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = steel; ctx.lineWidth = 2; ctx.stroke();
  cumPct.forEach((p,i)=>{
    const x = padL + i*gap + gap/2;
    const y = padT + chartH - (p/100*chartH);
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fillStyle = steel; ctx.fill();
  });
  const y80 = padT + chartH - (80/100*chartH);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padL,y80); ctx.lineTo(W-padR,y80); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.font = '9px Inter, sans-serif';
  ctx.fillText('80%', padL, y80-3);
}
function computeReportData(){
  const from = reportFrom, to = reportTo;
  const inRange = d => { if(!from && !to) return true; if(!d) return false; if(from && d<from) return false; if(to && d>to) return false; return true; };
  const em = equipMap();
  const pm = Object.fromEntries(state.parts.map(p=>[p.id,p]));
  const wos = state.workOrders.filter(w=>inRange(w.dateCreation));

  const coutTotal = wos.reduce((a,w)=>a+Number(w.cout||0),0);
  const coutParType = {};
  wos.forEach(w=>{ const t=w.type||'Autre'; coutParType[t]=(coutParType[t]||0)+Number(w.cout||0); });
  const coutParEquip = {};
  wos.forEach(w=>{ if(!w.equipementId) return; coutParEquip[w.equipementId]=(coutParEquip[w.equipementId]||0)+Number(w.cout||0); });
  const coutParFamille = {};
  wos.forEach(w=>{ const eq=em[w.equipementId]; const f=eq?eq.type:'Non affecté'; coutParFamille[f]=(coutParFamille[f]||0)+Number(w.cout||0); });
  const spentByCC = {};
  wos.forEach(w=>{ const eq=em[w.equipementId]; const cc=eq&&eq.centreCoutId?eq.centreCoutId:null; if(cc) spentByCC[cc]=(spentByCC[cc]||0)+Number(w.cout||0); });
  const budgetVsReel = state.costCenters.map(c=>({code:c.code, nom:c.nom, budget:Number(c.budgetAnnuel||0), reel:spentByCC[c.id]||0}));

  const fuelLogs = state.fuelLogs.filter(f=>inRange(f.date));
  const fuelParEquip = {};
  fuelLogs.forEach(f=>{ const o=fuelParEquip[f.equipementId]=fuelParEquip[f.equipementId]||{l:0,cout:0}; o.l+=Number(f.quantite||0); o.cout+=Number(f.cout||0); });
  const litresTotal = fuelLogs.reduce((a,f)=>a+Number(f.quantite||0),0);
  const coutCarburantTotal = fuelLogs.reduce((a,f)=>a+Number(f.cout||0),0);

  const sortiesValidees = state.reservations.filter(r=>r.statut==='Sortie validée' && inRange(r.dateSortie||r.dateCreation));
  const valeurPiecesConsommees = sortiesValidees.reduce((a,r)=>{ const pt=pm[r.partId]; return a+(pt?Number(pt.coutUnitaire||0)*Number(r.quantite||0):0); },0);
  const qtePiecesConsommees = sortiesValidees.reduce((a,r)=>a+Number(r.quantite||0),0);
  const entreesStock = (state.stockMovements||[]).filter(m=>inRange(m.date));
  const qteEntrees = entreesStock.reduce((a,m)=>a+Number(m.quantite||0),0);
  const piecesSousSeuil = state.parts.filter(p=>Number(p.quantite)<=Number(p.seuil));
  const piecesCritiques = state.parts.filter(p=>p.critique);
  const consoParPiece = {};
  sortiesValidees.forEach(r=>{ consoParPiece[r.partId]=(consoParPiece[r.partId]||0)+Number(r.quantite||0); });

  const correctifs = wos.filter(w=>w.type==='Panne / Correctif');
  const closedCorrectifs = correctifs.filter(w=>w.dateCreation && w.dateFin);
  const mttrH = closedCorrectifs.length ? closedCorrectifs.reduce((a,w)=>a+Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5),0)/closedCorrectifs.length : 0;
  const pannesParEquip = {};
  correctifs.forEach(w=>{ if(w.equipementId) pannesParEquip[w.equipementId]=(pannesParEquip[w.equipementId]||0)+1; });
  let mtbfH = 0;
  const mtbfList = [];
  Object.keys(pannesParEquip).forEach(eid=>{
    const pannes = correctifs.filter(w=>w.equipementId===eid).map(w=>w.dateCreation).filter(Boolean).sort();
    if(pannes.length>=2){
      const gaps=[]; for(let i=1;i<pannes.length;i++) gaps.push((new Date(pannes[i])-new Date(pannes[i-1]))/36e5);
      const avg = gaps.reduce((a,b)=>a+b,0)/gaps.length;
      mtbfList.push({equip:em[eid], mtbfH:avg});
    }
  });
  if(mtbfList.length) mtbfH = mtbfList.reduce((a,x)=>a+x.mtbfH,0)/mtbfList.length;
  const nbCrees = wos.length;
  const nbClotures = wos.filter(w=>w.statut==='Clôturé').length;
  const pctPreventif = wos.length ? Math.round(wos.filter(w=>w.type==='Préventif').length/wos.length*1000)/10 : 0;
  const pctCorrectif = wos.length ? Math.round(correctifs.length/wos.length*1000)/10 : 0;

  const arretParEquip = {};
  correctifs.forEach(w=>{
    if(!w.equipementId || !w.dateCreation || !w.dateFin) return;
    const h = Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5);
    arretParEquip[w.equipementId] = (arretParEquip[w.equipementId]||0)+h;
  });

  const permisRenseigne = wos.filter(w=>w.permisTravail).length;
  const consignationRenseignee = wos.filter(w=>w.consignation && w.consignation.trim()).length;

  const paretoEquip = Object.entries(coutParEquip).map(([eid,cout])=>({label:em[eid]?em[eid].code:'?', cout}))
    .sort((a,b)=>b.cout-a.cout);

  return { coutTotal, coutParType, coutParEquip, coutParFamille, spentByCC, budgetVsReel,
    fuelParEquip, litresTotal, coutCarburantTotal,
    sortiesValidees, valeurPiecesConsommees, qtePiecesConsommees, qteEntrees, piecesSousSeuil, piecesCritiques, consoParPiece,
    mttrH, mtbfH, mtbfList, nbCrees, nbClotures, pctPreventif, pctCorrectif, correctifs,
    arretParEquip, permisRenseigne, consignationRenseignee, totalOT: wos.length,
    paretoEquip, em, pm };
}
function buildReportNarrative(d){
  const n = {};
  const typesSorted = Object.entries(d.coutParType).sort((a,b)=>b[1]-a[1]);
  n.finance = typesSorted.length

    : `Aucune dépense de maintenance enregistrée sur la période sélectionnée.`;
  const overBudget = d.budgetVsReel.filter(b=>b.budget>0 && b.reel/b.budget>=0.9);
  n.budget = overBudget.length

    : d.budgetVsReel.length ? `Aucun centre de coût ne dépasse 90% de son budget annuel sur la période.` : `Aucun centre de coût configuré.`;
  let nEquip80=0, cum=0; const totalPareto = d.paretoEquip.reduce((a,x)=>a+x.cout,0)||1;
  for(const x of d.paretoEquip){ cum+=x.cout; nEquip80++; if(cum/totalPareto>=0.8) break; }
  n.pareto = d.paretoEquip.length
    ? `${nEquip80} équipement(s) sur ${d.paretoEquip.length} concentrent 80% du coût total de maintenance : ${d.paretoEquip.slice(0,nEquip80).map(x=>x.label).join(', ')}. Ce sont les cibles prioritaires pour un renforcement du préventif ou une analyse de remplacement.`
    : `Pas assez de données pour établir une analyse Pareto sur la période.`;
  n.kpi = d.pctCorrectif > d.pctPreventif
    ? `La maintenance reste majoritairement réactive (${d.pctCorrectif}% de correctif contre ${d.pctPreventif}% de préventif) — un renforcement du plan préventif est recommandé pour réduire les pannes et le MTTR.`
    : `Le ratio préventif (${d.pctPreventif}%) est supérieur ou égal au correctif (${d.pctCorrectif}%) — la maintenance planifiée est bien engagée, à consolider.`;
  n.hse = d.totalOT
    ? `${Math.round(d.permisRenseigne/d.totalOT*100)}% des OT de la période ont un permis de travail formalisé et ${Math.round(d.consignationRenseignee/d.totalOT*100)}% une consignation renseignée.`
    : `Aucun OT sur la période pour évaluer la conformité HSE.`;
  n.stock = d.piecesSousSeuil.length>0
    ? `${d.piecesSousSeuil.length} article(s) sont actuellement sous leur seuil critique — un réapprovisionnement est à programmer pour éviter une rupture bloquant une intervention.`
    : `Aucun article sous seuil critique au moment de l'édition du rapport.`;
  return n;
}
function dataURLToUint8Array(dataURL){
  const base64 = dataURL.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function getParetoChartDataURL(){
  const c = document.getElementById('chart-pareto');
  if(c && c.width>0) return c.toDataURL('image/png');
  // fallback : dessiner hors écran si le canvas n'est pas monté (ex. export depuis un autre onglet)
  const off = document.createElement('canvas'); off.width=900; off.height=440; off.style.width='700px'; off.style.height='340px';
  document.body.appendChild(off);
  const rd = computeReportData(); const top = rd.paretoEquip.slice(0,8);
  drawParetoChart(off, top.map(x=>x.label), top.map(x=>x.cout));
  const url = off.toDataURL('image/png'); document.body.removeChild(off);
  return url;
}

/* ---------- Confirmation / déconfirmation par opération (esprit SAP PM) ---------- */
function syncWOToState(w){
  const idx = state.workOrders.findIndex(x=>x.id===w.id);
  if(idx>-1) state.workOrders[idx] = {...w};
}
function recomputeConfirmStatus(w){
  const total = (w.operations||[]).length;
  const confirmed = (w.operations||[]).filter(o=>o.confirme).length;
  if(total===0) return;
  const eq = equipMap()[w.equipementId];
  if(confirmed===0){
    w.statut = 'En cours';
    w.dateFin = '';
    if(eq) eq.statut = 'En maintenance';
  } else if(confirmed<total){
    w.statut = 'Confirmé partiel';
    w.dateFin = '';
    if(eq) eq.statut = 'En maintenance';
  } else {
    w.statut = 'Terminé';
    if(!w.dateFin) w.dateFin = new Date().toISOString().slice(0,10);
    if(eq) eq.statut = 'Opérationnel';
  }
}

function wireWorkflowPanels(w, mode){
  const closePanel = ()=>{ document.getElementById('modal-root').innerHTML=''; render(); };
  const overlay = document.getElementById('wo-panel-overlay');
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target.id==='wo-panel-overlay') closePanel(); });
  const closeBtn = document.getElementById('wo-panel-close');
  if(closeBtn) closeBtn.addEventListener('click', closePanel);
  const footerCloseBtn = document.getElementById('wo-panel-footer-close');
  if(footerCloseBtn) footerCloseBtn.addEventListener('click', closePanel);

  document.querySelectorAll('[data-conf-debut]').forEach(inp=>inp.addEventListener('change', ()=>{
    const [oi,ai] = inp.dataset.confDebut.split(':').map(Number);
    w.operations[oi].affectations[ai].heureDebut = inp.value;
    const mins = dureeAffectation(w.operations[oi].affectations[ai]);
    const label = document.querySelector(`[data-conf-duree="${oi}:${ai}"]`); if(label) label.textContent = fmtDuree(mins);
  }));
  document.querySelectorAll('[data-conf-fin]').forEach(inp=>inp.addEventListener('change', ()=>{
    const [oi,ai] = inp.dataset.confFin.split(':').map(Number);
    w.operations[oi].affectations[ai].heureFin = inp.value;
    const mins = dureeAffectation(w.operations[oi].affectations[ai]);
    const label = document.querySelector(`[data-conf-duree="${oi}:${ai}"]`); if(label) label.textContent = fmtDuree(mins);
  }));
  document.querySelectorAll('[data-confirm-op]').forEach(btn=>btn.addEventListener('click', ()=>{
    try{
      const oi = Number(btn.dataset.confirmOp);
      const op = w.operations[oi];
      if(!op){ alert('Opération introuvable, réessaie.'); return; }
      (op.affectations||[]).forEach(af=>{ af.dureeMin = dureeAffectation(af); });
      op.confirme = true;
      op.confirmePar = currentUser ? currentUser.nomComplet : '';
      op.dateConfirmation = new Date().toISOString();
      recomputeConfirmStatus(w);
      syncWOToState(w);
      logAudit('OT '+w.numero+' — opération "'+op.description+'" confirmée par '+op.confirmePar);
      persist(); toast('Opération confirmée');
      const total = (w.operations||[]).length;
      const confirmed = (w.operations||[]).filter(o=>o.confirme).length;
      if(total>0 && confirmed===total){
        closePanel();
        toast('Toutes les opérations sont confirmées — OT marqué Terminé');
      } else {
        openConfirmationPanel(w.id);
      }
    }catch(err){
      console.error(err);
      alert("Une erreur est survenue lors de la confirmation. Détail : "+(err&&err.message?err.message:String(err)));
    }
  }));
  document.querySelectorAll('[data-deconfirm-op]').forEach(btn=>btn.addEventListener('click', ()=>{
    const oi = Number(btn.dataset.deconfirmOp);
    const op = w.operations[oi];
    confirmModal('Déconfirmer l\'opération "'+op.description+'" ?', ()=>{
      try{
        op.confirme = false; op.confirmePar=''; op.dateConfirmation=null;
        recomputeConfirmStatus(w);
        syncWOToState(w);
        logAudit('OT '+w.numero+' — confirmation annulée sur "'+op.description+'" par '+(currentUser?currentUser.nomComplet:''));
        persist(); toast('Opération déconfirmée');
        openDeconfirmPanel(w.id);
      }catch(err){
        console.error(err);
        alert("Une erreur est survenue lors de la déconfirmation. Détail : "+(err&&err.message?err.message:String(err)));
      }
    });
  }));
}
function openWorkflowPanel(w){
  const em = equipMap();

  const ops = w.operations||[];
  const totalOps = ops.length, confirmedOps = ops.filter(o=>o.confirme).length;
  const s = w.statut;
  const stages = [
    { key:'Créé', label:'Création', done:true, info: 'Créé le '+(w.dateCreation||'—')+(linkedNotif?' · à partir de l\'avis '+(linkedNotif.numero||''):'') },
    { key:'Confirmation', label:'Confirmation (validation administrative)', done: s!=='Créé',
      info: s==='Créé' ? 'En attente de validation par un responsable ou planificateur' : 'Ordre validé, prêt à être lancé',

    { key:'Exécution', label:'Exécution', done: ['En cours','Confirmé partiel','Terminé','Clôturé'].includes(s),

  l1 = kv('Poste responsable', w.poste, col1X, colW);

        const mins = af.dureeMin!=null ? af.dureeMin : dureeAffectation(af);
        rows.push([i===0?(op.description||''):'', af.poste||'', af.technicien||'', (af.heureDebut||'--:--')+' → '+(af.heureFin||'--:--'), fmtDuree(mins)]);
      });

  } else {

      return [pt?pt.nom:'Pièce supprimée', pt?pt.ref||'—':'—', fmt(pu.quantite)+(pt?' '+uniteAbrev(pt):''), pu.reserved?'Réservé':'À réserver'];
    });
    ensureSpace(14);
    doc.autoTable({ startY:y, head:[['Article','Référence','Quantité','Statut']], body: rows,
      margin:{left:marginL,right:marginR}, styles:{fontSize:8.5,cellPadding:2.2}, headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold'},
      alternateRowStyles:{fillColor:[245,245,245]} });
    y = doc.lastAutoTable.finalY + 8;
  }

  sectionTitle('Sécurité / HSE');
  l1 = kv('Permis de travail', w.permisTravail?'Oui':'Non', col1X, colW);
  l2 = kv('Consignation', w.consignation||'—', col2X, colW);
  y += Math.max(l1,l2)*4.2+7;

  if(Number(w.cout)>0){
    sectionTitle('Budget & clôture');
    l1 = kv('Budget approuvé', w.budgetApprouve?('Oui — '+(w.approbateurBudget||'')):'Non', col1X, colW);
    l2 = kv('Clôture financière', w.clotureFinanciere?('Oui — '+(w.clotureFinancierePar||'')):'Non', col2X, colW);
    y += Math.max(l1,l2)*4.2+7;
  }

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text('2NA-MAINT-PROD — Ordre de travail '+(w.numero||''), marginL, 292); doc.text(String(i)+' / '+pageCount, pageW-marginR, 292, {align:'right'}); }

  doc.save('2NA-MAINT-PROD_'+(w.numero||'OT')+'.pdf');
  toast('PDF généré');
}

/* ============ MODALS ============ */
function openModal(title, bodyHtml, onSave){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="modal-close">${ICONS.close}</button></div>
      <div class="modal-body">
        <div id="modal-form">${bodyHtml}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Annuler</button>
          <button class="btn btn-accent" id="modal-save">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const data = {};
    document.querySelectorAll('#modal-form [data-f]').forEach(el=>{
      data[el.dataset.f] = el.type==='checkbox' ? (el.checked?'on':'') : el.value;
    });
    onSave(data);
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function promptModal(title, label, onConfirm, opts={}){
  openModal(title, `<label class="field"><span>${label}</span>${opts.textarea
    ? `<textarea data-f="val" rows="3" placeholder="${opts.placeholder||''}">${esc(opts.defaultValue||'')}</textarea>`
    : `<input data-f="val" value="${esc(opts.defaultValue||'')}" placeholder="${opts.placeholder||''}"/>`}</label>`,
  (data)=>{
    const val = (data.val||'').trim();
    if(opts.required!==false && !val){ alert('Ce champ est requis'); return; }
    closeModal();
    onConfirm(val);
  });
}
function confirmModal(message, onConfirm, opts={}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="confirm-overlay">
    <div class="modal" style="max-width:440px;">
      <div class="modal-head"><h3>${opts.title||'Confirmation'}</h3><button class="icon-btn" id="confirm-x">${ICONS.close}</button></div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text);line-height:1.5;margin:0 0 18px;">${esc(message)}</p>
        <div class="modal-actions" style="justify-content:flex-end;">
          <button class="btn btn-ghost" id="confirm-cancel">Annuler</button>
          <button class="btn ${opts.danger?'btn-ghost':'btn-accent'}" id="confirm-ok" ${opts.danger?'style="color:var(--danger);border-color:var(--danger);"':''}>${opts.okLabel||'Confirmer'}</button>
        </div>
      </div>
    </div>
  </div>`;
  const close = ()=>{ document.getElementById('modal-root').innerHTML=''; };
  document.getElementById('confirm-overlay').addEventListener('click', e=>{ if(e.target.id==='confirm-overlay') close(); });
  document.getElementById('confirm-x').addEventListener('click', close);
  document.getElementById('confirm-cancel').addEventListener('click', close);
  document.getElementById('confirm-ok').addEventListener('click', ()=>{ close(); onConfirm(); });
}
