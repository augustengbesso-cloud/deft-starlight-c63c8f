let reportFrom = '';
let reportTo = '';
function drawParetoChart(canvas, labels, values){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  if(!values.length) return;
  const total = values.reduce((a,b)=>a+b,0) || 1;
  let cum = 0; const cumPct = values.map(v=>{ cum+=v; return cum/total*100; });
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F2A63C';
  const steel = getComputedStyle(document.documentElement).getPropertyValue('--steel').trim() || '#5B8CB3';
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
  const max = Math.max(1, ...values);
  const padL=8, padR=8, padT=14, padB=30;
  const chartW = W-padL-padR, chartH = H-padT-padB;
  const n = values.length;
  const gap = chartW/n, bw = gap*0.55;
  ctx.font = '9px Inter, sans-serif';
  values.forEach((v,i)=>{
    const h = (v/max)*chartH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-h);
    ctx.fillStyle = accent; ctx.globalAlpha = .85; ctx.fillRect(x,y,bw,h); ctx.globalAlpha = 1;
    ctx.fillStyle = muted; ctx.textAlign = 'center';
    ctx.fillText((labels[i]||'').toString().slice(0,9), x+bw/2, H-10);
  });
  ctx.beginPath();
  cumPct.forEach((p,i)=>{
    const x = padL + i*gap + gap/2;
    const y = padT + chartH - (p/100*chartH);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = steel; ctx.lineWidth = 2; ctx.stroke();
  cumPct.forEach((p,i)=>{
    const x = padL + i*gap + gap/2;
    const y = padT + chartH - (p/100*chartH);
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fillStyle = steel; ctx.fill();
  });
  const y80 = padT + chartH - (80/100*chartH);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padL,y80); ctx.lineTo(W-padR,y80); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = muted; ctx.textAlign = 'left'; ctx.font = '9px Inter, sans-serif';
  ctx.fillText('80%', padL, y80-3);
}
function computeReportData(){
  const from = reportFrom, to = reportTo;
  const inRange = d => { if(!from && !to) return true; if(!d) return false; if(from && d<from) return false; if(to && d>to) return false; return true; };
  const em = equipMap();
  const pm = Object.fromEntries(state.parts.map(p=>[p.id,p]));
  const wos = state.workOrders.filter(w=>inRange(w.dateCreation));

  const coutTotal = wos.reduce((a,w)=>a+Number(w.cout||0),0);
  const coutParType = {};
  wos.forEach(w=>{ const t=w.type||'Autre'; coutParType[t]=(coutParType[t]||0)+Number(w.cout||0); });
  const coutParEquip = {};
  wos.forEach(w=>{ if(!w.equipementId) return; coutParEquip[w.equipementId]=(coutParEquip[w.equipementId]||0)+Number(w.cout||0); });
  const coutParFamille = {};
  wos.forEach(w=>{ const eq=em[w.equipementId]; const f=eq?eq.type:'Non affecté'; coutParFamille[f]=(coutParFamille[f]||0)+Number(w.cout||0); });
  const spentByCC = {};
  wos.forEach(w=>{ const eq=em[w.equipementId]; const cc=eq&&eq.centreCoutId?eq.centreCoutId:null; if(cc) spentByCC[cc]=(spentByCC[cc]||0)+Number(w.cout||0); });
  const budgetVsReel = state.costCenters.map(c=>({code:c.code, nom:c.nom, budget:Number(c.budgetAnnuel||0), reel:spentByCC[c.id]||0}));

  const fuelLogs = state.fuelLogs.filter(f=>inRange(f.date));
  const fuelParEquip = {};
  fuelLogs.forEach(f=>{ const o=fuelParEquip[f.equipementId]=fuelParEquip[f.equipementId]||{l:0,cout:0}; o.l+=Number(f.quantite||0); o.cout+=Number(f.cout||0); });
  const litresTotal = fuelLogs.reduce((a,f)=>a+Number(f.quantite||0),0);
  const coutCarburantTotal = fuelLogs.reduce((a,f)=>a+Number(f.cout||0),0);

  const sortiesValidees = state.reservations.filter(r=>r.statut==='Sortie validée' && inRange(r.dateSortie||r.dateCreation));
  const valeurPiecesConsommees = sortiesValidees.reduce((a,r)=>{ const pt=pm[r.partId]; return a+(pt?Number(pt.coutUnitaire||0)*Number(r.quantite||0):0); },0);
  const qtePiecesConsommees = sortiesValidees.reduce((a,r)=>a+Number(r.quantite||0),0);
  const entreesStock = (state.stockMovements||[]).filter(m=>inRange(m.date));
  const qteEntrees = entreesStock.reduce((a,m)=>a+Number(m.quantite||0),0);
  const piecesSousSeuil = state.parts.filter(p=>Number(p.quantite)<=Number(p.seuil));
  const piecesCritiques = state.parts.filter(p=>p.critique);
  const consoParPiece = {};
  sortiesValidees.forEach(r=>{ consoParPiece[r.partId]=(consoParPiece[r.partId]||0)+Number(r.quantite||0); });

  const correctifs = wos.filter(w=>w.type==='Panne / Correctif');
  const closedCorrectifs = correctifs.filter(w=>w.dateCreation && w.dateFin);
  const mttrH = closedCorrectifs.length ? closedCorrectifs.reduce((a,w)=>a+Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5),0)/closedCorrectifs.length : 0;
  const pannesParEquip = {};
  correctifs.forEach(w=>{ if(w.equipementId) pannesParEquip[w.equipementId]=(pannesParEquip[w.equipementId]||0)+1; });
  let mtbfH = 0;
  const mtbfList = [];
  Object.keys(pannesParEquip).forEach(eid=>{
    const pannes = correctifs.filter(w=>w.equipementId===eid).map(w=>w.dateCreation).filter(Boolean).sort();
    if(pannes.length>=2){
      const gaps=[]; for(let i=1;i<pannes.length;i++) gaps.push((new Date(pannes[i])-new Date(pannes[i-1]))/36e5);
      const avg = gaps.reduce((a,b)=>a+b,0)/gaps.length;
      mtbfList.push({equip:em[eid], mtbfH:avg});
    }
  });
  if(mtbfList.length) mtbfH = mtbfList.reduce((a,x)=>a+x.mtbfH,0)/mtbfList.length;
  const nbCrees = wos.length;
  const nbClotures = wos.filter(w=>w.statut==='Clôturé').length;
  const pctPreventif = wos.length ? Math.round(wos.filter(w=>w.type==='Préventif').length/wos.length*1000)/10 : 0;
  const pctCorrectif = wos.length ? Math.round(correctifs.length/wos.length*1000)/10 : 0;

  const arretParEquip = {};
  correctifs.forEach(w=>{
    if(!w.equipementId || !w.dateCreation || !w.dateFin) return;
    const h = Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5);
    arretParEquip[w.equipementId] = (arretParEquip[w.equipementId]||0)+h;
  });

  const permisRenseigne = wos.filter(w=>w.permisTravail).length;
  const consignationRenseignee = wos.filter(w=>w.consignation && w.consignation.trim()).length;

  const paretoEquip = Object.entries(coutParEquip).map(([eid,cout])=>({label:em[eid]?em[eid].code:'?', cout}))
    .sort((a,b)=>b.cout-a.cout);

  return { coutTotal, coutParType, coutParEquip, coutParFamille, spentByCC, budgetVsReel,
    fuelParEquip, litresTotal, coutCarburantTotal,
    sortiesValidees, valeurPiecesConsommees, qtePiecesConsommees, qteEntrees, piecesSousSeuil, piecesCritiques, consoParPiece,
    mttrH, mtbfH, mtbfList, nbCrees, nbClotures, pctPreventif, pctCorrectif, correctifs,
    arretParEquip, permisRenseigne, consignationRenseignee, totalOT: wos.length,
    paretoEquip, em, pm };
}
function buildReportNarrative(d){
  const n = {};
  const typesSorted = Object.entries(d.coutParType).sort((a,b)=>b[1]-a[1]);
  n.finance = typesSorted.length
    ? `Sur la période analysée, le poste "${typesSorted[0][0]}" concentre la part la plus importante des dépenses de maintenance (${fmt(typesSorted[0][1])} FCFA, soit ${d.coutTotal?Math.round(typesSorted[0][1]/d.coutTotal*100):0}% du coût total).`
    : `Aucune dépense de maintenance enregistrée sur la période sélectionnée.`;
  const overBudget = d.budgetVsReel.filter(b=>b.budget>0 && b.reel/b.budget>=0.9);
  n.budget = overBudget.length
    ? `Attention : ${overBudget.map(b=>b.code).join(', ')} ${overBudget.length>1?'ont':'a'} consommé 90% ou plus de leur budget annuel — un dépassement est à anticiper si la tendance se poursuit.`
    : d.budgetVsReel.length ? `Aucun centre de coût ne dépasse 90% de son budget annuel sur la période.` : `Aucun centre de coût configuré.`;
  let nEquip80=0, cum=0; const totalPareto = d.paretoEquip.reduce((a,x)=>a+x.cout,0)||1;
  for(const x of d.paretoEquip){ cum+=x.cout; nEquip80++; if(cum/totalPareto>=0.8) break; }
  n.pareto = d.paretoEquip.length
    ? `${nEquip80} équipement(s) sur ${d.paretoEquip.length} concentrent 80% du coût total de maintenance : ${d.paretoEquip.slice(0,nEquip80).map(x=>x.label).join(', ')}. Ce sont les cibles prioritaires pour un renforcement du préventif ou une analyse de remplacement.`
    : `Pas assez de données pour établir une analyse Pareto sur la période.`;
  n.kpi = d.pctCorrectif > d.pctPreventif
    ? `La maintenance reste majoritairement réactive (${d.pctCorrectif}% de correctif contre ${d.pctPreventif}% de préventif) — un renforcement du plan préventif est recommandé pour réduire les pannes et le MTTR.`
    : `Le ratio préventif (${d.pctPreventif}%) est supérieur ou égal au correctif (${d.pctCorrectif}%) — la maintenance planifiée est bien engagée, à consolider.`;
  n.hse = d.totalOT
    ? `${Math.round(d.permisRenseigne/d.totalOT*100)}% des OT de la période ont un permis de travail formalisé et ${Math.round(d.consignationRenseignee/d.totalOT*100)}% une consignation renseignée.`
    : `Aucun OT sur la période pour évaluer la conformité HSE.`;
  n.stock = d.piecesSousSeuil.length>0
    ? `${d.piecesSousSeuil.length} article(s) sont actuellement sous leur seuil critique — un réapprovisionnement est à programmer pour éviter une rupture bloquant une intervention.`
    : `Aucun article sous seuil critique au moment de l'édition du rapport.`;
  return n;
}
function dataURLToUint8Array(dataURL){
  const base64 = dataURL.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function getParetoChartDataURL(){
  const c = document.getElementById('chart-pareto');
  if(c && c.width>0) return c.toDataURL('image/png');
  // fallback : dessiner hors écran si le canvas n'est pas monté (ex. export depuis un autre onglet)
  const off = document.createElement('canvas'); off.width=900; off.height=440; off.style.width='700px'; off.style.height='340px';
  document.body.appendChild(off);
  const rd = computeReportData(); const top = rd.paretoEquip.slice(0,8);
  drawParetoChart(off, top.map(x=>x.label), top.map(x=>x.cout));
  const url = off.toDataURL('image/png'); document.body.removeChild(off);
  return url;
}

function openModal(title, bodyHtml, onSave){
  const root = document.getElementById('modal-root');
  root.innerHTML = `

    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="modal-close">${ICONS.close}</button></div>

          <button class="btn btn-accent" id="modal-save">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{

    document.querySelectorAll('#modal-form [data-f]').forEach(el=>{
      data[el.dataset.f] = el.type==='checkbox' ? (el.checked?'on':'') : el.value;

    onSave(data);
  });
}

  const resan = document.querySelector('[data-open-modal="resa-new"]');
  if(resan) resan.addEventListener('click', ()=>{
    const r = {id:null, numero:null, type:RESA_TYPES[0], costCenterId:'', equipementId:'', partId: state.parts[0]?.id||'', quantite:1, receptionnaire:'', dateCreation:new Date().toISOString().slice(0,10)};
    openModal('Nouvelle réservation', resaForm(r), (data)=>{
      if(!data.partId){ alert('Sélectionne un article'); return; }
      state.resaCounter = (state.resaCounter||0)+1;
      const qty = Number(data.quantite)||1;
      state.reservations.push({...data, id:uid(), numero:'RES-'+String(state.resaCounter).padStart(4,'0'),
        costCenterId:data.costCenterId||null, equipementId:data.equipementId||null, workOrderId:null, quantite:qty, statut:'En attente'});
      persist(); closeModal(); render(); toast('Réservation créée — en attente de sortie magasin');
    });
  });
  document.querySelectorAll('[data-open-validate-resa]').forEach(b=>b.addEventListener('click',()=>{
    resaValidatingId = b.dataset.openValidateResa; render();
  }));
  const cancelValidate = document.getElementById('cancel-validate-resa');
  if(cancelValidate) cancelValidate.addEventListener('click', ()=>{ resaValidatingId = null; render(); });
  document.querySelectorAll('[data-confirm-validate-resa]').forEach(b=>b.addEventListener('click',()=>{
    const r = state.reservations.find(x=>x.id===b.dataset.confirmValidateResa);
    if(!r) return;
    const qtyInput = document.getElementById('resa-validate-qty');
    const qty = Number(qtyInput.value)||0;
    if(qty<=0){ alert('Quantité invalide'); return; }
    const pt = state.parts.find(p=>p.id===r.partId);
    if(pt && qty>Number(pt.quantite) && !confirm('La quantité saisie ('+qty+') dépasse le stock disponible ('+pt.quantite+'). Valider quand même ?')) return;
    if(!confirm('Confirmer la sortie magasin de '+r.numero+' pour '+qty+(pt?' '+uniteAbrev(pt):'')+' ?')) return;
    if(pt) pt.quantite = Math.max(0, Number(pt.quantite) - qty);
    r.quantite = qty;
    r.statut = 'Sortie validée';
    r.dateSortie = new Date().toISOString().slice(0,10);
    r.magasinier = currentUser ? currentUser.nomComplet : '';
    resaValidatingId = null;
    logAudit('Sortie stock validée — réservation '+r.numero+' — qté '+qty); persist(); render(); toast('Sortie validée, stock décrémenté');
  }));
  document.querySelectorAll('[data-del-resa]').forEach(b=>b.addEventListener('click',()=>{
    const r = state.reservations.find(x=>x.id===b.dataset.delResa);
    const warn = r && r.statut==='Sortie validée' ? ' Le stock déjà sorti ne sera pas réajusté.' : '';
    if(!confirm('Supprimer cette réservation ?'+warn)) return;
    state.reservations = state.reservations.filter(x=>x.id!==b.dataset.delResa);
    persist(); render(); toast('Réservation supprimée');
  }));

  // Créer une DA directement depuis un OT (liaison façon "Activer réservation/demande d'achat" SAP)
  document.querySelectorAll('[data-create-da-from-wo]').forEach(b=>b.addEventListener('click',()=>{
    const w = state.workOrders.find(x=>x.id===b.dataset.createDaFromWo);
    if(!w) return;
    const eq = equipMap()[w.equipementId];
    const d = {id:null, numero:null, type:'Via Ordre de Travail', description:w.titre, equipementId:w.equipementId, workOrderId:w.id,
      costCenterId: eq?eq.centreCoutId:'', montantEstime:0, fournisseur:'', demandeur: currentUser?currentUser.nomComplet:'', dateCreation:new Date().toISOString().slice(0,10), statut:'Ouverte'};
    openModal('Demande d\'achat liée à '+w.numero, daForm(d), (data)=>{
      if(!data.description){ alert('Description requise'); return; }
      state.daCounter = (state.daCounter||0)+1;
      state.purchaseRequests.push({...data, id:uid(), numero:'DA-'+String(state.daCounter).padStart(4,'0'),
        equipementId:data.equipementId||null, workOrderId:w.id, costCenterId:data.costCenterId||null, montantEstime:Number(data.montantEstime)});
      persist(); closeModal(); render(); toast('Demande d\'achat '+('DA-'+String(state.daCounter).padStart(4,'0'))+' créée et liée à '+w.numero);
    });
  }));

  // Demandes d'achat
  const dan = document.querySelector('[data-open-modal="da-new"]');
  if(dan) dan.addEventListener('click', ()=>{
    const d = {id:null, numero:null, type:DA_TYPES[0], description:'', equipementId:'', workOrderId:'', costCenterId:'', montantEstime:0, fournisseur:'', demandeur: currentUser?currentUser.nomComplet:'', dateCreation:new Date().toISOString().slice(0,10), statut:'Ouverte'};
    openModal('Nouvelle demande d\'achat', daForm(d), (data)=>{
      if(!data.description){ alert('Description requise'); return; }
      state.daCounter = (state.daCounter||0)+1;
      state.purchaseRequests.push({...data, id:uid(), numero:'DA-'+String(state.daCounter).padStart(4,'0'),
        equipementId:data.equipementId||null, workOrderId:data.workOrderId||null, costCenterId:data.costCenterId||null,
        montantEstime:Number(data.montantEstime)});
      persist(); closeModal(); render(); toast('Demande d\'achat créée');
    });
  });
  document.querySelectorAll('[data-edit-da]').forEach(b=>b.addEventListener('click',()=>{
    const d = state.purchaseRequests.find(x=>x.id===b.dataset.editDa);
    openModal('Modifier la demande d\'achat', daForm(d), (data)=>{
      Object.assign(d, data, {equipementId:data.equipementId||null, workOrderId:data.workOrderId||null, costCenterId:data.costCenterId||null, montantEstime:Number(data.montantEstime)});
      persist(); closeModal(); render(); toast('Demande d\'achat mise à jour');
    });
  }));
  document.querySelectorAll('[data-del-da]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cette demande d\'achat ?')) return;
    state.purchaseRequests = state.purchaseRequests.filter(x=>x.id!==b.dataset.delDa);
    persist(); render(); toast('Demande d\'achat supprimée');
  }));
  document.querySelectorAll('[data-convert-da]').forEach(b=>b.addEventListener('click',()=>{
    const d = state.purchaseRequests.find(x=>x.id===b.dataset.convertDa);
    if(!d) return;
    const bc = {id:null, purchaseRequestId:d.id, fournisseur:d.fournisseur||'', montant:d.montantEstime||0, dateCommande:new Date().toISOString().slice(0,10), dateLivraisonPrevue:'', statut:'Émis'};
    openModal('Créer le bon de commande', bcForm(bc), (data)=>{
      state.bcCounter = (state.bcCounter||0)+1;
      state.purchaseOrders.push({...data, id:uid(), numero:'BC-'+String(state.bcCounter).padStart(4,'0'), purchaseRequestId:d.id, montant:Number(data.montant), tauxReception:0, dateReception:'', receptionnaire:''});
      d.statut = 'Convertie en BC';
      persist(); closeModal(); render(); toast('Bon de commande créé');
    });
  }));

  // Bons de commande
  document.querySelectorAll('[data-edit-bc]').forEach(b=>b.addEventListener('click',()=>{
    const bc = state.purchaseOrders.find(x=>x.id===b.dataset.editBc);
    openModal('Modifier le bon de commande', bcForm(bc), (data)=>{
      Object.assign(bc, data, {montant:Number(data.montant)});
      persist(); closeModal(); render(); toast('Bon de commande mis à jour');
    });
  }));
  document.querySelectorAll('[data-del-bc]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer ce bon de commande ?')) return;
    state.purchaseOrders = state.purchaseOrders.filter(x=>x.id!==b.dataset.delBc);
    persist(); render(); toast('Bon de commande supprimé');
  }));
  document.querySelectorAll('[data-receive-bc]').forEach(b=>b.addEventListener('click',()=>{
    const bc = state.purchaseOrders.find(x=>x.id===b.dataset.receiveBc);
    openModal('Réception système', receptionForm(bc), (data)=>{
      const taux = Number(data.tauxReception)||0;
      Object.assign(bc, data, {tauxReception:taux, statut: taux>=100?'Réceptionné':'Réceptionné partiellement'});
      const da = state.purchaseRequests.find(x=>x.id===bc.purchaseRequestId);
      if(da && taux>=100) da.statut='Clôturée';
      persist(); closeModal(); render(); toast('Réception enregistrée');
    });
  }));

  // Utilisateurs (admin)
  const userCreateBtn = document.getElementById('user-create-btn');
  if(userCreateBtn) userCreateBtn.addEventListener('click', ()=>{
    openModal('Créer un utilisateur', userCreateForm(), async (data)=>{
      const identifiant = (data.identifiant||'').trim().toUpperCase();
      const nomComplet = (data.nomComplet||'').trim();
      const pass = data.motDePasse||'';
      if(!identifiant || !nomComplet || pass.length<6){ alert('Identifiant, nom complet et mot de passe (6 caractères min.) requis'); return; }
      const email = identifiantToEmail(identifiant);
      const adminIdentifiant = currentUser.identifiant;
      try{
        const { data: signData, error } = await sb.auth.signUp({ email, password: pass });
        if(error) throw error;
        if(signData.user){
          await sb.from('user_roles').insert({ user_id: signData.user.id, email, nom_complet: nomComplet, role:'technicien',
            identifiant, fonction:'Technicien', niveau_hierarchique:1, statut_compte:'Actif', niveau_approbation:'Technique', modules:{} });
        }
        await sb.auth.signOut();
        currentUser = null;
        closeModal();
        document.getElementById('app').style.display = 'none';
        authTab = 'login'; authError = 'Compte '+identifiant+' créé. Reconnecte-toi avec ton identifiant admin ('+(adminIdentifiant||'')+') pour continuer.';
        renderAuthScreen();
      }catch(err){ alert('Erreur : '+((err&&err.message)?traduireErreurAuth(err.message):String(err))); }
    });
  });

  document.querySelectorAll('[data-edit-user]').forEach(b=>b.addEventListener('click',()=>{
    const u = allUsers.find(x=>x.user_id===b.dataset.editUser);
    if(!u) return;
    openModal('Modifier le profil — '+(u.identifiant||u.nom_complet), userEditForm(u), async (data)=>{
      const modules = {};
      MODULES_ACCES.forEach(m=>{ const el = document.querySelector(`#modal-form [data-uf-mod="${m.id}"]`); if(el) modules[m.id]=el.value; });
      const updates = {
        nom_complet: data.nom_complet, fonction: data.fonction, niveau_hierarchique: Number(data.niveau_hierarchique),
        statut_compte: data.statut_compte, role: data.role, affectation: data.affectation, superieur_id: data.superieur_id||null,
        niveau_approbation: data.niveau_approbation, modules
      };
      try{
        const { error } = await sb.from('user_roles').update(updates).eq('user_id', u.user_id);
        if(error) throw error;
        Object.assign(u, updates);
        closeModal(); render(); toast('Profil mis à jour');
      }catch(err){ alert('Erreur : '+((err&&err.message)||String(err))); }
    });
  }));

  // Postes responsables
  const posteAdd = document.getElementById('poste-add');
  if(posteAdd) posteAdd.addEventListener('click', ()=>{
    const input = document.getElementById('poste-new-input');
    const val = input.value.trim();
    if(val && !state.postes.includes(val)){ state.postes.push(val); persist(); render(); }
  });
  document.querySelectorAll('[data-poste-del]').forEach(b=>b.addEventListener('click',()=>{
    const i = Number(b.dataset.posteDel);
    const used = state.workOrders.some(w=>w.poste===state.postes[i]) || state.personnel.some(p=>p.poste===state.postes[i]);
    if(used && !confirm('Ce poste est utilisé. Le supprimer quand même ?')) return;
    state.postes.splice(i,1); persist(); render();
  }));
  document.querySelectorAll('[data-poste-up]').forEach(b=>b.addEventListener('click',()=>{
    const i = Number(b.dataset.posteUp);
    if(i>0){ const tmp=state.postes[i-1]; state.postes[i-1]=state.postes[i]; state.postes[i]=tmp; persist(); render(); }
  }));
  document.querySelectorAll('[data-poste-down]').forEach(b=>b.addEventListener('click',()=>{
    const i = Number(b.dataset.posteDown);
    if(i<state.postes.length-1){ const tmp=state.postes[i+1]; state.postes[i+1]=state.postes[i]; state.postes[i]=tmp; persist(); render(); }
  }));

  // Apparence / thème
  document.querySelectorAll('[data-theme-key]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const key = e.target.dataset.themeKey;
      const val = e.target.value;
      state.theme = { ...DEFAULT_THEME, ...(state.theme||{}) };
      state.theme[key] = val;
      applyTheme(state.theme);
      const label = e.target.nextElementSibling; if(label) label.textContent = val;
    });
    inp.addEventListener('change', ()=>{ persist(); toast('Couleur enregistrée'); });
  });
  const themeSave = document.getElementById('theme-save');
  if(themeSave) themeSave.addEventListener('click', ()=>{ persist(); toast('Thème enregistré'); });
  const themeReset = document.getElementById('theme-reset');
  if(themeReset) themeReset.addEventListener('click', ()=>{
    state.theme = { ...DEFAULT_THEME };
    applyTheme(state.theme);
    persist(); render(); toast('Thème réinitialisé');
  });

  // Personnel
  const personnelImportBtn = document.getElementById('personnel-import-btn');
  const personnelImportFile = document.getElementById('personnel-import-file');
  if(personnelImportBtn && personnelImportFile){
    personnelImportBtn.addEventListener('click', ()=>personnelImportFile.click());
    personnelImportFile.addEventListener('change', (e)=>{ if(e.target.files[0]) readExcelFile(e.target.files[0], importPersonnelRows); });
  }
  const pern = document.querySelector('[data-open-modal="personnel-new"]');
  if(pern) pern.addEventListener('click', ()=>{
    const p = {id:null, nom:'', poste:state.postes[0], affectation:AFFECTATIONS[0], statut:'Actif', telephone:'', dateEmbauche:''};
    openModal('Nouvelle personne', personnelForm(p), (data)=>{
      if(!data.nom){ alert('Nom requis'); return; }
      state.personnel.push({...data, id:uid()});
      persist(); closeModal(); render(); toast('Personne ajoutée');
    });
  });
  document.querySelectorAll('[data-edit-personnel]').forEach(b=>b.addEventListener('click',()=>{
    const p = state.personnel.find(x=>x.id===b.dataset.editPersonnel);
    openModal('Modifier la personne', personnelForm(p), (data)=>{
      Object.assign(p, data);
      persist(); closeModal(); render(); toast('Personne mise à jour');
    });
  }));
  document.querySelectorAll('[data-del-personnel]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cette personne ?')) return;
    state.personnel = state.personnel.filter(x=>x.id!==b.dataset.delPersonnel);
    persist(); render(); toast('Personne supprimée');
  }));
}

/* ============ INIT ============ */
document.getElementById('refresh-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = '...';
  const res = await loadRemote();
  if(res.ok){
    state = res.payload;
    applyTheme(state.theme);
    saveLocalCache();
    render();
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  btn.disabled = false; btn.textContent = 'Actualiser';
});

async function bootstrap(){
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-screen').innerHTML = '<div class="auth-card" style="text-align:center;color:var(--muted);font-size:13px;">Vérification de la session…</div>';
  document.getElementById('app').style.display = 'none';
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event==='SIGNED_OUT'){ currentUser=null; authTab='login'; authError=''; renderAuthScreen(); }
  });
  if(session){
    await afterAuthSuccess();
  } else {
    renderAuthScreen();
  }
}

async function init(){
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  let res = await loadRemote();
  let data = null;
  if(res.ok){
    data = res.payload;
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  if(!data){
    data = loadLocalCache();
  }
  if(!data){
    const locs = seedLocations();
    data = { fleet: seedFleet(), workOrders: [], fuelLogs: [], parts: [], pmPlans: [],
      locations: locs, plantEquipment: seedPlantEquipment(locs), notifications: [], measuringPoints: [],
      costCenters: seedCostCenters(), productionLogs: [], woCounter: 0, equipTypes: [...DEFAULT_EQUIP_TYPES], personnel: [], theme: { ...DEFAULT_THEME },
      purchaseRequests: [], purchaseOrders: [], daCounter: 0, bcCounter: 0, reservations: [], resaCounter: 0, postes: [...DEFAULT_POSTES], avisCounter: 0, stockMovements: [], auditLog: [] };
  } else {
    // compatibilité ascendante : ajoute le module usine si absent d'un compte existant
    if(!data.locations || data.locations.length===0){
      const locs = seedLocations();
      data.locations = locs;
      data.plantEquipment = (data.plantEquipment && data.plantEquipment.length) ? data.plantEquipment : seedPlantEquipment(locs);
    } else {
      data.plantEquipment = data.plantEquipment || [];
    }
    data.notifications = data.notifications || [];
    data.measuringPoints = data.measuringPoints || [];
    data.costCenters = (data.costCenters && data.costCenters.length) ? data.costCenters : seedCostCenters();
    data.productionLogs = data.productionLogs || [];
    data.equipTypes = (data.equipTypes && data.equipTypes.length) ? data.equipTypes : [...DEFAULT_EQUIP_TYPES];
    data.personnel = data.personnel || [];
    data.theme = data.theme || { ...DEFAULT_THEME };
    data.purchaseRequests = data.purchaseRequests || [];
    data.purchaseOrders = data.purchaseOrders || [];
    data.daCounter = data.daCounter || 0;
    data.bcCounter = data.bcCounter || 0;
    data.reservations = data.reservations || [];
    data.resaCounter = data.resaCounter || 0;
    data.postes = (data.postes && data.postes.length) ? data.postes : [...DEFAULT_POSTES];
    data.avisCounter = data.avisCounter || 0;
    data.stockMovements = data.stockMovements || [];
    data.auditLog = data.auditLog || [];
    (data.parts||[]).forEach(p=>{
      if(p.fournisseurPrincipal===undefined) p.fournisseurPrincipal = p.fournisseur||'';
      if(!p.categorie) p.categorie = CATEGORIES_ARTICLE[4];
      if(!p.statutStock) p.statutStock = 'Libre';
      if(p.seuilMax===undefined) p.seuilMax = 0;
      if(p.pointReappro===undefined) p.pointReappro = 0;
      if(p.critique===undefined) p.critique = false;
      if(!p.niveauCriticite) p.niveauCriticite = 'C';
      if(!p.unite) p.unite = 'Pièce (PCE)';
    });
    (data.notifications||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(n=>{
      if(!n.numero){ data.avisCounter++; n.numero = 'AV-'+String(data.avisCounter).padStart(4,'0'); }
    });
    // compatibilité ascendante : numérote les anciens ordres de travail et complète les nouveaux champs
    data.woCounter = data.woCounter || 0;
    (data.workOrders||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(w=>{
      if(!w.numero){ data.woCounter++; w.numero = 'OT-'+String(data.woCounter).padStart(4,'0'); }
      if(!w.poste) w.poste = data.postes[0];
      if(!w.dateDebut) w.dateDebut = w.dateCreation || '';
      if(!w.operations) w.operations = [];
      // ancien format : simple liste de textes -> nouvelles tâches avec intervenants
      w.operations = w.operations.map(op => typeof op === 'string' ? { id:uid(), description:op, affectations:[] } : op);
      if(!w.piecesUtilisees) w.piecesUtilisees = [];
      // ancien format : pièces déjà décomptées directement, on les marque réservées pour ne pas les re-réserver
      w.piecesUtilisees = w.piecesUtilisees.map(pu => pu.reserved===undefined ? {...pu, id:pu.id||uid(), reserved:true, reservationId:null} : pu);
      if(w.permisTravail===undefined) w.permisTravail = false;
      if(w.consignation===undefined) w.consignation = '';
      if(w.budgetApprouve===undefined) w.budgetApprouve = false;
      if(w.approbateurBudget===undefined) w.approbateurBudget = '';
      if(w.clotureFinanciere===undefined) w.clotureFinanciere = false;
      if(w.clotureFinancierePar===undefined) w.clotureFinancierePar = '';
      if(!w.documents) w.documents = [];
      if(w.statutAvantSuspension===undefined) w.statutAvantSuspension = null;
      if(w.archive===undefined) w.archive = false;
      if(w.motifAnnulation===undefined) w.motifAnnulation = '';
      if(w.categorieEquipement===undefined || !w.categorieEquipement){
        const inFleet = (data.fleet||[]).some(e=>e.id===w.equipementId);
        const inPlant = (data.plantEquipment||[]).some(e=>e.id===w.equipementId);
        w.categorieEquipement = inFleet ? 'Flotte' : inPlant ? 'Usine' : '';
      }
      if(w.type==='Correctif') w.type = 'Panne / Correctif';
      // migration de l'ancien statut "Ouvert" vers le nouveau workflow "Créé"
      if(w.statut==='Ouvert') w.statut = 'Créé';
    });
  }
  state = data;
  applyTheme(state.theme);
  render();
  persist();
  startPolling();
}
bootstrap();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
