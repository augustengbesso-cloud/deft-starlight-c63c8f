<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2NA Entreprise — Maintenance & Carburant</title>
<meta name="theme-color" content="#14171A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14171A; --panel:#1B1F23; --panelR:#22272C; --border:#2E353B; --borderL:#3A424A;
  --text:#ECEAE5; --muted:#8B939A; --accent:#F2A63C; --steel:#5B8CB3; --success:#4CAF6D; --danger:#E5533C;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.oswald{font-family:'Oswald',sans-serif;}
#app{display:flex;min-height:100vh;}
/* Sidebar */
#sidebar{width:220px;flex-shrink:0;background:#101315;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.brand{padding:20px 16px;border-bottom:1px solid var(--border);}
.brand-row{display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.brand-title{font-family:'Oswald',sans-serif;letter-spacing:.05em;font-weight:600;font-size:14px;text-transform:uppercase;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;}
nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:14px;text-align:left;cursor:pointer;border-left:2px solid transparent;font-family:'Inter',sans-serif;}
.navbtn:hover{color:var(--text);}
.navbtn.active{background:var(--panelR);color:var(--accent);border-left:2px solid var(--accent);}
.navbtn svg{flex-shrink:0;}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 12px 4px;font-family:'Oswald',sans-serif;}
.nav-section:first-child{padding-top:4px;}
.sidebar-foot{padding:12px 16px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);}
/* Main */
#main{flex:1;min-width:0;overflow-y:auto;height:100vh;}
.wrap{max-width:1500px;margin:0;padding:24px 32px;}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0 0 2px;}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 20px;}
.headrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
/* Plate */
.plate{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 1px 3px rgba(0,0,0,.25);transition:border-color .15s ease;}
.plate:hover{border-color:var(--borderL);}
.kpi-clickable{cursor:pointer;transition:transform .12s ease, border-color .15s ease;}
.kpi-clickable:hover{border-color:var(--accent);transform:translateY(-2px);}
.kpi-clickable:active{transform:translateY(0);}
.legend-clickable{cursor:pointer;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background .12s ease;}
.legend-clickable:hover{background:var(--panelR);}
.p16{padding:16px;} .p14{padding:14px;}
/* Grid */
.grid{display:grid;gap:12px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-fleet{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.grid-status{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}
/* KPI card */
.kpi-label{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:var(--muted);letter-spacing:.03em;}
.kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.kpi-value{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:-.02em;}
.kpi-unit{font-size:12px;color:var(--muted);margin-left:4px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
/* Buttons */
button{font-family:'Inter',sans-serif;}
.btn{padding:9px 14px;border-radius:6px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--borderL);background:var(--panelR);color:var(--text);}
.btn:hover{opacity:.85;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1A1508;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;}
.icon-btn:hover{color:var(--text);}
/* Inputs */
input,select,textarea{background:var(--bg);border:1px solid var(--borderL);color:var(--text);border-radius:5px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;}
label.field span{color:var(--muted);}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.formgrid .span2{grid-column:1/-1;}
/* Led */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);}
.right{text-align:right;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{background:var(--panel);border:1px solid var(--borderL);border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;margin:0;}
.modal-body{padding:20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.wo-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panelR);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;}
.wo-headband{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
.wo-headband-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:'Oswald',sans-serif;}
/* misc */
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.wrapwrap{flex-wrap:wrap;}
.card-item{background:var(--panelR);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 0;color:var(--muted);gap:8px;font-size:14px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panelR);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;text-transform:uppercase;background:var(--panelR);color:var(--muted);border:1px solid transparent;}
.badge-danger{background:var(--danger);color:#fff;}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:#101315;position:sticky;top:0;z-index:10;}
#sync-text{display:none;}
#refresh-btn{padding:5px 10px;font-size:12px;flex-shrink:0;}
#logout-btn-top{padding:5px 10px;font-size:12px;flex-shrink:0;}
#topbar-actions{margin-left:auto;display:flex;gap:6px;align-items:center;}
#user-info-top{font-size:12px;color:var(--muted);}
#user-info-top b{color:var(--text);font-weight:500;}
@media(max-width:700px){
  #sidebar{width:64px;}
  .brand-sub, .navbtn span.label, .sidebar-foot, .nav-section{display:none;}
  .brand-title{display:none;}
  .navbtn{justify-content:center;}
  .formgrid{grid-template-columns:1fr;}
}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);border-radius:6px;padding:3px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:5px;font-size:13px;cursor:pointer;color:var(--muted);}
.auth-tab.active{background:var(--panelR);color:var(--text);}
.auth-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;}
.auth-field span{color:var(--muted);}
.auth-error{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:16px;}
</style>
</head>
<body>
<div id="auth-screen" style="display:none;"></div>
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row"><span class="dot"></span><span class="brand-title">2NA ENTREPRISE</span></div>
      <div class="brand-sub">Maintenance & Carburant</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="fleet-count"></div>
    </div>
  </aside>
  <main id="main">
    <div id="topbar">
      <span id="user-info-top"></span>
      <span class="led" id="sync-dot" style="background:var(--muted)"></span>
      <span id="sync-text">Connexion…</span>
      <div id="topbar-actions">
        <button class="btn btn-ghost" id="refresh-btn">Actualiser</button>
        <button class="btn btn-ghost" id="logout-btn-top">Déconnexion</button>
      </div>
    </div>
    <div class="wrap" id="content"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.js"></script>
<script>
/* ============ SUPABASE (multi-device sync) ============ */
const SUPABASE_URL = "https://hfeggflrcbhzvyyejvqf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dh4nBfDMJmnj9WN2KNvdOg_cVwN4vkl";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: {
    fetch: (url, options={}) => fetch(url, { ...options, cache: 'no-store' })
  }
});

/* ============ AUTHENTIFICATION & RÔLES ============ */
const ROLE_LABELS = {
  admin: 'Administrateur', planificateur: 'Planificateur maintenance',
  technicien: 'Technicien terrain', rh: 'Responsable RH'
};
const FONCTIONS = ["Technicien","Planificateur","Superviseur","Responsable","Administrateur"];
const NIVEAUX_HIER = [1,2,3,4,5];
const STATUTS_COMPTE = ["Actif","Inactif"];
const NIVEAUX_APPROBATION = ["Technique","Financière","Stratégique"];
const MODULES_ACCES = [
  {id:'maintenance', label:'Maintenance (OT, Préventif, Demandes d\'intervention)'},
  {id:'stock', label:'Stock / Pièces de rechange'},
  {id:'achats', label:'Achats (DA / BC)'},
  {id:'rh', label:'RH'},
  {id:'reporting', label:'Reporting / KPI'},
];
const NIVEAUX_ACCES = ["Aucun","Lecture seule","Écriture","Validation","Administration complète"];
const EMAIL_DOMAIN = '2na-erp.internal';
function identifiantToEmail(id){ return String(id||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'')+'@'+EMAIL_DOMAIN; }
let currentUser = null; // { id, email, role, nomComplet, identifiant, fonction, niveauHierarchique, statutCompte, superieurId, niveauApprobation, modules }
let authTab = 'login';
let authError = '';

function renderAuthScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('auth-screen');
  el.style.display = 'flex';
  el.innerHTML = `
  <div class="auth-card">
    <div class="brand-row" style="justify-content:center;margin-bottom:20px;">
      <span class="dot"></span><span class="brand-title" style="font-size:16px;">2NA ENTREPRISE</span>
    </div>
    <h3 class="oswald" style="text-align:center;text-transform:uppercase;font-size:14px;color:var(--muted);margin:0 0 20px;">Connexion</h3>
    <div class="auth-error">${esc(authError)}</div>
    <label class="auth-field"><span>Identifiant</span><input id="auth-id" placeholder="Ex: USR001" style="text-transform:uppercase;"/></label>
    <label class="auth-field"><span>Mot de passe</span><input id="auth-pass" type="password" placeholder="••••••••"/></label>
    <button class="btn btn-accent" id="auth-submit" style="width:100%;justify-content:center;margin-top:6px;">Se connecter</button>
    <p style="font-size:11px;color:var(--muted);margin-top:12px;">Pas encore de compte ? Un administrateur doit t'en créer un dans le module "Utilisateurs".</p>
  </div>`;
  authTab = 'login';
  document.getElementById('auth-submit').addEventListener('click', handleAuthSubmit);
  [document.getElementById('auth-id'), document.getElementById('auth-pass')].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
  });
}

let pendingNomComplet = '';
async function handleAuthSubmit(){
  const identifiant = document.getElementById('auth-id').value.trim().toUpperCase();
  const pass = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-submit');
  authError = '';
  if(!identifiant || !pass){ authError = 'Identifiant et mot de passe requis'; renderAuthScreen(); return; }
  const email = identifiantToEmail(identifiant);
  btn.disabled = true; btn.textContent = '...';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterAuthSuccess();
  }catch(e){
    authError = (e && e.message) ? traduireErreurAuth(e.message) : String(e);
    renderAuthScreen();
  }
  btn.disabled = false; btn.textContent = 'Se connecter';
}
function traduireErreurAuth(msg){
  if(/Invalid login credentials/i.test(msg)) return 'Identifiant ou mot de passe incorrect';
  if(/already registered/i.test(msg)) return 'Cet identifiant est déjà utilisé';
  if(/Password should be/i.test(msg)) return 'Mot de passe trop court (6 caractères minimum)';
  if(/Compte désactivé/i.test(msg)) return msg;
  return msg;
}
async function fetchUserRole(userId, email, nomComplet){
  try{
    const { data } = await sb.from('user_roles').select('*').eq('user_id', userId).maybeSingle();
    if(data) return data;
  }catch(e){}
  const fresh = { user_id:userId, email, nom_complet: nomComplet||email, role:'technicien',
    identifiant:'', fonction:'Technicien', niveau_hierarchique:1, statut_compte:'Actif', affectation:'Les deux', niveau_approbation:'Technique', modules:{} };
  try{ await sb.from('user_roles').insert(fresh); }catch(e){}
  return fresh;
}
async function afterAuthSuccess(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderAuthScreen(); return; }
  const roleRow = await fetchUserRole(session.user.id, session.user.email, pendingNomComplet);
  pendingNomComplet = '';
  if(roleRow.statut_compte==='Inactif'){
    await sb.auth.signOut();
    currentUser = null;
    authError = 'Compte désactivé — contacte un administrateur.';
    renderAuthScreen();
    return;
  }
  currentUser = { id: session.user.id, email: session.user.email, role: roleRow.role, nomComplet: roleRow.nom_complet || session.user.email,
    identifiant: roleRow.identifiant||'', fonction: roleRow.fonction||'Technicien', niveauHierarchique: roleRow.niveau_hierarchique||1,
    statutCompte: roleRow.statut_compte||'Actif', affectation: roleRow.affectation||'Les deux', superieurId: roleRow.superieur_id||null, niveauApprobation: roleRow.niveau_approbation||'Technique',
    modules: roleRow.modules||{} };
  try{ await sb.rpc('update_last_login'); }catch(e){}
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await init();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  authTab = 'login'; authError = '';
  renderAuthScreen();
}
function canSee(navId){
  if(!currentUser) return false;
  if(currentUser.statutCompte==='Inactif') return false;
  if(currentUser.role==='admin') return true;
  const moduleOf = { wo:'maintenance', pm:'maintenance', notif:'maintenance', floc:'maintenance', plant:'maintenance', production:'maintenance', measures:'maintenance', fleet:'maintenance', fuel:'maintenance',
    parts:'stock', resa:'stock', da:'achats', bc:'achats', personnel:'rh', dashboard:'reporting', costs:'reporting', reports:'reporting' };
  const mod = moduleOf[navId];
  if(mod && currentUser.modules && currentUser.modules[mod]==='Aucun') return false;
  const restricted = {
    planificateur: ['users','audit'],
    technicien: ['fleet','pm','fuel','parts','floc','plant','production','measures','costs','personnel','reports','settings','users','audit','da','bc','resa'],
    rh: ['fleet','wo','wo-edit','pm','fuel','parts','floc','plant','production','notif','measures','costs','reports','settings','users','audit','da','bc','resa'],
  };
  const blocked = restricted[currentUser.role] || [];
  return !blocked.includes(navId);
}

/* ============ ICONS (minimal inline SVG set) ============ */
const ICONS = {

  wrench:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L2.4 18.6l3 3 6.9-6.9a4 4 0 0 1 5.4-5.4L14.7 6.3Z"/></svg>',
  calendar:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  fuel:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V8a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14M3 22h10M14 9l3 3v6a2 2 0 1 0 4 0v-4l-2-2"/></svg>',
  package:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15M21 8l-9 5-9-5 9-5 9 5ZM3 8v8l9 5 9-5V8M12 13v9"/></svg>',
  report:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6M9 15h6M9 11h6M9 19h3"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 6-11 11-5-5"/></svg>',

const STORE_KEY = 'cigrac-erp-data';

function loadLocalCache(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveLocalCache(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

async function loadRemote(){
  try{
    const { data, error } = await sb.from('erp_data').select('data, updated_at').eq('id','main').maybeSingle();
    if(error) return { ok:false, error: error.message || JSON.stringify(error) };
    if(!data) return { ok:false, error: "Aucune ligne trouvée (id='main') dans la table erp_data" };
    return { ok:true, payload: data.data, updatedAt: data.updated_at };
  }catch(e){
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}
let isSaving = false;
async function saveRemote(){
  isSaving = true;
  try{
    const { error } = await sb.from('erp_data').upsert({ id:'main', data: state, updated_at: new Date().toISOString() });
    if(error){ setSyncStatus(false, 'écriture: '+error.message); return; }
    setSyncStatus(true, 'enregistré');
  }catch(e){ setSyncStatus(false, 'écriture: '+((e&&e.message)||String(e))); }
  finally{ isSaving = false; }
}
function persist(){
  saveLocalCache();
  saveRemote();
}
function setSyncStatus(ok, detail){
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  const now = new Date().toLocaleTimeString('fr-FR');
  const full = ok
    ? `OK ${now}${detail ? ' · '+detail : ''}`
    : `ERREUR ${now} · ${detail || 'inconnue'}`;
  if(dot){ dot.style.background = ok ? 'var(--success)' : 'var(--danger)'; dot.title = full; }
  if(txt){ txt.textContent = full; txt.title = full; }
}
let pollTimer = null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const modalOpen = document.getElementById('modal-root').innerHTML.trim() !== '';
    if(modalOpen || isSaving) return;
    const res = await loadRemote();
    if(isSaving) return; // une sauvegarde a démarré pendant le chargement -> on ignore ce cycle pour ne pas écraser
    if(res.ok){
      const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
      setSyncStatus(true, 'donnée du serveur: '+stamp);
      const changed = JSON.stringify(res.payload) !== JSON.stringify(state);
      if(changed){
        state = res.payload;
        applyTheme(state.theme);
        saveLocalCache();
        render();
      }
    } else {
      setSyncStatus(false, res.error);
    }
  }, 6000);
}

/* ============ MINI GRAPHIQUES (canvas, sans librairie) ============ */
function drawBarChart(canvas, labels, values, color){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const max = Math.max(1, ...values);
  const padL=8, padB=22, padT=10, padR=8;
  const chartW = W-padL-padR, chartH = H-padB-padT;
  const bw = chartW/values.length*0.6;
  const gap = chartW/values.length;
  ctx.font = '10px Inter, sans-serif';
  values.forEach((v,i)=>{
    const h = (v/max)*chartH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-h);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(x, y, bw, h);
    ctx.globalAlpha = 1;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x+bw/2, H-6);
  });
}
function drawDonut(canvas, segments){
  // segments: [{label, value, color}]
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=W/2, cy=H/2, rOuter=Math.min(W,H)/2-4, rInner=rOuter*0.6;
  let start = -Math.PI/2;
  segments.forEach(s=>{
    const angle = (s.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.arc(cx,cy,rInner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    start += angle;
  });
}

function computeKpis(){
  const total = state.fleet.length || 1;
  const dispo = state.fleet.filter(e=>e.statut==="Opérationnel").length;
  const pannes = state.fleet.filter(e=>e.statut==="En panne").length;
  const disponibilite = Math.round((dispo/total)*1000)/10;
  const closed = state.workOrders.filter(w=>w.type==="Correctif" && w.statut==="Terminé" && w.dateCreation && w.dateFin);
  const mttrH = closed.length ? closed.reduce((a,w)=>a+Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5),0)/closed.length : 0;
  const coutMaintenance = state.workOrders.reduce((a,w)=>a+Number(w.cout||0),0);
  const coutCarburant = state.fuelLogs.reduce((a,f)=>a+Number(f.cout||0),0);
  const litresTotal = state.fuelLogs.reduce((a,f)=>a+Number(f.quantite||0),0);
  const ouverts = state.workOrders.filter(w=>WO_STATUTS_ACTIFS.includes(w.statut)).length;
  const partsBas = state.parts.filter(p=>Number(p.quantite)<=Number(p.seuil)).length;

  const totalPlant = state.plantEquipment.length || 1;
  const dispoPlant = state.plantEquipment.filter(e=>e.statut==="Opérationnel").length;
  const disponibilitePlant = Math.round((dispoPlant/totalPlant)*1000)/10;
  const notifOuvertes = state.notifications.filter(n=>n.statut!=="Clôturée" && n.statut!=="Convertie en OT").length;
  const oeeList = state.productionLogs.map(oeeOf).filter(v=>v!==null);
  const oeeMoyen = oeeList.length ? Math.round(oeeList.reduce((a,b)=>a+b,0)/oeeList.length*10)/10 : null;
  const daOuvertes = state.purchaseRequests.filter(d=>d.statut==="Ouverte").length;
  const bcEnAttente = state.purchaseOrders.filter(b=>b.statut!=="Réceptionné").length;

  return {disponibilite, pannes, mttrH, coutMaintenance, coutCarburant, litresTotal, ouverts, partsBas, total,
    disponibilitePlant, notifOuvertes, oeeMoyen, totalPlant: state.plantEquipment.length, daOuvertes, bcEnAttente};
}
function oeeOf(p){
  const fonct = Number(p.tempsFonctionnementMin||0), arret = Number(p.tempsArretMin||0);
  const dispo = (fonct+arret)>0 ? fonct/(fonct+arret) : null;
  const perf = p.quantitePrevue>0 ? Math.min(1, Number(p.quantiteProduite||0)/Number(p.quantitePrevue)) : null;
  const qual = p.quantiteProduite>0 ? Math.max(0,(Number(p.quantiteProduite)-Number(p.piecesRebut||0))/Number(p.quantiteProduite)) : null;
  if(dispo===null||perf===null||qual===null) return null;
  return dispo*perf*qual*100;
}

function drawDashboardCharts(){
  const em = equipMap();
  const matchesFilter = (equipementId)=>{
    if(dashFilterEquip!=='Tous') return equipementId===dashFilterEquip;
    if(dashFilterFamille!=='Tous') return em[equipementId] && em[equipementId].type===dashFilterFamille;
    return true;
  };
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const monthLabel = d => d.toLocaleDateString('fr-FR',{month:'short'});
  const maintByMonth = months.map(d=>{
    const key = monthKey(d);
    return state.workOrders.filter(w=>(w.dateCreation||'').slice(0,7)===key && matchesFilter(w.equipementId)).reduce((a,w)=>a+Number(w.cout||0),0);
  });
  const fuelByMonth = months.map(d=>{
    const key = monthKey(d);
    return state.fuelLogs.filter(f=>(f.date||'').slice(0,7)===key && matchesFilter(f.equipementId)).reduce((a,f)=>a+Number(f.quantite||0),0);
  });
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F2A63C';

  const danger = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#E5533C';
  drawBarChart(document.getElementById('chart-maint-cost'), months.map(monthLabel), maintByMonth, accent);
  drawBarChart(document.getElementById('chart-fuel-cost'), months.map(monthLabel), fuelByMonth, steel);
  const woColors = { 'Créé':muted, 'Confirmé':steel, 'En cours':accent, 'Suspendu':accent, 'Terminé':steel, 'Clôturé':success, 'Annulé':danger };
  const woFiltered = state.workOrders.filter(w=>matchesFilter(w.equipementId));
  drawDonut(document.getElementById('chart-wo-status'), WO_STATUTS.map(s=>({label:s, value: woFiltered.filter(w=>w.statut===s).length || 0.0001, color: woColors[s]})));
  const persColors = [accent, steel, success];
  drawDonut(document.getElementById('chart-personnel'), AFFECTATIONS.map((a,i)=>({label:a, value: state.personnel.filter(p=>p.statut==='Actif'&&p.affectation===a).length || 0.0001, color: persColors[i%3]})));

function readExcelFile(file, onRows){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      onRows(rows);
    }catch(err){ alert("Erreur de lecture du fichier : "+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function findCol(row, names){
  const keys = Object.keys(row);
  for(const n of names){
    const k = keys.find(k=>k.trim().toLowerCase()===n.toLowerCase());
    if(k!==undefined && row[k]!=='') return row[k];
  }
  // repli : correspondance partielle (ex: "Nom ou désignation" contient "nom")
  for(const n of names){
    const k = keys.find(k=>k.trim().toLowerCase().includes(n.toLowerCase()));
    if(k!==undefined && row[k]!=='') return row[k];
  }
  return '';
}
function importFleetRows(rows){
  let count=0;
  rows.forEach(r=>{
    const code = String(findCol(r,['Code'])||'').trim();
    if(!code) return;
    const nom = String(findCol(r,['Nom','Désignation','Designation'])||code);
    const type = String(findCol(r,["Famille","Famille d'équipement",'Type'])||state.equipTypes[0]);
    if(!state.equipTypes.includes(type)) state.equipTypes.push(type);
    const statut = String(findCol(r,['Statut'])||'Opérationnel');
    const heures = Number(findCol(r,['Heures','Heures compteur']))||0;
    const km = Number(findCol(r,['Kilométrage','KM','Km']))||0;
    const ccCode = String(findCol(r,['Centre de coût','Centre de cout'])||'').trim();
    const cc = state.costCenters.find(c=>c.code.toLowerCase()===ccCode.toLowerCase());

function matchUnite(raw){
  if(!raw) return 'Pièce (PCE)';
  const r = String(raw).trim().toLowerCase();
  for(const u of UNITES_ARTICLE){
    const abbrevMatch = u.match(/\(([^)]+)\)/);
    const abbrev = abbrevMatch ? abbrevMatch[1].toLowerCase() : '';
    const label = u.split(' (')[0].toLowerCase();
    if(r===abbrev || r===label || u.toLowerCase()===r) return u;
  }
  const aliases = {
    'kg':'Kilogramme (KG)','kgs':'Kilogramme (KG)','g':'Gramme (G)','l':'Litre (L)','litre':'Litre (L)','litres':'Litre (L)',
    'm':'Mètre (M)','metre':'Mètre (M)','mètre':'Mètre (M)','m2':'Mètre carré (M2)','m3':'Mètre cube (M3)',
    'pce':'Pièce (PCE)','piece':'Pièce (PCE)','pièce':'Pièce (PCE)','pieces':'Pièce (PCE)','pièces':'Pièce (PCE)',
    'un':'Unité (UN)','unite':'Unité (UN)','unité':'Unité (UN)','t':'Tonne (T)','tonne':'Tonne (T)',
    'bt':'Boîte (BT)','boite':'Boîte (BT)','boîte':'Boîte (BT)','car':'Carton (CAR)','carton':'Carton (CAR)',
    'lot':'Lot (LOT)','jeu':'Jeu / Kit (JEU)','kit':'Jeu / Kit (JEU)','pr':'Paire (PR)','paire':'Paire (PR)',
    'sac':'Sac (SC)','sachet':'Sachet (SAC)','bidon':'Bidon (BID)','rouleau':'Rouleau (RLO)','rlo':'Rouleau (RLO)','bouteille':'Bouteille (BOU)'
  };
  return aliases[r] || 'Pièce (PCE)';
}

function dureeAffectation(af){
  if(!af || !af.heureDebut || !af.heureFin) return null;
  const [h1,m1] = af.heureDebut.split(':').map(Number);
  const [h2,m2] = af.heureFin.split(':').map(Number);
  if([h1,m1,h2,m2].some(n=>isNaN(n))) return null;
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins < 0) mins += 24*60;
  return mins;
}
function fmtDuree(mins){
  if(mins==null) return '—';
  const h = Math.floor(mins/60), m = mins%60;
  return (h>0 ? h+'h' : '') + String(m).padStart(2,'0');
}

function wireWOEditor(){
  const w = woDraft;
  if(!w) return;
  const back = ()=>{ currentView='wo'; woDraft=null; render(); };
  const backBtn = document.getElementById('wo-back'); if(backBtn) backBtn.addEventListener('click', back);
  const backBtn2 = document.getElementById('wo-back-2'); if(backBtn2) backBtn2.addEventListener('click', back);
  document.querySelectorAll('[data-wo-tab]').forEach(b=>b.addEventListener('click',()=>{ woEditTab=b.dataset.woTab; render(); }));
  function val(id, fallback){ const el = document.getElementById(id); return el ? el.value : fallback; }
  function syncFieldsIntoW(){
    w.titre = val('wo-f-titre', w.titre);
    w.description = val('wo-f-desc', w.description);
    w.priorite = val('wo-f-priorite', w.priorite);
    w.dateDebut = val('wo-f-debut', w.dateDebut);
    w.dateFin = val('wo-f-fin', w.dateFin);
    w.technicien = val('wo-f-tech', w.technicien);
    w.cout = val('wo-f-cout', w.cout);
    w.type = val('wo-f-type', w.type);
    w.typeTravail = val('wo-f-typetravail', w.typeTravail);
  }
  const catSel = document.getElementById('wo-f-categorie');
  if(catSel) catSel.addEventListener('change', (e)=>{
    syncFieldsIntoW();
    w.categorieEquipement = e.target.value;
    w.equipementId = '';
    render();
  });
  const posteSel = document.getElementById('wo-f-poste');
  if(posteSel) posteSel.addEventListener('change', (e)=>{ syncFieldsIntoW(); w.poste = e.target.value; render(); });

  function quickTransition(newStatut, extra){
    w.statut = newStatut;
    if((newStatut==='Terminé'||newStatut==='Clôturé') && !w.dateFin) w.dateFin = new Date().toISOString().slice(0,10);
    if(extra) Object.assign(w, extra);
    const idx = state.workOrders.findIndex(x=>x.id===w.id);
    if(idx>-1) state.workOrders[idx] = {...w};
    const eq = equipMap()[w.equipementId];
    if(eq){
      if(newStatut==='Terminé' || newStatut==='Clôturé' || newStatut==='Annulé') eq.statut='Opérationnel';
      else if(newStatut==='En cours') eq.statut='En maintenance';
    }
    logAudit('OT '+w.numero+' → '+newStatut); persist(); toast('Statut : '+newStatut); render();
  }
  const confirmBtn = document.getElementById('wo-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>quickTransition('Confirmé'));
  const launchBtn = document.getElementById('wo-launch');
  if(launchBtn) launchBtn.addEventListener('click', ()=>quickTransition('En cours'));
  const finishBtn = document.getElementById('wo-finish');
  if(finishBtn) finishBtn.addEventListener('click', ()=>quickTransition('Terminé'));
  const closeBtn = document.getElementById('wo-close-toolbar');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ if(confirm('Clôturer techniquement '+w.numero+' ?')) quickTransition('Clôturé'); });
  const suspendBtn = document.getElementById('wo-suspend');
  if(suspendBtn) suspendBtn.addEventListener('click', ()=>{
    const motif = prompt('Motif de suspension (pièces manquantes, ressources...) :');
    if(motif===null) return;
    quickTransition('Suspendu', { statutAvantSuspension: w.statut, motifSuspension: motif });

  const cancelBtn = document.getElementById('wo-cancel');

    const idx = state.workOrders.findIndex(x=>x.id===w.id);
    if(idx>-1) state.workOrders[idx] = {...w};
    logAudit('Budget approuvé pour '+w.numero); persist(); toast('Budget approuvé'); render();
  });
  const closeFinancialBtn = document.getElementById('wo-close-financial');
  if(closeFinancialBtn) closeFinancialBtn.addEventListener('click', ()=>{
    if(!confirm('Confirmer la clôture financière de '+w.numero+' ?')) return;
    w.clotureFinanciere = true;
    w.clotureFinancierePar = currentUser ? currentUser.nomComplet : '';
    const idx = state.workOrders.findIndex(x=>x.id===w.id);
    if(idx>-1) state.workOrders[idx] = {...w};
    logAudit('Clôture financière '+w.numero); persist(); toast('Ordre clôturé financièrement'); render();
  });

  const docAddBtn = document.getElementById('wo-doc-add');
  if(docAddBtn) docAddBtn.addEventListener('click', async ()=>{
    const fileInput = document.getElementById('wo-doc-file');
    const statusEl = document.getElementById('wo-doc-status');
    const file = fileInput.files[0];
    if(!file){ if(statusEl) statusEl.textContent = 'Choisis un fichier d\'abord.'; return; }
    if(statusEl) statusEl.textContent = 'Téléversement en cours…';
    docAddBtn.disabled = true;
    try{
      const path = Date.now()+'_'+uid()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const { error: upErr } = await sb.storage.from('documents').upload(path, file);
      if(upErr) throw upErr;
      const { data: urlData } = sb.storage.from('documents').getPublicUrl(path);
      w.documents.push({ name:file.name, url:urlData.publicUrl, path, uploadedAt:new Date().toISOString().slice(0,10), uploadedBy: currentUser?currentUser.nomComplet:'' });
      if(statusEl) statusEl.textContent = '';
      fileInput.value = '';
      render();
    }catch(err){
      if(statusEl) statusEl.textContent = 'Échec : '+((err&&err.message)||String(err))+' — vérifie que le bucket "documents" existe dans Supabase.';
      docAddBtn.disabled = false;
    }

  document.querySelectorAll('[data-wo-doc-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = Number(b.dataset.woDocDel);

    try{ if(doc.path) await sb.storage.from('documents').remove([doc.path]); }catch(e){}

  const opAdd = document.getElementById('wo-op-add');

  document.querySelectorAll('[data-wo-op-del]').forEach(b=>b.addEventListener('click',()=>{
    w.operations.splice(Number(b.dataset.woOpDel),1); render();
  }));
  w.operations.forEach((op,oi)=>{
    const openBtn = document.querySelector(`[data-wo-aff-open="${oi}"]`);
    if(openBtn) openBtn.addEventListener('click', ()=>{
      woOpFormOpen[op.id] = true;
      woOpFormOpen[op.id+'_poste'] = state.postes[0];
      render();
    });

    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
      delete woOpFormOpen[op.id];
      render();
    });
    const posteSel = document.getElementById('wo-aff-poste-'+oi);
    if(posteSel) posteSel.addEventListener('change', (e)=>{
      woOpFormOpen[op.id+'_poste'] = e.target.value;
      render();
    });
    const affConfirm = document.querySelector(`[data-wo-aff-confirm="${oi}"]`);
    if(affConfirm) affConfirm.addEventListener('click', ()=>{
      const poste = document.getElementById('wo-aff-poste-'+oi).value;
      const technicien = document.getElementById('wo-aff-tech-'+oi).value.trim();
      const heureDebut = document.getElementById('wo-aff-debut-'+oi).value;
      const heureFin = document.getElementById('wo-aff-fin-'+oi).value;
      if(!technicien){ alert('Nom du technicien requis'); return; }
      const dureeMin = dureeAffectation({heureDebut,heureFin});
      op.affectations.push({id:uid(), poste, technicien, heureDebut, heureFin, dureeMin});
      delete woOpFormOpen[op.id];
      render();
    });

  document.querySelectorAll('[data-wo-aff-del]').forEach(b=>b.addEventListener('click',()=>{
    const [oi,ai] = b.dataset.woAffDel.split(':').map(Number);
    w.operations[oi].affectations.splice(ai,1); render();
  }));

  const partCodeInput = document.getElementById('wo-part-code');

    partCodeInput.addEventListener('input', ()=>{
      const val = partCodeInput.value.trim().toLowerCase();
      const pt = state.parts.find(p=>(p.ref||'').toLowerCase()===val);
      if(pt){
        partDesig.value = pt.nom;
        partUnite.value = uniteAbrev(pt);
        partStock.textContent = 'Stock : '+fmt(pt.quantite)+' '+uniteAbrev(pt);
        partStock.style.color = Number(pt.quantite)>0 ? 'var(--muted)' : 'var(--danger)';
      } else {
        partDesig.value = val ? 'Article introuvable' : '';
        partUnite.value = '';
        partStock.textContent = 'Stock : —';
        partStock.style.color = 'var(--muted)';
      }
    });
  }
  const partAddBtn = document.getElementById('wo-part-add');
  if(partAddBtn) partAddBtn.addEventListener('click', ()=>{
    const code = document.getElementById('wo-part-code').value.trim().toLowerCase();
    const pt = state.parts.find(p=>(p.ref||'').toLowerCase()===code);
    const qty = Number(document.getElementById('wo-part-qty').value)||1;
    if(!pt){ alert("Code article introuvable dans le stock"); return; }
    w.piecesUtilisees.push({id:uid(), partId:pt.id, quantite:qty, reserved:false, reservationId:null});
    render();
  });
  document.querySelectorAll('[data-wo-part-edit]').forEach(b=>b.addEventListener('click',()=>{
    woPartEditIndex = Number(b.dataset.woPartEdit); render();
  }));
  document.querySelectorAll('[data-wo-part-edit-cancel]').forEach(b=>b.addEventListener('click',()=>{
    woPartEditIndex = null; render();
  }));
  document.querySelectorAll('[data-wo-part-edit-confirm]').forEach(b=>b.addEventListener('click',()=>{
    const i = Number(b.dataset.woPartEditConfirm);
    const pu = w.piecesUtilisees[i];
    const newQty = Number(document.getElementById('wo-part-edit-qty').value);
    if(!newQty || newQty<=0){ alert('Quantité invalide'); return; }
    pu.quantite = newQty;
    if(pu.reservationId){
      const resa = state.reservations.find(r=>r.id===pu.reservationId);
      if(resa && resa.statut!=='Sortie validée') resa.quantite = newQty;
    }
    woPartEditIndex = null; persist(); render(); toast('Quantité mise à jour');
  }));
  document.querySelectorAll('[data-wo-part-del]').forEach(b=>b.addEventListener('click',()=>{
    w.piecesUtilisees.splice(Number(b.dataset.woPartDel),1); render();
  }));

  function reservePendingParts(){
    w.piecesUtilisees.forEach(pu=>{
      if(pu.reserved) return;
      state.resaCounter = (state.resaCounter||0)+1;
      const resa = { id:uid(), numero:'RES-'+String(state.resaCounter).padStart(4,'0'), type:'Ordre de travail',
        costCenterId:null, equipementId:w.equipementId, workOrderId:w.id, partId:pu.partId, quantite:pu.quantite,
        receptionnaire:w.technicien||'', dateCreation:new Date().toISOString().slice(0,10), statut:'En attente' };
      state.reservations.push(resa);
      pu.reserved = true;
      pu.reservationId = resa.id;
    });
  }

  const saveHandler = ()=>{
    w.equipementId = val('wo-f-equip', w.equipementId);
    w.titre = val('wo-f-titre', w.titre);
    w.description = val('wo-f-desc', w.description);
    w.type = val('wo-f-type', w.type);
    w.typeTravail = val('wo-f-typetravail', w.typeTravail);
    w.poste = val('wo-f-poste', w.poste);
    w.priorite = val('wo-f-priorite', w.priorite);
    w.statut = val('wo-f-statut', w.statut);
    w.dateDebut = val('wo-f-debut', w.dateDebut);
    w.dateFin = val('wo-f-fin', w.dateFin);
    w.technicien = val('wo-f-tech', w.technicien);
    w.cout = Number(val('wo-f-cout', w.cout))||0;
    const permisEl = document.getElementById('wo-f-permis'); if(permisEl) w.permisTravail = permisEl.checked;
    const consigEl = document.getElementById('wo-f-consignation'); if(consigEl) w.consignation = consigEl.value;
    w.dateCreation = w.dateCreation || w.dateDebut;
    if(!w.titre || !w.equipementId){ alert('Libellé et équipement requis — vérifie l\'onglet "Données générales"'); woEditTab='general'; render(); return; }
    if((w.statut==='Terminé' || w.statut==='Clôturé') && !w.dateFin) w.dateFin = new Date().toISOString().slice(0,10);
    const eqForStatus = [...state.fleet,...state.plantEquipment].find(x=>x.id===w.equipementId);

    if(woIsNew){
      state.woCounter = (state.woCounter||0)+1;
      w.numero = 'OT-'+String(state.woCounter).padStart(4,'0');
      w.id = uid();
      state.workOrders.push(w);
      reservePendingParts();
      if(eqForStatus){
        if(w.statut==='Terminé' || w.statut==='Clôturé') eqForStatus.statut='Opérationnel';
        else eqForStatus.statut='En maintenance';
      }
      logAudit('Création OT '+w.numero+' — '+w.titre);
      persist(); currentView='wo'; woDraft=null; render(); toast('Ordre de travail '+w.numero+' créé');
    } else {
      reservePendingParts();
      const idx = state.workOrders.findIndex(x=>x.id===w.id);
      if(idx>-1) state.workOrders[idx] = w;
      if(eqForStatus){
        if(w.statut==='Terminé' || w.statut==='Clôturé' || w.statut==='Annulé') eqForStatus.statut='Opérationnel';
        else if(w.statut!=='Créé' || eqForStatus.statut!=='En panne') eqForStatus.statut='En maintenance';
      }
      persist(); currentView='wo'; woDraft=null; render(); toast('Ordre de travail mis à jour');
    }
  };
  const saveBtn = document.getElementById('wo-save'); if(saveBtn) saveBtn.addEventListener('click', saveHandler);
  const cancelNewBtn = document.getElementById('wo-cancel-new'); if(cancelNewBtn) cancelNewBtn.addEventListener('click', back);
}

/* ============ PREVENTIVE ============ */
function pmStatus(p, em){
  const now = new Date();
  if(p.type==='Heures' || p.type==='Kilométrage'){
    const eq = em[p.equipementId];
    const unite = p.type==='Heures' ? 'h' : 'km';
    const valeurActuelle = eq ? Number(p.type==='Heures' ? eq.heures : eq.km) || 0 : 0;
    const prochaineValeur = Number(p.derniereValeur||0) + Number(p.intervalle||0);
    const restant = prochaineValeur - valeurActuelle;
    const seuilUrgent = p.type==='Heures' ? 20 : 200;
    const urgent = restant <= seuilUrgent;
    const label = restant<=0 ? `Dépassé de ${Math.abs(Math.round(restant))} ${unite}` : `Reste ${Math.round(restant)} ${unite} (échéance à ${prochaineValeur} ${unite})`;
    return { urgent, label };
  }
  const daysLeft = p.prochaine? Math.round((new Date(p.prochaine)-now)/864e5): null;
  const urgent = daysLeft!==null && daysLeft<=7;
  const label = p.prochaine ? `Échéance : ${p.prochaine}${daysLeft!==null?` (${daysLeft}j)`:''}` : 'Non planifié';
  return { urgent, label };
}
function viewPM(){
  const em = equipMap();
  const sorted = [...state.pmPlans].sort((a,b)=> (pmStatus(a,em).urgent===pmStatus(b,em).urgent)?0:(pmStatus(a,em).urgent?-1:1));
  return `
  <div class="headrow">
    <div><h1>Maintenance préventive</h1><p class="subtitle" style="margin:0;">Planification par date ou par compteur (heures/km)</p></div>
    <button class="btn btn-accent" data-open-pm="new">${ICONS.plus} Nouveau plan</button>
  </div>
  ${sorted.length===0?`<div class="plate p16"><div class="empty">${ICONS.calendar}<span>Aucun plan préventif défini.</span></div></div>`:
  `<div style="display:flex;flex-direction:column;gap:8px;">
  ${sorted.map(p=>{
    const st = pmStatus(p, em);
    return `<div class="plate p14 between wrapwrap" style="gap:12px;">
      <div class="row"><span class="led" style="background:${st.urgent?'var(--danger)':'var(--success)'}"></span>
        <div><div style="font-size:13px;font-weight:500;">${esc(p.tache)}</div>
        <div style="font-size:12px;color:var(--muted);">${em[p.equipementId]?.code||'—'} · <span class="badge">${p.type||'Date'}</span>${p.type==='Date'||!p.type?` · tous les ${p.frequenceJours} j`:` · tous les ${p.intervalle} ${p.type==='Heures'?'h':'km'}`}</div></div>
      </div>
      <div class="row">
        <span style="font-size:12px;color:${st.urgent?'var(--danger)':'var(--muted)'}">${st.label}</span>
        <button class="icon-btn" data-open-pm="${p.id}">${ICONS.edit}</button>
        <button class="icon-btn" data-del-pm="${p.id}">${ICONS.trash}</button>
      </div>
    </div>`;
  }).join('')}
  </div>`}`;
}

let pmDraft = null;
let pmIsNew = false;
function blankPM(){
  return { id:null, equipementId: state.fleet[0]?.id||state.plantEquipment[0]?.id||'', tache:'', type:'Date',
    frequenceJours:90, derniere:'', prochaine:'', intervalle:250, derniereValeur:0 };
}
function openPMModal(id){
  pmIsNew = (id==='new');
  pmDraft = pmIsNew ? blankPM() : JSON.parse(JSON.stringify(state.pmPlans.find(x=>x.id===id)));
  renderPMModal();
}
function closePMModal(){ document.getElementById('modal-root').innerHTML=''; pmDraft=null; }
function renderPMModal(){
  const p = pmDraft;
  const allEquip = [...state.fleet.map(e=>({...e,grp:'Flotte'})), ...state.plantEquipment.map(e=>({...e,grp:'Usine'}))];
  const equipOpts = allEquip.map(e=>`<option value="${e.id}" ${p.equipementId===e.id?'selected':''}>[${e.grp}] ${e.code} — ${e.nom}</option>`).join('');
  const isCounter = p.type==='Heures' || p.type==='Kilométrage';
  const unite = p.type==='Heures' ? 'h' : 'km';

  const body = `
  <div class="formgrid">
    <label class="field span2"><span>Équipement</span><select id="pm-f-equip">${equipOpts}</select></label>
    <label class="field span2"><span>Tâche</span><input id="pm-f-tache" value="${esc(p.tache)}" placeholder="Vidange moteur + filtres"/></label>
    <label class="field span2"><span>Type de déclenchement</span><select id="pm-f-type">${PM_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
    ${!isCounter ? `
    <label class="field"><span>Fréquence (jours)</span><input type="number" id="pm-f-freq" value="${p.frequenceJours||90}"/></label>
    <label class="field"><span>Dernière réalisation</span><input type="date" id="pm-f-derniere" value="${p.derniere||''}"/></label>
    ` : `
    <label class="field"><span>Intervalle (${unite})</span><input type="number" id="pm-f-intervalle" value="${p.intervalle||(p.type==='Heures'?250:5000)}"/></label>
    <label class="field"><span>Dernier relevé au moment de l'entretien (${unite})</span><input type="number" id="pm-f-derniereValeur" value="${p.derniereValeur||0}"/></label>
    `}
  </div>
  <div class="modal-actions">
    <button class="btn btn-ghost" id="pm-cancel">Annuler</button>
    <button class="btn btn-accent" id="pm-save">Enregistrer</button>
  </div>`;

  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="pm-overlay">
    <div class="modal">
      <div class="modal-head"><h3>${pmIsNew?"Nouveau plan préventif":"Modifier le plan"}</h3><button class="icon-btn" id="pm-close">${ICONS.close}</button></div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;

  document.getElementById('pm-overlay').addEventListener('click', e=>{ if(e.target.id==='pm-overlay') closePMModal(); });
  document.getElementById('pm-close').addEventListener('click', closePMModal);
  document.getElementById('pm-cancel').addEventListener('click', closePMModal);
  document.getElementById('pm-f-type').addEventListener('change', (e)=>{ p.type = e.target.value; renderPMModal(); });

  document.getElementById('pm-save').addEventListener('click', ()=>{
    p.equipementId = document.getElementById('pm-f-equip').value;
    p.tache = document.getElementById('pm-f-tache').value;
    p.type = document.getElementById('pm-f-type').value;
    if(p.type==='Heures' || p.type==='Kilométrage'){
      p.intervalle = Number(document.getElementById('pm-f-intervalle').value)||0;
      p.derniereValeur = Number(document.getElementById('pm-f-derniereValeur').value)||0;
    } else {
      p.frequenceJours = Number(document.getElementById('pm-f-freq').value)||0;
      p.derniere = document.getElementById('pm-f-derniere').value;
      if(p.derniere && p.frequenceJours){ const d=new Date(p.derniere); d.setDate(d.getDate()+Number(p.frequenceJours)); p.prochaine=d.toISOString().slice(0,10); }
    }
    if(!p.tache || !p.equipementId){ alert('Tâche et équipement requis'); return; }
    if(pmIsNew){ p.id = uid(); state.pmPlans.push(p); persist(); closePMModal(); render(); toast('Plan préventif ajouté'); }
    else { const idx = state.pmPlans.findIndex(x=>x.id===p.id); if(idx>-1) state.pmPlans[idx]=p; persist(); closePMModal(); render(); toast('Plan préventif mis à jour'); }
  });
}

    <label class="field"><span>Engin</span><select data-f="equipementId">${opts}</select></label>
    <label class="field"><span>Date</span><input type="date" data-f="date" value="${f.date||''}"/></label>
    <label class="field"><span>Quantité (L)</span><input type="number" data-f="quantite" value="${f.quantite||0}"/></label>
    <label class="field"><span>Coût (FCFA)</span><input type="number" data-f="cout" value="${f.cout||0}"/></label>
    <label class="field"><span>Heures compteur</span><input type="number" data-f="heures" value="${f.heures||0}"/></label>
    <label class="field"><span>Opérateur</span><input data-f="operateur" value="${esc(f.operateur)}"/></label>
  </div>`;
}

/* ============ PARTS ============ */
const PARTS_TABS = [
  {id:'catalogue', label:'Catalogue'},
  {id:'stock', label:'Stock actuel'},
  {id:'seuils', label:'Seuils & alertes'},
  {id:'mouvements', label:'Mouvements'},
  {id:'couts', label:'Coûts & valorisation'},
  {id:'fournisseurs', label:'Fournisseurs'},
  {id:'critiques', label:'Pièces critiques'},
];
function partsSubNav(){
  return `<div class="row wrapwrap" style="gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px;">
    ${PARTS_TABS.map(t=>`<button class="btn ${partsSubTab===t.id?'btn-accent':'btn-ghost'}" style="font-size:12px;padding:6px 12px;" data-parts-tab="${t.id}">${t.label}</button>`).join('')}
  </div>`;
}
function viewParts(){
  const header = `
  <div class="headrow">
    <div><h1>Pièces & stock</h1><p class="subtitle" style="margin:0;">${state.parts.length} références</p></div>
    <div class="row">
      <div class="row" style="position:relative;">
        ${ICONS.search}
        <input id="parts-search" placeholder="Rechercher par code article ou désignation…" style="width:260px;padding-left:8px;" value="${esc(partsSearch)}"/>
      </div>
      <button class="btn btn-ghost" id="parts-export-btn">${ICONS.receipt} Exporter Excel</button>
      <button class="btn btn-ghost" id="parts-import-btn">${ICONS.plus} Importer Excel</button>
      <input type="file" id="parts-import-file" accept=".xlsx,.xls,.csv" style="display:none;"/>
      <button class="btn btn-accent" data-open-modal="part-new">${ICONS.plus} Nouvelle pièce</button>
    </div>
  </div>`;
  const q = partsSearch.trim().toLowerCase();
  const filteredParts = q ? state.parts.filter(p=>(p.ref||'').toLowerCase().includes(q) || (p.nom||'').toLowerCase().includes(q)) : state.parts;
  const pm = Object.fromEntries(state.parts.map(p=>[p.id,p]));
  const wom = Object.fromEntries(state.workOrders.map(w=>[w.id,w]));
  const pending = state.reservations.filter(r=>(r.statut||'En attente')==='En attente').sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||''));
  const pendingPanel = pending.length>0 ? `
  <div class="plate p16" style="margin-bottom:16px;border-left:3px solid var(--accent);">
    <h3 class="oswald" style="text-transform:uppercase;font-size:13px;margin:0 0 10px;color:var(--accent);">${ICONS.receipt} Réservations en attente de sortie (${pending.length})</h3>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${pending.map(r=>{
        const pt = pm[r.partId];
        const isValidating = resaValidatingId===r.id;
        return `<div class="card-item" style="padding:8px 12px;">
        <div class="between">
        <div>
          <span class="mono" style="font-size:11px;color:var(--muted);">${r.numero}</span>
          <span style="font-size:13px;margin-left:8px;">${pt?esc(pt.nom):'Pièce supprimée'} × ${fmt(r.quantite)}${pt?' '+uniteAbrev(pt):''}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px;">${r.workOrderId?('OT '+(wom[r.workOrderId]?.numero||'—')):r.type}</span>
        </div>
        ${isValidating?'':`<button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;color:var(--success);" data-open-validate-resa="${r.id}">${ICONS.check} Valider sortie</button>`}
        </div>
        ${isValidating?`<div class="row wrapwrap" style="gap:8px;align-items:center;margin-top:8px;background:var(--panel);border-radius:6px;padding:8px;">
          <span style="font-size:11px;color:var(--muted);">Stock actuel : <strong style="color:${pt&&Number(pt.quantite)<r.quantite?'var(--danger)':'var(--text)'};">${pt?fmt(pt.quantite)+' '+uniteAbrev(pt):'—'}</strong></span>
          <span style="font-size:11px;color:var(--muted);">Quantité à valider :</span>
          <input id="resa-validate-qty" type="number" min="1" max="${pt?pt.quantite:undefined}" value="${r.quantite}" style="width:90px;"/>
          <button class="btn btn-accent" data-confirm-validate-resa="${r.id}" style="font-size:11px;">${ICONS.check} Confirmer la sortie</button>
          <button class="btn btn-ghost" id="cancel-validate-resa" style="font-size:11px;">${ICONS.close} Annuler</button>
        </div>`:''}
      </div>`;}).join('')}
    </div>
  </div>` : '';

  const searchNote = q ? `<p style="font-size:12px;color:var(--muted);margin:-8px 0 12px;">${filteredParts.length} résultat(s) pour "${esc(partsSearch)}"</p>` : '';

  let body = '';
  if(partsSubTab==='catalogue') body = viewPartsCatalogue(filteredParts);
  else if(partsSubTab==='stock') body = viewPartsStock(filteredParts);
  else if(partsSubTab==='seuils') body = viewPartsSeuils(filteredParts);
  else if(partsSubTab==='mouvements') body = viewPartsMouvements();
  else if(partsSubTab==='couts') body = viewPartsCouts(filteredParts);
  else if(partsSubTab==='fournisseurs') body = viewPartsFournisseurs(filteredParts);
  else if(partsSubTab==='critiques') body = viewPartsCritiques(filteredParts);

  return header + pendingPanel + partsSubNav() + searchNote + body;
}

function partsEmptyState(){
  return `<div class="plate p16"><div class="empty">${ICONS.package}<span>Aucune pièce enregistrée.</span></div></div>`;
}

/* --- 1. Catalogue des articles --- */
function uniteAbrev(p){
  const u = p.unite || 'Pièce (PCE)';
  const m = u.match(/\(([^)]+)\)/);
  return m ? m[1] : u;
}
function viewPartsCatalogue(list){
  if(list.length===0) return partsEmptyState();
  const sorted = [...list].sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  return `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Code article</th><th>Désignation</th><th>Catégorie</th><th>Unité</th><th>Fournisseur principal</th><th>Code SAP/MM</th><th></th></tr></thead>
  <tbody>
  ${sorted.map(p=>`<tr>
    <td class="mono" style="color:var(--muted)">${esc(p.ref)||'—'}</td>
    <td>${esc(p.nom)}</td>
    <td><span class="badge">${esc(p.categorie)||'—'}</span></td>
    <td class="mono" style="color:var(--muted)">${uniteAbrev(p)}</td>
    <td style="color:var(--muted)">${esc(p.fournisseurPrincipal||p.fournisseur)||'—'}</td>
    <td class="mono" style="color:var(--muted)">${esc(p.codeSAP)||'—'}</td>
    <td><div class="row" style="justify-content:flex-end;"><button class="icon-btn" data-edit-part="${p.id}">${ICONS.edit}</button><button class="icon-btn" data-del-part="${p.id}">${ICONS.trash}</button></div></td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

/* --- 2. Stock actuel --- */
function viewPartsStock(list){
  if(list.length===0) return partsEmptyState();
  const sorted = [...list].sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  return `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Code article</th><th>Désignation</th><th class="right">Qté dispo.</th><th>Localisation</th><th>Statut</th><th>Dernier mouvement</th></tr></thead>
  <tbody>
  ${sorted.map(p=>`<tr>
    <td class="mono" style="color:var(--muted)">${esc(p.ref)||'—'}</td>
    <td>${esc(p.nom)}</td>
    <td class="right mono">${fmt(p.quantite)} <span style="color:var(--muted);font-size:11px;">${uniteAbrev(p)}</span></td>
    <td style="color:var(--muted)">${esc(p.localisation)||'—'}</td>
    <td><span class="badge" style="color:${p.statutStock==='Réservé'?'var(--accent)':p.statutStock==='En transit'?'var(--steel)':'var(--success)'};">${esc(p.statutStock)||'Libre'}</span></td>
    <td style="color:var(--muted);font-size:12px;">${p.dateDernierMouvement||'—'}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

/* --- 3. Seuils et alertes --- */
function viewPartsSeuils(list){
  if(list.length===0) return partsEmptyState();
  const sorted = [...list].sort((a,b)=> (Number(a.quantite)-Number(a.seuil)) - (Number(b.quantite)-Number(b.seuil)) );
  return `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Code article</th><th>Désignation</th><th class="right">Qté</th><th class="right">Seuil min</th><th class="right">Seuil max</th><th class="right">Pt réappro</th><th>Alerte</th></tr></thead>
  <tbody>
  ${sorted.map(p=>{ const low = Number(p.quantite)<=Number(p.seuil);
    const over = p.seuilMax && Number(p.quantite)>Number(p.seuilMax);
  return `<tr>
    <td class="mono" style="color:var(--muted)">${esc(p.ref)||'—'}</td>
    <td>${esc(p.nom)}</td>
    <td class="right mono" style="color:${low?'var(--danger)':'var(--text)'}">${fmt(p.quantite)} <span style="color:var(--muted);font-size:11px;">${uniteAbrev(p)}</span></td>
    <td class="right mono" style="color:var(--muted)">${fmt(p.seuil)}</td>
    <td class="right mono" style="color:var(--muted)">${p.seuilMax?fmt(p.seuilMax):'—'}</td>
    <td class="right mono" style="color:var(--muted)">${p.pointReappro?fmt(p.pointReappro):'—'}</td>
    <td>${low?`<span class="badge badge-danger">SOUS SEUIL</span>`:over?`<span class="badge" style="color:var(--accent);border-color:var(--accent);">SURSTOCK</span>`:`<span class="badge" style="color:var(--success);border-color:var(--success);">OK</span>`}</td>
  </tr>`;}).join('')}
  </tbody></table></div>`;
}

/* --- 4. Mouvements de stock --- */
function viewPartsMouvements(){
  const pm = Object.fromEntries(state.parts.map(p=>[p.id,p]));
  const wom = Object.fromEntries(state.workOrders.map(w=>[w.id,w]));
  const entrees = (state.stockMovements||[]).map(m=>({date:m.date, type:m.type, nom:pm[m.partId]?pm[m.partId].nom:'Pièce supprimée', qte:m.quantite, sens:'Entrée', detail:m.commentaire||m.fournisseur||''}));
  const sorties = state.reservations.filter(r=>r.statut==='Sortie validée').map(r=>({date:r.dateSortie||r.dateCreation, type:'Sortie magasin', nom:pm[r.partId]?pm[r.partId].nom:'Pièce supprimée', qte:r.quantite, sens:'Sortie', detail:r.workOrderId?('OT '+(wom[r.workOrderId]?.numero||'—')):r.numero}));
  const all = [...entrees, ...sorties].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `
  <div class="between" style="margin-bottom:12px;">
    <span style="font-size:12px;color:var(--muted);">Historique complet des entrées et sorties</span>
    <button class="btn btn-accent" data-open-modal="mvt-new" style="font-size:12px;">${ICONS.plus} Nouvelle entrée</button>
  </div>
  ${all.length===0?`<div class="plate p16"><div class="empty">${ICONS.receipt}<span>Aucun mouvement enregistré.</span></div></div>`:
  `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Date</th><th>Sens</th><th>Type</th><th>Article</th><th class="right">Qté</th><th>Détail</th></tr></thead>
  <tbody>
  ${all.map(m=>`<tr>
    <td style="color:var(--muted);font-size:12px;">${m.date||'—'}</td>
    <td><span class="badge" style="color:${m.sens==='Entrée'?'var(--success)':'var(--accent)'};">${m.sens}</span></td>
    <td style="color:var(--muted);">${esc(m.type)}</td>
    <td>${esc(m.nom)}</td>
    <td class="right mono">${fmt(m.qte)}</td>
    <td style="color:var(--muted);font-size:12px;">${esc(m.detail)}</td>
  </tr>`).join('')}
  </tbody></table></div>`}`;
}
function mvtForm(m){
  const partOpts = state.parts.map(p=>`<option value="${p.id}">${esc(p.ref||p.nom)} — ${esc(p.nom)}</option>`).join('');
  return `
  <div class="formgrid">
    <label class="field span2"><span>Article</span><select data-f="partId">${partOpts||'<option value="">Aucune pièce</option>'}</select></label>
    <label class="field"><span>Type d'entrée</span><select data-f="type">${TYPES_MOUVEMENT.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <label class="field"><span>Quantité</span><input type="number" data-f="quantite" value="1" min="1"/></label>
    <label class="field span2"><span>Fournisseur / commentaire</span><input data-f="commentaire" placeholder="Ex: BC-1234 / retour atelier"/></label>
    <label class="field span2"><span>Date</span><input type="date" data-f="date" value="${new Date().toISOString().slice(0,10)}"/></label>
  </div>`;
}

/* --- 5. Coûts et valorisation --- */
function viewPartsCouts(list){
  if(list.length===0) return partsEmptyState();
  const ccm = Object.fromEntries(state.costCenters.map(c=>[c.id,c]));
  const sorted = [...list].sort((a,b)=> (Number(b.quantite)*Number(b.coutUnitaire)) - (Number(a.quantite)*Number(a.coutUnitaire)) );
  const totalValeur = state.parts.reduce((a,p)=>a+Number(p.quantite)*Number(p.coutUnitaire),0);
  return `
  <div class="plate p16" style="margin-bottom:16px;max-width:320px;">
    <span class="wo-headband-label">Valeur totale du stock</span>
    <div class="mono" style="font-size:22px;color:var(--accent);">${fmt(totalValeur)} FCFA</div>
  </div>
  <div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Code article</th><th>Désignation</th><th class="right">Qté</th><th class="right">Coût unit.</th><th class="right">Valeur totale</th><th>Centre de coût</th></tr></thead>
  <tbody>
  ${sorted.map(p=>`<tr>
    <td class="mono" style="color:var(--muted)">${esc(p.ref)||'—'}</td>
    <td>${esc(p.nom)}</td>
    <td class="right mono">${fmt(p.quantite)}</td>
    <td class="right mono" style="color:var(--muted)">${fmt(p.coutUnitaire)}</td>
    <td class="right mono" style="color:var(--accent)">${fmt(Number(p.quantite)*Number(p.coutUnitaire))}</td>
    <td style="color:var(--muted);font-size:12px;">${p.centreCoutId?(ccm[p.centreCoutId]?.code||'—'):'—'}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}

/* --- 6. Fournisseurs et contrats --- */
function viewPartsFournisseurs(list){
  if(list.length===0) return partsEmptyState();
  const sorted = [...list].filter(p=>p.fournisseurPrincipal||p.fournisseur).sort((a,b)=>(a.fournisseurPrincipal||a.fournisseur||'').localeCompare(b.fournisseurPrincipal||b.fournisseur||''));
  return `${sorted.length===0?`<div class="plate p16"><div class="empty">${ICONS.package}<span>Aucun fournisseur renseigné.</span></div></div>`:
  `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Article</th><th>Fournisseur principal</th><th>Alternatifs</th><th>Délai livraison</th><th>Conditions</th></tr></thead>
  <tbody>
  ${sorted.map(p=>`<tr>
    <td>${esc(p.nom)}</td>
    <td style="color:var(--text)">${esc(p.fournisseurPrincipal||p.fournisseur)||'—'}</td>
    <td style="color:var(--muted);font-size:12px;">${esc(p.fournisseursAlternatifs)||'—'}</td>
    <td style="color:var(--muted);font-size:12px;">${p.delaiLivraison?p.delaiLivraison+' j':'—'}</td>
    <td style="color:var(--muted);font-size:12px;">${esc(p.conditions)||'—'}</td>
  </tr>`).join('')}
  </tbody></table></div>`}`;
}

/* --- 7. Pièces critiques / stratégiques --- */
function viewPartsCritiques(list){
  const critiques = list.filter(p=>p.critique).sort((a,b)=>(a.niveauCriticite||'C').localeCompare(b.niveauCriticite||'C'));
  return `${critiques.length===0?`<div class="plate p16"><div class="empty">${ICONS.alert}<span>Aucune pièce marquée critique. Coche "Pièce critique" dans la fiche article.</span></div></div>`:
  `<div class="plate" style="overflow:hidden;">
  <table><thead><tr><th>Niveau</th><th>Code article</th><th>Désignation</th><th class="right">Stock</th><th>MTBF</th><th>MTTR</th><th>Politique stock tampon</th></tr></thead>
  <tbody>
  ${critiques.map(p=>`<tr>
    <td><span class="badge" style="color:${p.niveauCriticite==='A'?'var(--danger)':p.niveauCriticite==='B'?'var(--accent)':'var(--muted)'};border-color:${p.niveauCriticite==='A'?'var(--danger)':p.niveauCriticite==='B'?'var(--accent)':'var(--muted)'};">${p.niveauCriticite||'C'}</span></td>
    <td class="mono" style="color:var(--muted)">${esc(p.ref)||'—'}</td>
    <td>${esc(p.nom)}</td>
    <td class="right mono">${fmt(p.quantite)}</td>
    <td style="color:var(--muted);font-size:12px;">${p.mtbf?p.mtbf+' h':'—'}</td>
    <td style="color:var(--muted);font-size:12px;">${p.mttr?p.mttr+' h':'—'}</td>
    <td style="color:var(--muted);font-size:12px;">${esc(p.politiqueStockTampon)||'—'}</td>
  </tr>`).join('')}
  </tbody></table></div>`}`;
}

/* ============ EMPLACEMENTS FONCTIONNELS ============ */
function buildLocTree(){
  const byParent = {};
  state.locations.forEach((l,idx)=>{
    if(l.ordre===undefined || l.ordre===null) l.ordre = idx;
    const key = l.parentId||'root';
    (byParent[key] = byParent[key]||[]).push(l);
  });
  Object.values(byParent).forEach(arr=>arr.sort((a,b)=>(a.ordre-b.ordre)));
  const result = [];
  function walk(parentKey, depth){
    (byParent[parentKey]||[]).forEach(l=>{
      const siblings = byParent[parentKey];
      const idx = siblings.indexOf(l);
      result.push({loc:l, depth, isFirst: idx===0, isLast: idx===siblings.length-1});
      walk(l.id, depth+1);
    });
  }
  walk('root', 0);
  return result;
}
function viewFLoc(){
  const tree = buildLocTree();
  return `
  <div class="headrow">
    <div><h1>Emplacements fonctionnels</h1><p class="subtitle" style="margin:0;">Hiérarchie Site › Atelier › Ligne › Machine — utilise ▲▼ pour réordonner manuellement</p></div>

  </div>

  `<div style="display:flex;flex-direction:column;gap:6px;">
  ${tree.map(({loc:l,depth,isFirst,isLast})=>`<div class="plate p14 between wrapwrap" style="gap:12px;padding-left:${14+depth*20}px;">
    <div class="row"><span class="badge">${l.type}</span><span style="font-size:13px;">${esc(l.nom)}</span></div>
    <div class="row" style="gap:2px;">

      <button class="icon-btn" data-floc-down="${l.id}" ${isLast?'disabled style="opacity:.3;"':''} title="Descendre">${ICONS.arrowDown||'▼'}</button>
