      c.statut = 'Refusé'; c.validePar = currentUser?currentUser.nomComplet:''; c.dateValidation = new Date().toISOString().slice(0,10);
      logAudit('Congé refusé pour '+(state.personnel.find(x=>x.id===c.personnelId)?.nom||'?'));
      persist(); render(); toast('Congé refusé');
    }, {danger:true, okLabel:'Refuser'});
  }));

  // Formations
  const ffs = document.getElementById('formations-filter-statut');
  if(ffs) ffs.addEventListener('change', e=>{ formationsFilterStatut=e.target.value; render(); });
  const ffp = document.getElementById('formations-filter-personnel');
  if(ffp) ffp.addEventListener('change', e=>{ formationsFilterPersonnel=e.target.value; render(); });
  const formationNewBtn = document.querySelector('#formation-new-btn');
  if(formationNewBtn) formationNewBtn.addEventListener('click', ()=>{
    formationDraft = {id:null, personnelId: state.personnel[0]?state.personnel[0].id:'', intitule:'', type: state.typesFormation[0], organisme:'', statut:'Planifiée', dateDebut:'', dateFin:'', dateExpiration:'', cout:0, notes:''};
    formationIsNew = true; currentView='formation-edit'; render();
  });
  document.querySelectorAll('[data-edit-formation]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    formationDraft = JSON.parse(JSON.stringify(state.trainings.find(x=>x.id===b.dataset.editFormation)));
    formationIsNew = false; currentView='formation-edit'; render();
  }));
  document.querySelectorAll('[data-edit-formation-row]').forEach(row=>row.addEventListener('click',()=>{
    formationDraft = JSON.parse(JSON.stringify(state.trainings.find(x=>x.id===row.dataset.editFormationRow)));
    formationIsNew = false; currentView='formation-edit'; render();
  }));
  if(currentView==='formation-edit'){
    const ffpBack = document.getElementById('ffp-back');
    if(ffpBack) ffpBack.addEventListener('click', ()=>{ currentView='formations'; formationDraft=null; render(); });
    const ffpSubmit = document.getElementById('ffp-submit');
    if(ffpSubmit) ffpSubmit.addEventListener('click', ()=>{
      const data = collectDataF();
      if(!data.intitule){ alert('Intitulé requis'); return; }
      data.cout = Number(data.cout)||0;
      if(formationIsNew){ state.trainings.push({...data, id:uid()}); persist(); toast('Formation ajoutée'); }
      else { const f = state.trainings.find(x=>x.id===formationDraft.id); Object.assign(f, data); persist(); toast('Formation mise à jour'); }
      currentView='formations'; formationDraft=null; render();
    });
  }
  document.querySelectorAll('[data-del-formation]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    confirmModal('Supprimer cette formation ?', ()=>{
      state.trainings = state.trainings.filter(x=>x.id!==b.dataset.delFormation);
      persist(); render(); toast('Formation supprimée');
    }, {danger:true, okLabel:'Supprimer'});
  }));

  // Effectifs
  const effMonth = document.getElementById('effectifs-month');
  if(effMonth) effMonth.addEventListener('change', e=>{ effectifsMonth=e.target.value; render(); });

  // Recrutement
  document.querySelectorAll('[data-recrut-filter]').forEach(b=>b.addEventListener('click',()=>{ recrutFilterStatut=b.dataset.recrutFilter; render(); }));
  const candNewBtn = document.querySelector('#candidature-new-btn');
  if(candNewBtn) candNewBtn.addEventListener('click', ()=>{
    candidatureDraft = {id:null, nom:'', poste:'', statut: state.statutsRecrutement[0], telephone:'', email:'', source:'', dateCandidature:new Date().toISOString().slice(0,10), notes:''};
    candidatureIsNew = true; currentView='candidature-edit'; render();
  });
  document.querySelectorAll('[data-edit-candidature]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    candidatureDraft = JSON.parse(JSON.stringify(state.candidatures.find(x=>x.id===b.dataset.editCandidature)));
    candidatureIsNew = false; currentView='candidature-edit'; render();
  }));
  document.querySelectorAll('[data-edit-candidature-row]').forEach(row=>row.addEventListener('click',()=>{
    candidatureDraft = JSON.parse(JSON.stringify(state.candidatures.find(x=>x.id===row.dataset.editCandidatureRow)));
    candidatureIsNew = false; currentView='candidature-edit'; render();
  }));
  if(currentView==='candidature-edit'){
    const ffpBack = document.getElementById('ffp-back');
    if(ffpBack) ffpBack.addEventListener('click', ()=>{ currentView='recrutement'; candidatureDraft=null; render(); });
    const ffpSubmit = document.getElementById('ffp-submit');
    if(ffpSubmit) ffpSubmit.addEventListener('click', ()=>{
      const data = collectDataF();
      if(!data.nom){ alert('Nom du candidat requis'); return; }
      if(candidatureIsNew){ state.candidatures.push({...data, id:uid()}); persist(); toast('Candidature enregistrée'); }
      else { const cd = state.candidatures.find(x=>x.id===candidatureDraft.id); Object.assign(cd, data); persist(); toast('Candidature mise à jour'); }
      currentView='recrutement'; candidatureDraft=null; render();
    });
  }
  document.querySelectorAll('[data-del-candidature]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    confirmModal('Supprimer cette candidature ?', ()=>{
      state.candidatures = state.candidatures.filter(x=>x.id!==b.dataset.delCandidature);
      persist(); render(); toast('Candidature supprimée');
    }, {danger:true, okLabel:'Supprimer'});
  }));
  document.querySelectorAll('[data-hire-candidature]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const cd = state.candidatures.find(x=>x.id===b.dataset.hireCandidature);
    if(!cd) return;
    personnelDraft = {id:null, nom:cd.nom, poste:state.postes.includes(cd.poste)?cd.poste:state.postes[0], affectation:state.affectations[0], statut:'Actif', telephone:cd.telephone||'', dateEmbauche:new Date().toISOString().slice(0,10), soldeConges:26};
    personnelIsNew = true; currentView='personnel-edit'; render();
  }));

  // Congé maternité
  const matNewBtn = document.querySelector('#maternity-new-btn');
  if(matNewBtn) matNewBtn.addEventListener('click', ()=>{
    maternityDraft = {id:null, personnelId: state.personnel[0]?state.personnel[0].id:'', dateDebut:'', dureeJours:98, dateAccouchementPrevue:'', dateRetourPrevue:'', remplacantId:'', statut:'Planifié', notes:'', congeLie:false};
    maternityIsNew = true; currentView='maternity-edit'; render();
  });
  document.querySelectorAll('[data-edit-maternity]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    maternityDraft = JSON.parse(JSON.stringify(state.maternityPlans.find(x=>x.id===b.dataset.editMaternity)));
    maternityIsNew = false; currentView='maternity-edit'; render();
  }));
  document.querySelectorAll('[data-edit-maternity-row]').forEach(row=>row.addEventListener('click',()=>{
    maternityDraft = JSON.parse(JSON.stringify(state.maternityPlans.find(x=>x.id===row.dataset.editMaternityRow)));
    maternityIsNew = false; currentView='maternity-edit'; render();
  }));
  if(currentView==='maternity-edit'){
    const ffpBack = document.getElementById('ffp-back');
    if(ffpBack) ffpBack.addEventListener('click', ()=>{ currentView='maternite'; maternityDraft=null; render(); });
    const ffpSubmit = document.getElementById('ffp-submit');
    if(ffpSubmit) ffpSubmit.addEventListener('click', ()=>{
      const data = collectDataF();
      if(!data.personnelId || !data.dateDebut){ alert('Personnel et date de départ requis'); return; }
      data.dureeJours = Number(data.dureeJours)||98;
      if(!data.dateRetourPrevue && data.dateDebut){ data.dateRetourPrevue = new Date(new Date(data.dateDebut).getTime()+data.dureeJours*86400000).toISOString().slice(0,10); }
      if(maternityIsNew){ state.maternityPlans.push({...data, id:uid(), congeLie:false}); persist(); toast('Plan de congé maternité créé'); }
      else { const mp = state.maternityPlans.find(x=>x.id===maternityDraft.id); Object.assign(mp, data); persist(); toast('Plan mis à jour'); }
      currentView='maternite'; maternityDraft=null; render();
    });
  }
  document.querySelectorAll('[data-del-maternity]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    confirmModal('Supprimer ce plan de congé maternité ?', ()=>{
      state.maternityPlans = state.maternityPlans.filter(x=>x.id!==b.dataset.delMaternity);
      persist(); render(); toast('Plan supprimé');
    }, {danger:true, okLabel:'Supprimer'});
  }));
  document.querySelectorAll('[data-link-conge]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const mp = state.maternityPlans.find(x=>x.id===b.dataset.linkConge);
    if(!mp) return;
    confirmModal('Créer la demande de congé associée à ce plan (statut Validé) ?', ()=>{
      const typeM = state.typesConge.find(t=>t.toLowerCase().includes('maternité')) || state.typesConge[0];
      const nbJours = leaveDays(mp.dateDebut, mp.dateRetourPrevue || mp.dateDebut);
      state.leaveRequests.push({ id:uid(), personnelId:mp.personnelId, type:typeM, statut:'Validé',
        dateDebut:mp.dateDebut, dateFin:mp.dateRetourPrevue||mp.dateDebut, nbJours,
        motif:'Congé maternité (plan lié)', dateCreation:new Date().toISOString().slice(0,10),
        demandePar: currentUser?currentUser.nomComplet:'', validePar: currentUser?currentUser.nomComplet:'', dateValidation:new Date().toISOString().slice(0,10) });
      mp.congeLie = true;
      logAudit('Congé maternité lié créé pour '+(state.personnel.find(x=>x.id===mp.personnelId)?.nom||'?'));
      persist(); render(); toast('Demande de congé créée et validée');
    });
  }));
}

/* ============ INIT ============ */
document.getElementById('mobile-menu-btn').addEventListener('click', openMobileMenu);
document.getElementById('sidebar-close-btn').addEventListener('click', closeMobileMenu);
document.getElementById('mobile-backdrop').addEventListener('click', closeMobileMenu);
document.getElementById('refresh-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = '...';
  const res = await loadRemote();
  if(currentView==='users') await loadAllUsers();
  if(res.ok){
    state = res.payload; normalizeState();
    applyTheme(state.theme);
    saveLocalCache();
    render();
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  btn.disabled = false; btn.textContent = 'Actualiser';
});

async function bootstrap(){
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-screen').innerHTML = '<div class="auth-card" style="text-align:center;color:var(--muted);font-size:13px;">Vérification de la session…</div>';
  document.getElementById('app').style.display = 'none';
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event==='SIGNED_OUT'){ currentUser=null; authTab='login'; authError=''; renderAuthScreen(); }
  });
  if(session){
    await afterAuthSuccess();
  } else {
    renderAuthScreen();
  }
}

async function init(){
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  let res = await loadRemote();
  let data = null;
  if(res.ok){
    data = res.payload;
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  if(!data){
    data = loadLocalCache();
  }
  if(!data){
    const locs = seedLocations();
    data = { fleet: seedFleet(), workOrders: [], fuelLogs: [], parts: [], pmPlans: [],
      locations: locs, plantEquipment: seedPlantEquipment(locs), notifications: [], measuringPoints: [],
      costCenters: seedCostCenters(), productionLogs: [], woCounter: 0, equipTypes: [...DEFAULT_EQUIP_TYPES], personnel: [], theme: { ...DEFAULT_THEME },
      purchaseRequests: [], purchaseOrders: [], daCounter: 0, bcCounter: 0, reservations: [], resaCounter: 0, postes: [...DEFAULT_POSTES], avisCounter: 0, stockMovements: [], auditLog: [],
      typesTravail: ["Inspection","Remplacement pièces","Intervention","Révision","Autre"], woTypes: ["Panne / Correctif","Préventif","Inspection","Amélioration"], woPriorites: ["Basse","Normale","Haute","Urgente"],
      categoriesArticle: ["Mécanique","Électrique","HSE","Consommable","Autre"],
      unitesArticle: ["Pièce (PCE)","Unité (UN)","Kilogramme (KG)","Gramme (G)","Tonne (T)","Litre (L)","Millilitre (ML)","Mètre (M)","Mètre carré (M2)","Mètre cube (M3)","Boîte (BT)","Carton (CAR)","Sachet (SAC)","Bidon (BID)","Rouleau (RLO)","Paire (PR)","Jeu / Kit (JEU)","Lot (LOT)","Bouteille (BOU)","Sac (SC)","Barre (BAR)","Autre"],
      niveauxCriticite: ["A","B","C"], typesMouvement: ["Achat","Retour","Réparation"], locationTypes: ["Site","Atelier","Ligne","Machine"],
      affectations: ["Flotte","Usine","Les deux"], fonctions: ["Technicien","Planificateur","Superviseur","Responsable","Administrateur"], niveauxApprobation: ["Technique","Financière","Stratégique"],
      leaveRequests: [], typesConge: ["Congé annuel","Congé maladie","Congé sans solde","Congé maternité / paternité","Autre"],
      trainings: [], typesFormation: ["Formation technique","Habilitation sécurité","Certification","Recyclage","Autre"],
      candidatures: [], statutsRecrutement: ["Reçue","Présélection","Entretien","Test technique","Offre","Embauché","Refusée"],
      maternityPlans: [],
      normesHSE: ["Aucune","ATEX","Électrique (NFC 18-510)","Levage","Travail en hauteur","Espace confiné","Chimique","Autre"],
      typesStrategieMaintenance: ["Préventif systématique","Conditionnel","Prédictif","Correctif"],
      objectifsMaintenance: ["Disponibilité","Sécurité","Réduction des coûts","Environnement"],
      gammesOperatoires: [] };
  } else {
    // compatibilité ascendante : ajoute le module usine si absent d'un compte existant
    if(!data.locations || data.locations.length===0){
      const locs = seedLocations();
      data.locations = locs;
      data.plantEquipment = (data.plantEquipment && data.plantEquipment.length) ? data.plantEquipment : seedPlantEquipment(locs);
    } else {
      data.plantEquipment = data.plantEquipment || [];
    }
    data.notifications = data.notifications || [];
    data.measuringPoints = data.measuringPoints || [];
    data.costCenters = (data.costCenters && data.costCenters.length) ? data.costCenters : seedCostCenters();
    data.productionLogs = data.productionLogs || [];
    data.equipTypes = (data.equipTypes && data.equipTypes.length) ? data.equipTypes : [...DEFAULT_EQUIP_TYPES];
    data.personnel = data.personnel || [];
    data.theme = data.theme || { ...DEFAULT_THEME };
    data.purchaseRequests = data.purchaseRequests || [];
    data.purchaseOrders = data.purchaseOrders || [];
    data.daCounter = data.daCounter || 0;
    data.bcCounter = data.bcCounter || 0;
    data.reservations = data.reservations || [];
    data.resaCounter = data.resaCounter || 0;
    data.postes = (data.postes && data.postes.length) ? data.postes : [...DEFAULT_POSTES];
    data.avisCounter = data.avisCounter || 0;
    data.stockMovements = data.stockMovements || [];
    data.auditLog = data.auditLog || [];
    data.typesTravail = (data.typesTravail && data.typesTravail.length) ? data.typesTravail : ["Inspection","Remplacement pièces","Intervention","Révision","Autre"];
    data.woTypes = (data.woTypes && data.woTypes.length) ? data.woTypes : ["Panne / Correctif","Préventif","Inspection","Amélioration"];
    data.woPriorites = (data.woPriorites && data.woPriorites.length) ? data.woPriorites : ["Basse","Normale","Haute","Urgente"];
    data.categoriesArticle = (data.categoriesArticle && data.categoriesArticle.length) ? data.categoriesArticle : ["Mécanique","Électrique","HSE","Consommable","Autre"];
    data.unitesArticle = (data.unitesArticle && data.unitesArticle.length) ? data.unitesArticle : ["Pièce (PCE)","Unité (UN)","Kilogramme (KG)","Gramme (G)","Tonne (T)","Litre (L)","Millilitre (ML)","Mètre (M)","Mètre carré (M2)","Mètre cube (M3)","Boîte (BT)","Carton (CAR)","Sachet (SAC)","Bidon (BID)","Rouleau (RLO)","Paire (PR)","Jeu / Kit (JEU)","Lot (LOT)","Bouteille (BOU)","Sac (SC)","Barre (BAR)","Autre"];
    data.niveauxCriticite = (data.niveauxCriticite && data.niveauxCriticite.length) ? data.niveauxCriticite : ["A","B","C"];
    data.typesMouvement = (data.typesMouvement && data.typesMouvement.length) ? data.typesMouvement : ["Achat","Retour","Réparation"];
    data.locationTypes = (data.locationTypes && data.locationTypes.length) ? data.locationTypes : ["Site","Atelier","Ligne","Machine"];
    data.affectations = (data.affectations && data.affectations.length) ? data.affectations : ["Flotte","Usine","Les deux"];
    data.fonctions = (data.fonctions && data.fonctions.length) ? data.fonctions : ["Technicien","Planificateur","Superviseur","Responsable","Administrateur"];
    data.niveauxApprobation = (data.niveauxApprobation && data.niveauxApprobation.length) ? data.niveauxApprobation : ["Technique","Financière","Stratégique"];
    data.leaveRequests = data.leaveRequests || [];
    data.typesConge = (data.typesConge && data.typesConge.length) ? data.typesConge : ["Congé annuel","Congé maladie","Congé sans solde","Congé maternité / paternité","Autre"];
    data.trainings = data.trainings || [];
    data.typesFormation = (data.typesFormation && data.typesFormation.length) ? data.typesFormation : ["Formation technique","Habilitation sécurité","Certification","Recyclage","Autre"];
    data.candidatures = data.candidatures || [];
    data.statutsRecrutement = (data.statutsRecrutement && data.statutsRecrutement.length) ? data.statutsRecrutement : ["Reçue","Présélection","Entretien","Test technique","Offre","Embauché","Refusée"];
    data.maternityPlans = data.maternityPlans || [];
    data.normesHSE = (data.normesHSE && data.normesHSE.length) ? data.normesHSE : ["Aucune","ATEX","Électrique (NFC 18-510)","Levage","Travail en hauteur","Espace confiné","Chimique","Autre"];
    data.typesStrategieMaintenance = (data.typesStrategieMaintenance && data.typesStrategieMaintenance.length) ? data.typesStrategieMaintenance : ["Préventif systématique","Conditionnel","Prédictif","Correctif"];
    data.objectifsMaintenance = (data.objectifsMaintenance && data.objectifsMaintenance.length) ? data.objectifsMaintenance : ["Disponibilité","Sécurité","Réduction des coûts","Environnement"];
    data.gammesOperatoires = data.gammesOperatoires || [];
    (data.parts||[]).forEach(p=>{
      if(p.fournisseurPrincipal===undefined) p.fournisseurPrincipal = p.fournisseur||'';
      if(!p.categorie) p.categorie = state.categoriesArticle[4];
      if(!p.statutStock) p.statutStock = 'Libre';
      if(p.seuilMax===undefined) p.seuilMax = 0;
      if(p.pointReappro===undefined) p.pointReappro = 0;
      if(p.critique===undefined) p.critique = false;
      if(!p.niveauCriticite) p.niveauCriticite = 'C';
      if(!p.unite) p.unite = 'Pièce (PCE)';
    });
    (data.notifications||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(n=>{
      if(!n.numero){ data.avisCounter++; n.numero = 'AV-'+String(data.avisCounter).padStart(4,'0'); }
    });
    // compatibilité ascendante : numérote les anciens ordres de travail et complète les nouveaux champs
    data.woCounter = data.woCounter || 0;
    (data.workOrders||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(w=>{
      if(!w.numero){ data.woCounter++; w.numero = 'OT-'+String(data.woCounter).padStart(4,'0'); }
      if(!w.poste) w.poste = data.postes[0];
      if(!w.dateDebut) w.dateDebut = w.dateCreation || '';
      if(!w.operations) w.operations = [];
      // ancien format : simple liste de textes -> nouvelles tâches avec intervenants
      w.operations = w.operations.map(op => typeof op === 'string' ? { id:uid(), description:op, affectations:[] } : op);
      if(!w.piecesUtilisees) w.piecesUtilisees = [];
      // ancien format : pièces déjà décomptées directement, on les marque réservées pour ne pas les re-réserver
      w.piecesUtilisees = w.piecesUtilisees.map(pu => pu.reserved===undefined ? {...pu, id:pu.id||uid(), reserved:true, reservationId:null} : pu);
      if(w.permisTravail===undefined) w.permisTravail = false;
      if(w.consignation===undefined) w.consignation = '';
      if(w.budgetApprouve===undefined) w.budgetApprouve = false;
      if(w.approbateurBudget===undefined) w.approbateurBudget = '';
      if(w.clotureFinanciere===undefined) w.clotureFinanciere = false;
      if(w.clotureFinancierePar===undefined) w.clotureFinancierePar = '';
      if(!w.documents) w.documents = [];
      if(w.statutAvantSuspension===undefined) w.statutAvantSuspension = null;
      if(w.archive===undefined) w.archive = false;
      if(w.motifAnnulation===undefined) w.motifAnnulation = '';
      if(w.categorieEquipement===undefined || !w.categorieEquipement){
        const inFleet = (data.fleet||[]).some(e=>e.id===w.equipementId);
        const inPlant = (data.plantEquipment||[]).some(e=>e.id===w.equipementId);
        w.categorieEquipement = inFleet ? 'Flotte' : inPlant ? 'Usine' : '';
      }
      if(w.type==='Correctif') w.type = 'Panne / Correctif';
      // migration de l'ancien statut "Ouvert" vers le nouveau workflow "Créé"
      if(w.statut==='Ouvert') w.statut = 'Créé';
    });
  }
  state = data;
  normalizeState();
  applyTheme(state.theme);
  render();
  persist();
  startPolling();
}
bootstrap();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
