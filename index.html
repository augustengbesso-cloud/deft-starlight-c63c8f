<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2NA ERP — Maintenance & Carburant</title>
<meta name="theme-color" content="#14171A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14171A; --panel:#1B1F23; --panelR:#22272C; --border:#2E353B; --borderL:#3A424A;
  --text:#ECEAE5; --muted:#8B939A; --accent:#F2A63C; --steel:#5B8CB3; --success:#4CAF6D; --danger:#E5533C;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
.oswald{font-family:'Oswald',sans-serif;}
#app{display:flex;min-height:100vh;}
/* Sidebar */
#sidebar{width:220px;flex-shrink:0;background:#101315;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.brand{padding:20px 16px;border-bottom:1px solid var(--border);}
.brand-row{display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.brand-title{font-family:'Oswald',sans-serif;letter-spacing:.05em;font-weight:600;font-size:14px;text-transform:uppercase;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;}
nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:14px;text-align:left;cursor:pointer;border-left:2px solid transparent;font-family:'Inter',sans-serif;}
.navbtn:hover{color:var(--text);}
.navbtn.active{background:var(--panelR);color:var(--accent);border-left:2px solid var(--accent);}
.navbtn svg{flex-shrink:0;}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 12px 4px;font-family:'Oswald',sans-serif;}
.nav-section:first-child{padding-top:4px;}
.sidebar-foot{padding:12px 16px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);}
/* Main */
#main{flex:1;min-width:0;overflow-y:auto;height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:24px;}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:24px;margin:0 0 2px;}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 20px;}
.headrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
/* Plate */
.plate{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 1px 3px rgba(0,0,0,.25);transition:border-color .15s ease;}
.plate:hover{border-color:var(--borderL);}
.p16{padding:16px;} .p14{padding:14px;}
/* Grid */
.grid{display:grid;gap:12px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-fleet{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
.grid-status{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}
/* KPI card */
.kpi-label{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:var(--muted);letter-spacing:.03em;}
.kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.kpi-value{font-family:'IBM Plex Mono',monospace;font-size:28px;letter-spacing:-.02em;}
.kpi-unit{font-size:12px;color:var(--muted);margin-left:4px;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
/* Buttons */
button{font-family:'Inter',sans-serif;}
.btn{padding:9px 14px;border-radius:6px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--borderL);background:var(--panelR);color:var(--text);}
.btn:hover{opacity:.85;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1A1508;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:inline-flex;}
.icon-btn:hover{color:var(--text);}
/* Inputs */
input,select,textarea{background:var(--bg);border:1px solid var(--borderL);color:var(--text);border-radius:5px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;}
label.field span{color:var(--muted);}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.formgrid .span2{grid-column:1/-1;}
/* Led */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);}
.right{text-align:right;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{background:var(--panel);border:1px solid var(--borderL);border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;margin:0;}
.modal-body{padding:20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.wo-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panelR);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;}
.wo-headband{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;margin-bottom:16px;}
.wo-headband-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:'Oswald',sans-serif;}
/* misc */
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.wrapwrap{flex-wrap:wrap;}
.card-item{background:var(--panelR);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 0;color:var(--muted);gap:8px;font-size:14px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panelR);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px;z-index:200;}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;text-transform:uppercase;background:var(--panelR);color:var(--muted);border:1px solid transparent;}
.badge-danger{background:var(--danger);color:#fff;}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:#101315;position:sticky;top:0;z-index:10;}
#sync-text{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw;}
#refresh-btn{margin-left:auto;padding:5px 10px;font-size:12px;flex-shrink:0;}
@media(max-width:700px){
  #sidebar{width:64px;}
  .brand-sub, .navbtn span.label, .sidebar-foot, .nav-section{display:none;}
  .brand-title{display:none;}
  .navbtn{justify-content:center;}
  .formgrid{grid-template-columns:1fr;}
}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);border-radius:6px;padding:3px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:5px;font-size:13px;cursor:pointer;color:var(--muted);}
.auth-tab.active{background:var(--panelR);color:var(--text);}
.auth-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;}
.auth-field span{color:var(--muted);}
.auth-error{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:16px;}
</style>
</head>
<body>
<div id="auth-screen" style="display:none;"></div>
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row"><span class="dot"></span><span class="brand-title">2NA · ERP</span></div>
      <div class="brand-sub">Maintenance & Carburant</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="fleet-count"></div>
      <div id="user-info" class="row" style="margin-top:8px;justify-content:space-between;"></div>
    </div>
  </aside>
  <main id="main">
    <div id="topbar">
      <span class="led" id="sync-dot" style="background:var(--muted)"></span>
      <span id="sync-text">Connexion…</span>
      <button class="btn btn-ghost" id="refresh-btn">Actualiser</button>
    </div>
    <div class="wrap" id="content"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============ SUPABASE (multi-device sync) ============ */
const SUPABASE_URL = "https://hfeggflrcbhzvyyejvqf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dh4nBfDMJmnj9WN2KNvdOg_cVwN4vkl";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: {
    fetch: (url, options={}) => fetch(url, { ...options, cache: 'no-store' })
  }
});

/* ============ AUTHENTIFICATION & RÔLES ============ */
const ROLE_LABELS = {
  admin: 'Administrateur', planificateur: 'Planificateur maintenance',
  technicien: 'Technicien terrain', rh: 'Responsable RH'
};
let currentUser = null; // { id, email, role, nomComplet }
let authTab = 'login';
let authError = '';

function renderAuthScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('auth-screen');
  el.style.display = 'flex';
  el.innerHTML = `
  <div class="auth-card">
    <div class="brand-row" style="justify-content:center;margin-bottom:20px;">
      <span class="dot"></span><span class="brand-title" style="font-size:16px;">2NA · ERP</span>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab ${authTab==='login'?'active':''}" data-auth-tab="login">Connexion</div>
      <div class="auth-tab ${authTab==='signup'?'active':''}" data-auth-tab="signup">Créer un compte</div>
    </div>
    <div class="auth-error">${esc(authError)}</div>
    ${authTab==='signup'?`<label class="auth-field"><span>Nom complet</span><input id="auth-nom" placeholder="Kouassi Jean"/></label>`:''}
    <label class="auth-field"><span>Email</span><input id="auth-email" type="email" placeholder="toi@exemple.com"/></label>
    <label class="auth-field"><span>Mot de passe</span><input id="auth-pass" type="password" placeholder="••••••••"/></label>
    <button class="btn btn-accent" id="auth-submit" style="width:100%;justify-content:center;margin-top:6px;">${authTab==='login'?'Se connecter':'Créer mon compte'}</button>
    ${authTab==='signup'?`<p style="font-size:11px;color:var(--muted);margin-top:12px;">Ton compte sera créé avec un accès limité (technicien) jusqu'à ce qu'un administrateur t'attribue ton rôle réel dans "Utilisateurs".</p>`:''}
  </div>`;
  document.querySelectorAll('[data-auth-tab]').forEach(t=>t.addEventListener('click',()=>{ authTab=t.dataset.authTab; authError=''; renderAuthScreen(); }));
  document.getElementById('auth-submit').addEventListener('click', handleAuthSubmit);
  [document.getElementById('auth-email'), document.getElementById('auth-pass')].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
  });
}

let pendingNomComplet = '';
async function handleAuthSubmit(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-submit');
  authError = '';
  if(!email || !pass){ authError = 'Email et mot de passe requis'; renderAuthScreen(); return; }
  btn.disabled = true; btn.textContent = '...';
  try{
    if(authTab==='login'){
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    } else {
      const nom = document.getElementById('auth-nom').value.trim();
      if(!nom){ authError = 'Nom complet requis'; renderAuthScreen(); return; }
      pendingNomComplet = nom;
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error) throw error;
      if(data.user && data.session){
        // session déjà active (confirmation email désactivée) -> on peut créer la fiche tout de suite
        try{ await sb.from('user_roles').insert({ user_id: data.user.id, email, nom_complet: nom, role: 'technicien' }); }catch(e){}
      }
    }
    await afterAuthSuccess();
  }catch(e){
    authError = (e && e.message) ? traduireErreurAuth(e.message) : String(e);
    renderAuthScreen();
  }
  btn.disabled = false; btn.textContent = authTab==='login'?'Se connecter':'Créer mon compte';
}
function traduireErreurAuth(msg){
  if(/Invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect';
  if(/already registered/i.test(msg)) return 'Un compte existe déjà avec cet email';
  if(/Password should be/i.test(msg)) return 'Mot de passe trop court (6 caractères minimum)';
  return msg;
}
async function fetchUserRole(userId, email, nomComplet){
  try{
    const { data } = await sb.from('user_roles').select('*').eq('user_id', userId).maybeSingle();
    if(data) return data;
  }catch(e){}
  // fiche absente (ex: créée avant confirmation email) -> on la crée maintenant, l'utilisateur est authentifié ici
  const fresh = { user_id:userId, email, nom_complet: nomComplet||email, role:'technicien' };
  try{ await sb.from('user_roles').insert(fresh); }catch(e){}
  return fresh;
}
async function afterAuthSuccess(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderAuthScreen(); return; }
  const roleRow = await fetchUserRole(session.user.id, session.user.email, pendingNomComplet);
  pendingNomComplet = '';
  currentUser = { id: session.user.id, email: session.user.email, role: roleRow.role, nomComplet: roleRow.nom_complet || session.user.email };
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await init();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  authTab = 'login'; authError = '';
  renderAuthScreen();
}
function canSee(navId){
  if(!currentUser) return false;
  if(currentUser.role==='admin') return true;
  const restricted = {
    planificateur: ['users'],
    technicien: ['fleet','pm','fuel','parts','floc','plant','production','measures','costs','personnel','reports','settings','users','da','bc','resa'],
    rh: ['fleet','wo','wo-edit','pm','fuel','parts','floc','plant','production','notif','measures','costs','reports','settings','users','da','bc','resa'],
  };
  const blocked = restricted[currentUser.role] || [];
  return !blocked.includes(navId);
}

const STORE_KEY = 'cigrac-erp-data';

function loadLocalCache(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveLocalCache(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

async function loadRemote(){
  try{
    const { data, error } = await sb.from('erp_data').select('data, updated_at').eq('id','main').maybeSingle();
    if(error) return { ok:false, error: error.message || JSON.stringify(error) };
    if(!data) return { ok:false, error: "Aucune ligne trouvée (id='main') dans la table erp_data" };
    return { ok:true, payload: data.data, updatedAt: data.updated_at };
  }catch(e){
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}
async function saveRemote(){
  try{
    const { error } = await sb.from('erp_data').upsert({ id:'main', data: state, updated_at: new Date().toISOString() });
    if(error){ setSyncStatus(false, 'écriture: '+error.message); return; }
    setSyncStatus(true, 'enregistré');
  }catch(e){ setSyncStatus(false, 'écriture: '+((e&&e.message)||String(e))); }
}
function persist(){
  saveLocalCache();
  saveRemote();
}
function setSyncStatus(ok, detail){
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  const now = new Date().toLocaleTimeString('fr-FR');
  const full = ok
    ? `OK ${now}${detail ? ' · '+detail : ''}`
    : `ERREUR ${now} · ${detail || 'inconnue'}`;
  if(dot) dot.style.background = ok ? 'var(--success)' : 'var(--danger)';
  if(txt){ txt.textContent = full; txt.title = full; }
}
let pollTimer = null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const modalOpen = document.getElementById('modal-root').innerHTML.trim() !== '';
    if(modalOpen) return;
    const res = await loadRemote();
    if(res.ok){
      const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
      setSyncStatus(true, 'donnée du serveur: '+stamp);
      const changed = JSON.stringify(res.payload) !== JSON.stringify(state);
      if(changed){
        state = res.payload;
        saveLocalCache();
        render();
      }
    } else {
      setSyncStatus(false, res.error);
    }
  }, 6000);
}

/* ============ MINI GRAPHIQUES (canvas, sans librairie) ============ */
function drawBarChart(canvas, labels, values, color){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const max = Math.max(1, ...values);
  const padL=8, padB=22, padT=10, padR=8;
  const chartW = W-padL-padR, chartH = H-padB-padT;
  const bw = chartW/values.length*0.6;
  const gap = chartW/values.length;
  ctx.font = '10px Inter, sans-serif';
  values.forEach((v,i)=>{
    const h = (v/max)*chartH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-h);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(x, y, bw, h);
    ctx.globalAlpha = 1;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x+bw/2, H-6);
  });
}
function drawDonut(canvas, segments){
  // segments: [{label, value, color}]
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=W/2, cy=H/2, rOuter=Math.min(W,H)/2-4, rInner=rOuter*0.6;
  let start = -Math.PI/2;
  segments.forEach(s=>{
    const angle = (s.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,rOuter,start,start+angle);
    ctx.arc(cx,cy,rInner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    start += angle;
  });
}

/* ============ KPIs ============ */
function computeKpis(){
  const total = state.fleet.length || 1;
  const dispo = state.fleet.filter(e=>e.statut==="Opérationnel").length;
  const pannes = state.fleet.filter(e=>e.statut==="En panne").length;
  const disponibilite = Math.round((dispo/total)*1000)/10;
  const closed = state.workOrders.filter(w=>w.type==="Correctif" && w.statut==="Terminé" && w.dateCreation && w.dateFin);
  const mttrH = closed.length ? closed.reduce((a,w)=>a+Math.max(0,(new Date(w.dateFin)-new Date(w.dateCreation))/36e5),0)/closed.length : 0;
  const coutMaintenance = state.workOrders.reduce((a,w)=>a+Number(w.cout||0),0);
  const coutCarburant = state.fuelLogs.reduce((a,f)=>a+Number(f.cout||0),0);
  const litresTotal = state.fuelLogs.reduce((a,f)=>a+Number(f.quantite||0),0);
  const ouverts = state.workOrders.filter(w=>w.statut==="Ouvert"||w.statut==="En cours").length;
  const partsBas = state.parts.filter(p=>Number(p.quantite)<=Number(p.seuil)).length;

  const totalPlant = state.plantEquipment.length || 1;
  const dispoPlant = state.plantEquipment.filter(e=>e.statut==="Opérationnel").length;
  const disponibilitePlant = Math.round((dispoPlant/totalPlant)*1000)/10;
  const notifOuvertes = state.notifications.filter(n=>n.statut!=="Clôturée" && n.statut!=="Convertie en OT").length;
  const oeeList = state.productionLogs.map(oeeOf).filter(v=>v!==null);
  const oeeMoyen = oeeList.length ? Math.round(oeeList.reduce((a,b)=>a+b,0)/oeeList.length*10)/10 : null;
  const daOuvertes = state.purchaseRequests.filter(d=>d.statut==="Ouverte").length;
  const bcEnAttente = state.purchaseOrders.filter(b=>b.statut!=="Réceptionné").length;

  return {disponibilite, pannes, mttrH, coutMaintenance, coutCarburant, litresTotal, ouverts, partsBas, total,
    disponibilitePlant, notifOuvertes, oeeMoyen, totalPlant: state.plantEquipment.length, daOuvertes, bcEnAttente};
}
function oeeOf(p){
  const fonct = Number(p.tempsFonctionnementMin||0), arret = Number(p.tempsArretMin||0);
  const dispo = (fonct+arret)>0 ? fonct/(fonct+arret) : null;
  const perf = p.quantitePrevue>0 ? Math.min(1, Number(p.quantiteProduite||0)/Number(p.quantitePrevue)) : null;
  const qual = p.quantiteProduite>0 ? Math.max(0,(Number(p.quantiteProduite)-Number(p.piecesRebut||0))/Number(p.quantiteProduite)) : null;
  if(dispo===null||perf===null||qual===null) return null;
  return dispo*perf*qual*100;
}

  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8B939A';
  drawBarChart(document.getElementById('chart-maint-cost'), months.map(monthLabel), maintByMonth, accent);
  drawBarChart(document.getElementById('chart-fuel-cost'), months.map(monthLabel), fuelByMonth, steel);
  const woColors = { 'Ouvert':muted, 'En cours':accent, 'Terminé':steel, 'Clôturé':success };
  drawDonut(document.getElementById('chart-wo-status'), WO_STATUTS.map(s=>({label:s, value: state.workOrders.filter(w=>w.statut===s).length || 0.0001, color: woColors[s]})));
  const persColors = [accent, steel, success];
  drawDonut(document.getElementById('chart-personnel'), AFFECTATIONS.map((a,i)=>({label:a, value: state.personnel.filter(p=>p.statut==='Actif'&&p.affectation===a).length || 0.0001, color: persColors[i%3]})));
}

function openTypesModal(){

function renderTypesModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="types-overlay">
    <div class="modal">
      <div class="modal-head"><h3>Familles d'équipement</h3><button class="icon-btn" id="types-close">${ICONS.close}</button></div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:12px;max-height:280px;overflow-y:auto;">
          ${state.equipTypes.map((t,i)=>`<div class="between card-item" style="padding:6px 10px;"><span style="font-size:13px;">${esc(t)}</span><button class="icon-btn" data-type-del="${i}">${ICONS.trash}</button></div>`).join('')}
        </div>
        <div class="row">
          <input id="type-new-input" placeholder="Nouveau type (ex: Chariot élévateur)" style="flex:1;"/>
          <button class="btn btn-ghost" id="type-add" type="button">${ICONS.plus} Ajouter</button>
        </div>
        <div class="modal-actions"><button class="btn btn-accent" id="types-done">Terminé</button></div>
      </div>
    </div>
  </div>`;
  document.getElementById('types-overlay').addEventListener('click', e=>{ if(e.target.id==='types-overlay') closeTypesModal(); });
  document.getElementById('types-close').addEventListener('click', closeTypesModal);
  document.getElementById('types-done').addEventListener('click', closeTypesModal);
  document.getElementById('type-add').addEventListener('click', ()=>{
    const input = document.getElementById('type-new-input');
    const val = input.value.trim();
    if(val && !state.equipTypes.includes(val)){ state.equipTypes.push(val); persist(); renderTypesModal(); }
  });
  document.querySelectorAll('[data-type-del]').forEach(b=>b.addEventListener('click',()=>{
    const i = Number(b.dataset.typeDel);
    const used = [...state.fleet, ...state.plantEquipment].some(e=>e.type===state.equipTypes[i]);
    if(used && !confirm('Ce type est utilisé par au moins un équipement. Le supprimer quand même ?')) return;
    state.equipTypes.splice(i,1); persist(); renderTypesModal();
  }));
}
function closeTypesModal(){ document.getElementById('modal-root').innerHTML=''; render(); }

function wireWOEditor(){
  const w = woDraft;
  if(!w) return;
  const back = ()=>{ currentView='wo'; woDraft=null; render(); };
  const backBtn = document.getElementById('wo-back'); if(backBtn) backBtn.addEventListener('click', back);
  const backBtn2 = document.getElementById('wo-back-2'); if(backBtn2) backBtn2.addEventListener('click', back);

  const opAdd = document.getElementById('wo-op-add');
  if(opAdd) opAdd.addEventListener('click', ()=>{
    const input = document.getElementById('wo-op-input');
    if(input.value.trim()){ w.operations.push(input.value.trim()); render(); }
  });
  document.querySelectorAll('[data-wo-op-del]').forEach(b=>b.addEventListener('click',()=>{
    w.operations.splice(Number(b.dataset.woOpDel),1); render();
  }));
  const partAddBtn = document.getElementById('wo-part-add');
  if(partAddBtn) partAddBtn.addEventListener('click', ()=>{
    const partId = document.getElementById('wo-part-select').value;
    const qty = Number(document.getElementById('wo-part-qty').value)||1;
    if(partId){ w.piecesUtilisees.push({partId, quantite:qty}); render(); }
  });
  document.querySelectorAll('[data-wo-part-del]').forEach(b=>b.addEventListener('click',()=>{
    w.piecesUtilisees.splice(Number(b.dataset.woPartDel),1); render();
  }));

  const saveHandler = ()=>{
    w.equipementId = document.getElementById('wo-f-equip').value;
    w.titre = document.getElementById('wo-f-titre').value;
    w.description = document.getElementById('wo-f-desc').value;
    w.type = document.getElementById('wo-f-type').value;
    w.typeTravail = document.getElementById('wo-f-typetravail').value;
    w.poste = document.getElementById('wo-f-poste').value;
    w.priorite = document.getElementById('wo-f-priorite').value;
    w.statut = document.getElementById('wo-f-statut').value;
    w.dateDebut = document.getElementById('wo-f-debut').value;
    w.dateFin = document.getElementById('wo-f-fin').value;
    w.technicien = document.getElementById('wo-f-tech').value;
    w.cout = Number(document.getElementById('wo-f-cout').value)||0;
    w.dateCreation = w.dateCreation || w.dateDebut;
    if(!w.titre || !w.equipementId){ alert('Libellé et équipement requis'); return; }
    if((w.statut==='Terminé' || w.statut==='Clôturé') && !w.dateFin) w.dateFin = new Date().toISOString().slice(0,10);
    const eqForStatus = [...state.fleet,...state.plantEquipment].find(x=>x.id===w.equipementId);

    if(woIsNew){
      state.woCounter = (state.woCounter||0)+1;
      w.numero = 'OT-'+String(state.woCounter).padStart(4,'0');
      w.id = uid();
      state.workOrders.push(w);
      w.piecesUtilisees.forEach(pu=>{
        const pt = state.parts.find(p=>p.id===pu.partId);
        if(pt) pt.quantite = Math.max(0, Number(pt.quantite) - Number(pu.quantite));
      });
      if(eqForStatus){
        if(w.statut==='Terminé' || w.statut==='Clôturé') eqForStatus.statut='Opérationnel';
        else eqForStatus.statut='En maintenance';
      }
      persist(); currentView='wo'; woDraft=null; render(); toast('Ordre de travail '+w.numero+' créé');
    } else {
      const idx = state.workOrders.findIndex(x=>x.id===w.id);
      if(idx>-1) state.workOrders[idx] = w;
      if(eqForStatus){
        if(w.statut==='Terminé' || w.statut==='Clôturé') eqForStatus.statut='Opérationnel';
        else if(w.statut!=='Ouvert' || eqForStatus.statut!=='En panne') eqForStatus.statut='En maintenance';
      }
      persist(); currentView='wo'; woDraft=null; render(); toast('Ordre de travail mis à jour');
    }
  };
  const saveBtn = document.getElementById('wo-save'); if(saveBtn) saveBtn.addEventListener('click', saveHandler);
  const saveBtn2 = document.getElementById('wo-save-2'); if(saveBtn2) saveBtn2.addEventListener('click', saveHandler);
}

/* ============ PREVENTIVE ============ */
function pmStatus(p, em){
  const now = new Date();
  if(p.type==='Heures' || p.type==='Kilométrage'){
    const eq = em[p.equipementId];
    const unite = p.type==='Heures' ? 'h' : 'km';
    const valeurActuelle = eq ? Number(p.type==='Heures' ? eq.heures : eq.km) || 0 : 0;
    const prochaineValeur = Number(p.derniereValeur||0) + Number(p.intervalle||0);
    const restant = prochaineValeur - valeurActuelle;
    const seuilUrgent = p.type==='Heures' ? 20 : 200;
    const urgent = restant <= seuilUrgent;
    const label = restant<=0 ? `Dépassé de ${Math.abs(Math.round(restant))} ${unite}` : `Reste ${Math.round(restant)} ${unite} (échéance à ${prochaineValeur} ${unite})`;
    return { urgent, label };
  }
  const daysLeft = p.prochaine? Math.round((new Date(p.prochaine)-now)/864e5): null;
  const urgent = daysLeft!==null && daysLeft<=7;
  const label = p.prochaine ? `Échéance : ${p.prochaine}${daysLeft!==null?` (${daysLeft}j)`:''}` : 'Non planifié';
  return { urgent, label };
}
function viewPM(){
  const em = equipMap();
  const sorted = [...state.pmPlans].sort((a,b)=> (pmStatus(a,em).urgent===pmStatus(b,em).urgent)?0:(pmStatus(a,em).urgent?-1:1));
  return `
  <div class="headrow">
    <div><h1>Maintenance préventive</h1><p class="subtitle" style="margin:0;">Planification par date ou par compteur (heures/km)</p></div>
    <button class="btn btn-accent" data-open-pm="new">${ICONS.plus} Nouveau plan</button>
  </div>
  ${sorted.length===0?`<div class="plate p16"><div class="empty">${ICONS.calendar}<span>Aucun plan préventif défini.</span></div></div>`:
  `<div style="display:flex;flex-direction:column;gap:8px;">
  ${sorted.map(p=>{
    const st = pmStatus(p, em);
    return `<div class="plate p14 between wrapwrap" style="gap:12px;">
      <div class="row"><span class="led" style="background:${st.urgent?'var(--danger)':'var(--success)'}"></span>
        <div><div style="font-size:13px;font-weight:500;">${esc(p.tache)}</div>
        <div style="font-size:12px;color:var(--muted);">${em[p.equipementId]?.code||'—'} · <span class="badge">${p.type||'Date'}</span>${p.type==='Date'||!p.type?` · tous les ${p.frequenceJours} j`:` · tous les ${p.intervalle} ${p.type==='Heures'?'h':'km'}`}</div></div>
      </div>
      <div class="row">
        <span style="font-size:12px;color:${st.urgent?'var(--danger)':'var(--muted)'}">${st.label}</span>
        <button class="icon-btn" data-open-pm="${p.id}">${ICONS.edit}</button>
        <button class="icon-btn" data-del-pm="${p.id}">${ICONS.trash}</button>
      </div>
    </div>`;
  }).join('')}
  </div>`}`;
}

let pmDraft = null;
let pmIsNew = false;
function blankPM(){
  return { id:null, equipementId: state.fleet[0]?.id||state.plantEquipment[0]?.id||'', tache:'', type:'Date',

function openPMModal(id){
  pmIsNew = (id==='new');

}
function closePMModal(){ document.getElementById('modal-root').innerHTML=''; pmDraft=null; }
function renderPMModal(){
  const p = pmDraft;
  const allEquip = [...state.fleet.map(e=>({...e,grp:'Flotte'})), ...state.plantEquipment.map(e=>({...e,grp:'Usine'}))];
  const equipOpts = allEquip.map(e=>`<option value="${e.id}" ${p.equipementId===e.id?'selected':''}>[${e.grp}] ${e.code} — ${e.nom}</option>`).join('');
  const isCounter = p.type==='Heures' || p.type==='Kilométrage';
  const unite = p.type==='Heures' ? 'h' : 'km';

  const body = `
  <div class="formgrid">
    <label class="field span2"><span>Équipement</span><select id="pm-f-equip">${equipOpts}</select></label>
    <label class="field span2"><span>Tâche</span><input id="pm-f-tache" value="${esc(p.tache)}" placeholder="Vidange moteur + filtres"/></label>
    <label class="field span2"><span>Type de déclenchement</span><select id="pm-f-type">${PM_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
    ${!isCounter ? `
    <label class="field"><span>Fréquence (jours)</span><input type="number" id="pm-f-freq" value="${p.frequenceJours||90}"/></label>
    <label class="field"><span>Dernière réalisation</span><input type="date" id="pm-f-derniere" value="${p.derniere||''}"/></label>
    ` : `
    <label class="field"><span>Intervalle (${unite})</span><input type="number" id="pm-f-intervalle" value="${p.intervalle||(p.type==='Heures'?250:5000)}"/></label>
    <label class="field"><span>Dernier relevé au moment de l'entretien (${unite})</span><input type="number" id="pm-f-derniereValeur" value="${p.derniereValeur||0}"/></label>
    `}
  </div>
  <div class="modal-actions">
    <button class="btn btn-ghost" id="pm-cancel">Annuler</button>
    <button class="btn btn-accent" id="pm-save">Enregistrer</button>
  </div>`;

  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="pm-overlay">
    <div class="modal">
      <div class="modal-head"><h3>${pmIsNew?"Nouveau plan préventif":"Modifier le plan"}</h3><button class="icon-btn" id="pm-close">${ICONS.close}</button></div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;

  document.getElementById('pm-overlay').addEventListener('click', e=>{ if(e.target.id==='pm-overlay') closePMModal(); });
  document.getElementById('pm-close').addEventListener('click', closePMModal);
  document.getElementById('pm-cancel').addEventListener('click', closePMModal);
  document.getElementById('pm-f-type').addEventListener('change', (e)=>{ p.type = e.target.value; renderPMModal(); });

  document.getElementById('pm-save').addEventListener('click', ()=>{
    p.equipementId = document.getElementById('pm-f-equip').value;
    p.tache = document.getElementById('pm-f-tache').value;
    p.type = document.getElementById('pm-f-type').value;
    if(p.type==='Heures' || p.type==='Kilométrage'){
      p.intervalle = Number(document.getElementById('pm-f-intervalle').value)||0;
      p.derniereValeur = Number(document.getElementById('pm-f-derniereValeur').value)||0;
    } else {
      p.frequenceJours = Number(document.getElementById('pm-f-freq').value)||0;
      p.derniere = document.getElementById('pm-f-derniere').value;
      if(p.derniere && p.frequenceJours){ const d=new Date(p.derniere); d.setDate(d.getDate()+Number(p.frequenceJours)); p.prochaine=d.toISOString().slice(0,10); }
    }
    if(!p.tache || !p.equipementId){ alert('Tâche et équipement requis'); return; }
    if(pmIsNew){ p.id = uid(); state.pmPlans.push(p); persist(); closePMModal(); render(); toast('Plan préventif ajouté'); }
    else { const idx = state.pmPlans.findIndex(x=>x.id===p.id); if(idx>-1) state.pmPlans[idx]=p; persist(); closePMModal(); render(); toast('Plan préventif mis à jour'); }
  });
}

/* ============ CENTRES DE COÛTS ============ */
function viewCosts(){
  const em = equipMap();
  const spentByCC = {};
  state.workOrders.forEach(w=>{
    const eq = em[w.equipementId];
    const cc = eq && eq.centreCoutId ? eq.centreCoutId : null;
    if(cc) spentByCC[cc] = (spentByCC[cc]||0) + Number(w.cout||0);
  });
  const damByCC = Object.fromEntries(state.purchaseRequests.map(d=>[d.id, d.costCenterId]));
  state.purchaseOrders.forEach(bc=>{
    const cc = damByCC[bc.purchaseRequestId];
    if(cc) spentByCC[cc] = (spentByCC[cc]||0) + Number(bc.montant||0);
  });
  return `
  <div class="headrow">
    <div><h1>Centres de coûts</h1><p class="subtitle" style="margin:0;">Budget maintenance vs dépenses réelles (OT + Achats)</p></div>
    <button class="btn btn-accent" data-open-modal="cc-new">${ICONS.plus} Nouveau centre de coût</button>
  </div>
  ${state.costCenters.length===0?`<div class="plate p16"><div class="empty">${ICONS.wallet}<span>Aucun centre de coût défini.</span></div></div>`:
  `<div class="grid grid-fleet">
  ${state.costCenters.map(c=>{
    const spent = spentByCC[c.id]||0; const budget = Number(c.budgetAnnuel||0);
    const pct = budget>0 ? Math.min(100, Math.round(spent/budget*100)) : null;
    return `<div class="plate p16">
      <div class="between" style="align-items:flex-start;">
        <div><span class="mono" style="font-size:14px;">${esc(c.code)}</span><div style="font-size:12px;color:var(--muted);">${esc(c.nom)}</div></div>
        <div class="row"><button class="icon-btn" data-edit-cc="${c.id}">${ICONS.edit}</button><button class="icon-btn" data-del-cc="${c.id}">${ICONS.trash}</button></div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted);">Dépensé <span class="mono" style="color:var(--text)">${fmt(spent)}</span> / Budget <span class="mono" style="color:var(--text)">${fmt(budget)}</span> FCFA</div>
      ${budget>0?`<div style="background:var(--panelR);border-radius:4px;height:6px;margin-top:8px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${pct>=90?'var(--danger)':pct>=70?'var(--accent)':'var(--success)'}"></div></div>`:''}
    </div>`;
  }).join('')}
  </div>`}`;
}

/* ============ MODALS ============ */
function openModal(title, bodyHtml, onSave){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="modal-close">${ICONS.close}</button></div>
      <div class="modal-body">
        <div id="modal-form">${bodyHtml}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Annuler</button>
          <button class="btn btn-accent" id="modal-save">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const data = {};
    document.querySelectorAll('#modal-form [data-f]').forEach(el=>{ data[el.dataset.f] = el.value; });
    onSave(data);
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============ CRUD HANDLERS ============ */
function attachHandlers(){
  // global nav-from-content
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{ currentView=b.dataset.nav; render(); }));

  // Fleet
  const fs = document.getElementById('fleet-search');
  if(fs) fs.addEventListener('input', e=>{ fleetSearch=e.target.value; render(); document.getElementById('fleet-search').focus(); document.getElementById('fleet-search').selectionStart = document.getElementById('fleet-search').value.length; });
  const bo = document.querySelector('[data-open-modal="fleet-new"]');
  if(bo) bo.addEventListener('click', ()=>{
    const e = {id:null, code:"", nom:"", type:state.equipTypes[0], statut:"Opérationnel", heures:0, dernierEntretien:"", prochainEntretien:"", conso100h:15, centreCoutId:""};
    openModal('Nouvel engin', fleetForm(e), (data)=>{
      if(!data.code||!data.nom){ alert('Code et nom requis'); return; }
      state.fleet.push({...data, id:uid(), heures:Number(data.heures), km:Number(data.km), conso100h:Number(data.conso100h), centreCoutId:data.centreCoutId||null});
      persist(); closeModal(); render(); toast('Engin ajouté à la flotte');
    });
  });
  document.querySelectorAll('[data-edit-fleet]').forEach(b=>b.addEventListener('click',()=>{
    const e = state.fleet.find(x=>x.id===b.dataset.editFleet);
    openModal("Modifier l'engin", fleetForm(e), (data)=>{
      Object.assign(e, data, {heures:Number(data.heures), km:Number(data.km), conso100h:Number(data.conso100h), centreCoutId:data.centreCoutId||null});
      persist(); closeModal(); render(); toast('Engin mis à jour');
    });
  }));
  document.querySelectorAll('[data-del-fleet]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cet engin ?')) return;
    state.fleet = state.fleet.filter(x=>x.id!==b.dataset.delFleet);
    persist(); render(); toast('Engin supprimé');
  }));

  // Work orders
  const wf = document.getElementById('wo-filter');
  if(wf) wf.addEventListener('change', e=>{ woFilter=e.target.value; render(); });
  document.querySelectorAll('[data-open-wo]').forEach(b=>b.addEventListener('click',()=>{
    openWOEditor(b.dataset.openWo);
  }));
  document.querySelectorAll('[data-del-wo]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cet ordre de travail ?')) return;
    state.workOrders = state.workOrders.filter(x=>x.id!==b.dataset.delWo);
    persist(); render(); toast('Ordre de travail supprimé');
  }));
  document.querySelectorAll('[data-close-wo]').forEach(b=>b.addEventListener('click',()=>{
    const w = state.workOrders.find(x=>x.id===b.dataset.closeWo);
    if(!w) return;
    if(!confirm('Clôturer techniquement et financièrement '+w.numero+' ?')) return;
    w.statut = 'Clôturé';
    if(!w.dateFin) w.dateFin = new Date().toISOString().slice(0,10);
    const eq = equipMap()[w.equipementId]; if(eq) eq.statut='Opérationnel';
    persist(); render(); toast(w.numero+' clôturé');
  }));
  if(currentView==='wo-edit') wireWOEditor();

  // PM

document.getElementById('refresh-btn').addEventListener('click', async ()=>{

  btn.disabled = true; btn.textContent = '...';

  if(res.ok){
    state = res.payload;
    saveLocalCache();
    render();
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  btn.disabled = false; btn.textContent = 'Actualiser';
});

async function bootstrap(){
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-screen').innerHTML = '<div class="auth-card" style="text-align:center;color:var(--muted);font-size:13px;">Vérification de la session…</div>';
  document.getElementById('app').style.display = 'none';
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event==='SIGNED_OUT'){ currentUser=null; authTab='login'; authError=''; renderAuthScreen(); }
  });
  if(session){
    await afterAuthSuccess();
  } else {
    renderAuthScreen();
  }
}

async function init(){
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  let res = await loadRemote();
  let data = null;
  if(res.ok){
    data = res.payload;
    const stamp = res.updatedAt ? new Date(res.updatedAt).toLocaleTimeString('fr-FR') : '?';
    setSyncStatus(true, 'donnée du serveur: '+stamp);
  } else {
    setSyncStatus(false, res.error);
  }
  if(!data){
    data = loadLocalCache();
  }
  if(!data){
    const locs = seedLocations();
    data = { fleet: seedFleet(), workOrders: [], fuelLogs: [], parts: [], pmPlans: [],
      locations: locs, plantEquipment: seedPlantEquipment(locs), notifications: [], measuringPoints: [],
      costCenters: seedCostCenters(), productionLogs: [], woCounter: 0, equipTypes: [...DEFAULT_EQUIP_TYPES], personnel: [], theme: { ...DEFAULT_THEME },
      purchaseRequests: [], purchaseOrders: [], daCounter: 0, bcCounter: 0, reservations: [], resaCounter: 0, postes: [...DEFAULT_POSTES], avisCounter: 0 };
  } else {
    // compatibilité ascendante : ajoute le module usine si absent d'un compte existant
    if(!data.locations || data.locations.length===0){
      const locs = seedLocations();
      data.locations = locs;
      data.plantEquipment = (data.plantEquipment && data.plantEquipment.length) ? data.plantEquipment : seedPlantEquipment(locs);
    } else {
      data.plantEquipment = data.plantEquipment || [];
    }
    data.notifications = data.notifications || [];
    data.measuringPoints = data.measuringPoints || [];
    data.costCenters = (data.costCenters && data.costCenters.length) ? data.costCenters : seedCostCenters();
    data.productionLogs = data.productionLogs || [];
    data.equipTypes = (data.equipTypes && data.equipTypes.length) ? data.equipTypes : [...DEFAULT_EQUIP_TYPES];
    data.personnel = data.personnel || [];
    data.theme = data.theme || { ...DEFAULT_THEME };
    data.purchaseRequests = data.purchaseRequests || [];
    data.purchaseOrders = data.purchaseOrders || [];
    data.daCounter = data.daCounter || 0;
    data.bcCounter = data.bcCounter || 0;
    data.reservations = data.reservations || [];
    data.resaCounter = data.resaCounter || 0;
    data.postes = (data.postes && data.postes.length) ? data.postes : [...DEFAULT_POSTES];
    data.avisCounter = data.avisCounter || 0;
    (data.notifications||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(n=>{
      if(!n.numero){ data.avisCounter++; n.numero = 'AV-'+String(data.avisCounter).padStart(4,'0'); }
    });
    // compatibilité ascendante : numérote les anciens ordres de travail et complète les nouveaux champs
    data.woCounter = data.woCounter || 0;
    (data.workOrders||[]).sort((a,b)=>(a.dateCreation||'').localeCompare(b.dateCreation||'')).forEach(w=>{
      if(!w.numero){ data.woCounter++; w.numero = 'OT-'+String(data.woCounter).padStart(4,'0'); }
      if(!w.poste) w.poste = state.postes[0];
      if(!w.dateDebut) w.dateDebut = w.dateCreation || '';
      if(!w.operations) w.operations = [];
      if(!w.piecesUtilisees) w.piecesUtilisees = [];
    });
  }
  state = data;
  applyTheme(state.theme);
  render();
  persist();
  startPolling();
}
bootstrap();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
